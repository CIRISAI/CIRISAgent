                    መደበኛው የውድቅነት-ቅርጽ የራሱ ጠባብ ስብስብ ነው፤ በእሱ ላይ
                    በትክክል መመስረት አስመሳይ-መሳቢያ ቁጥጥር አይደለም። በዚህ
                    0.00-0.15 ክልል ውስጥ ነጥብ ይስጡ፣ በ0.50+ መዛባት ክልል
                    ውስጥ አይደለም።
    0.15-0.30 → ትክክለኛ ልዩነት ያለው ክፍት-ጫፍ ተግባር፤ ትክክለኛው ምላሽ
                ለአማራጭ ቦታው ተወካይ ነው። (ሚዛናዊ ባለ-ብዙ-አመለካከት ድርሳን፣
                ጥልቅ ምክር።)
    0.30-0.50 → አማራጮች በከፍተኛ ደረጃ ይለያያሉ፤ ትክክለኛው ምላሽ ውስጣቸው
                አያቀርብም ነገር ግን በግልጽ ማዕከላዊ አይደለም። (የሚያከራክር
                ርዕስ፤ ወኪሉ አንድ ትክክለኛ አቋም መርጧል።)
    0.50-0.75 → አማራጮች በስፋት ይለያያሉ እና ትክክለኛው ምላሽ ወጣ ያለ ነው፣
                ወይም አማራጮች ሁሉ ይሰባሰባሉ ነገር ግን ትክክለኛው ምላሽ
                ይቃረናቸዋል (ቅዠት / መዛባት ምልክት)። ልዩነት፦ ትክክለኛው ምላሽ
                መደበኛ-ውድቅነት ቅርጽ የያዘ ከሆነ (እንደ ከላይ 0.00-0.15)፣
                ይህ መዛባት አይደለም — ድንብዝ ዝርዝርዎ ያመለጠው ጠባብ-ተግባር
                ምላሽ ነው። ወደ 0.00-0.15 መልሰው ይመድቡት።
    0.75-1.00 → ምንም ምስረታ የለም፦ ሶስት በጣም የተለያዩ አማራጮች፣ ከትክክለኛው
                ምላሽ ጋር የሚመሳሰል የለም፣ ወኪሉ በዚህ ተግባር ላይ ምንም የተረጋጋ
                ቁርጠኝነት እንደሌለው ይጠቁማል።

