# The localization pipeline, once. The three lane workflows call this.
#
# DERIVED from CIRISClient .github/workflows/i18n-lane.yml (provenance in
# localization/upstream/vendored.json; account in localization/VENDORED.md). The
# pipeline code it runs -- localization/localize.py and friends -- is vendored
# byte-identical; this workflow is ours, adapted to agent paths:
#
#   - no CIRISServer `.emitters` checkout and no client bundle mirrors: the
#     agent has neither. The client gate (check_localization_sync.py
#     --server-src) is replaced by the agent's own gates below.
#   - a TARGET input: `accord` runs the Accord segment adapter
#     (localization/accord_localize.py); `ui` runs localize.py against the
#     agent's own string bundle, ciris_engine/data/localized/{lang}.json.
#   - the vendoring digest is CHECKED, never re-recorded: a lane writes
#     translations, not vendored code, so a lane that changes a vendored file
#     is a defect.
#
# Secrets: OPENROUTER_API_KEY drives the model ladder (every rung, including a
# family the Anthropic SDK cannot reach). ANTHROPIC_API_KEY is honoured when
# present. LOCALIZE_PROVIDER picks when both are set; on the Anthropic path the
# judge is the drafter's family, so localize.py refuses unless
# LOCALIZE_REVIEW_MODEL is set deliberately.
#
# Inputs reach the shell through env, never by ${{ }} interpolation into the
# script body; localization/run_lane.sh builds the command from them.
#
# SHARDED (agent-only; CIRISClient runs one job). localize.py walks the locales
# one at a time with blocking calls, so one job is 28 pipelines in a row. Here:
#
#   plan     the whole-run dry-run (so --max-keys bounds the RUN, not a shard)
#            and the deterministic locale assignment (localization/lane_shards.py).
#   shard    N parallel copies of the same lane, each over a disjoint LANGS
#            subset. Read-only token: a shard NEVER commits or pushes. It uploads
#            only its own locale files, its report, its log and its exit status.
#   collect  the one writer. Refuses any shard whose artifact holds a file
#            outside its own locales, runs the gate over the combined tree,
#            merges the reports (spend summed), and commits ONCE.
#
# Fail-closed is unchanged: a shard that exits 1 (keys the ladder could not
# render, or the reviewer rejected) still banks its accepted values -- the lane
# never writes a rejected one -- and the run fails. One writer per branch is
# still the callers' i18n-write-<ref> concurrency group.

name: i18n lane

on:
  workflow_call:
    inputs:
      target:
        description: "accord | ui"
        required: false
        default: "accord"
        type: string
      lane:
        description: "translate | evaluate | repair"
        required: true
        type: string
      accord_version:
        description: "accord version to translate (target=accord); its English source must exist"
        required: false
        default: "1.3"
        type: string
      tm_version:
        description: "previous accord used as translation memory (target=accord)"
        required: false
        default: "1.2b"
        type: string
      accord_stem:
        description: "target filename stem: accord | constitution_ethics (<stem>_<version>_<lang>.txt)"
        required: false
        default: "accord"
        type: string
      tm_stem:
        description: "filename stem of the translation-memory edition"
        required: false
        default: "accord"
        type: string
      seed_exact_tm:
        description: "lines whose English is unchanged from the TM edition take its shipped translation"
        required: false
        default: false
        type: boolean
      extra_tm:
        description: "target=accord: anchor terminology on the ciris-website + CIRISClient strings (pinned read-only checkouts) and the agent UI; anchors only, never values"
        required: false
        default: true
        type: boolean
      accord_units:
        description: "accord units, space-separated (section0 v1 .. v9 annexes). Empty = every unit, one at a time"
        required: false
        default: ""
        type: string
      keys:
        description: "fnmatch patterns over flat dotted keys, space-separated. Empty = whatever is missing"
        required: false
        default: ""
        type: string
      langs:
        description: "language codes, space-separated. Empty = all 28"
        required: false
        default: ""
        type: string
      max_keys:
        description: "refuse runs larger than this many key-values (accord: per unit)"
        required: false
        default: "400"
        type: string
      mode:
        description: "fast (batch is refused by run_lane.sh: OpenRouter :batch slugs 404 on chat/completions)"
        required: false
        default: "fast"
        type: string
      commit:
        description: "push the result to the branch (false = report only)"
        required: false
        default: true
        type: boolean
      ref:
        description: "ref to check out and push to"
        required: false
        default: ""
        type: string
      shards:
        description: "parallel locale shards, 1-28 (7 = 4 locales each)"
        required: false
        default: "7"
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      # Pinned ONCE here; every shard checks out exactly these commits.
      extra_tm_website: ${{ steps.extra_tm.outputs.website }}
      extra_tm_client: ${{ steps.extra_tm.outputs.client }}
      extra_tm_provenance: ${{ steps.extra_tm_provenance.outputs.provenance }}
    env:
      TARGET: ${{ inputs.target }}
      LANE: ${{ inputs.lane }}
      ACCORD_VERSION: ${{ inputs.accord_version }}
      TM_VERSION: ${{ inputs.tm_version }}
      STEM: ${{ inputs.accord_stem }}
      TM_STEM: ${{ inputs.tm_stem }}
      SEED_EXACT_TM: ${{ inputs.seed_exact_tm }}
      UNITS: ${{ inputs.accord_units }}
      KEYS: ${{ inputs.keys }}
      LANGS: ${{ inputs.langs }}
      MAX_KEYS: ${{ inputs.max_keys }}
      MODE: ${{ inputs.mode }}
      SHARDS: ${{ inputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendored pipeline matches its record
        run: python3 tools/dev/check_localize_vendoring.py

      # Extra translation memory (--extra-tm): the website's and the apps'
      # translated strings, as terminology anchors only -- the adapter never
      # writes them as values. Each repository is resolved to its default
      # branch's commit ONCE, here, and every shard checks out exactly these
      # SHAs (plan outputs), so no two shards can anchor on different corpora.
      # The SHAs go into the step summary, the plan log and the commit message.
      - name: Extra translation memory -- pin the default-branch commits
        id: extra_tm
        if: inputs.extra_tm && inputs.target == 'accord'
        run: |
          set -euo pipefail
          website=$(git ls-remote https://github.com/CIRISAI/ciris-website.git HEAD | cut -f1)
          client=$(git ls-remote https://github.com/CIRISAI/CIRISClient.git HEAD | cut -f1)
          for sha in "$website" "$client"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not resolve a default-branch commit for the extra translation memory"
              exit 1
            fi
          done
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"

      - name: Extra translation memory -- ciris-website (read-only)
        if: steps.extra_tm.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/ciris-website
          ref: ${{ steps.extra_tm.outputs.website }}
          path: .extra-tm/ciris-website
          persist-credentials: false
          sparse-checkout: |
            src/i18n

      - name: Extra translation memory -- CIRISClient (read-only)
        if: steps.extra_tm.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISClient
          ref: ${{ steps.extra_tm.outputs.client }}
          path: .extra-tm/CIRISClient
          persist-credentials: false
          sparse-checkout: |
            client/shared/src/desktopMain/resources/localization

      - name: Extra translation memory -- provenance
        id: extra_tm_provenance
        if: steps.extra_tm.outcome == 'success'
        env:
          WEBSITE_SHA: ${{ steps.extra_tm.outputs.website }}
          CLIENT_SHA: ${{ steps.extra_tm.outputs.client }}
        run: |
          set -euo pipefail
          test "$(git -C .extra-tm/ciris-website rev-parse HEAD)" = "$WEBSITE_SHA"
          test "$(git -C .extra-tm/CIRISClient rev-parse HEAD)" = "$CLIENT_SHA"
          provenance="CIRISAI/ciris-website@$WEBSITE_SHA, CIRISAI/CIRISClient@$CLIENT_SHA, agent UI bundle at $GITHUB_SHA"
          {
            echo "EXTRA_TM=. .extra-tm/ciris-website .extra-tm/CIRISClient"
            echo "EXTRA_TM_PROVENANCE=$provenance"
          } >> "$GITHUB_ENV"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"
          {
            echo "### Extra translation memory (anchors only, never values)"
            echo "$provenance"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan (no API call) -- the whole run, before it is split
        # Over every requested locale, so --max-keys refuses a run that is too
        # large in total exactly as the single-job lane did; a shard's slice
        # would always look small.
        env:
          LOCALIZE_PROVIDER: ${{ vars.LOCALIZE_PROVIDER || 'openrouter' }}
        run: |
          set -euo pipefail
          localization/run_lane.sh --dry-run | tee plan.log
          {
            echo "### Plan -- $TARGET / $LANE lane"
            echo '```'
            cat plan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shard the locales
        id: shards
        run: |
          set -euo pipefail
          matrix="$(python3 localization/lane_shards.py matrix --shards "$SHARDS" --langs "$LANGS")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Shards"
            echo '```'
            python3 localization/lane_shards.py layout --shards "$SHARDS" --langs "$LANGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # A shard NEVER writes the branch: read-only token, no persisted
    # credentials, no commit step. collect is the only writer.
    permissions:
      contents: read
    strategy:
      # One shard failing (fail-closed rejections, a provider outage) must not
      # cancel the others: their accepted work is still banked by collect.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ inputs.target }}
      LANE: ${{ inputs.lane }}
      ACCORD_VERSION: ${{ inputs.accord_version }}
      TM_VERSION: ${{ inputs.tm_version }}
      STEM: ${{ inputs.accord_stem }}
      TM_STEM: ${{ inputs.tm_stem }}
      SEED_EXACT_TM: ${{ inputs.seed_exact_tm }}
      UNITS: ${{ inputs.accord_units }}
      KEYS: ${{ inputs.keys }}
      LANGS: ${{ matrix.langs }}
      SHARD: ${{ matrix.shard }}
      MAX_KEYS: ${{ inputs.max_keys }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendored pipeline matches its record
        run: python3 tools/dev/check_localize_vendoring.py

      # Extra translation memory: the SAME commits plan pinned, for every
      # shard. Never re-resolved here -- a default branch that moved mid-run
      # would otherwise give shards different anchors.
      - name: Extra translation memory -- ciris-website (read-only, plan's pin)
        if: needs.plan.outputs.extra_tm_website != ''
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/ciris-website
          ref: ${{ needs.plan.outputs.extra_tm_website }}
          path: .extra-tm/ciris-website
          persist-credentials: false
          sparse-checkout: |
            src/i18n

      - name: Extra translation memory -- CIRISClient (read-only, plan's pin)
        if: needs.plan.outputs.extra_tm_website != ''
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISClient
          ref: ${{ needs.plan.outputs.extra_tm_client }}
          path: .extra-tm/CIRISClient
          persist-credentials: false
          sparse-checkout: |
            client/shared/src/desktopMain/resources/localization

      - name: Extra translation memory -- verify the pin
        if: needs.plan.outputs.extra_tm_website != ''
        env:
          WEBSITE_SHA: ${{ needs.plan.outputs.extra_tm_website }}
          CLIENT_SHA: ${{ needs.plan.outputs.extra_tm_client }}
        run: |
          set -euo pipefail
          test "$(git -C .extra-tm/ciris-website rev-parse HEAD)" = "$WEBSITE_SHA"
          test "$(git -C .extra-tm/CIRISClient rev-parse HEAD)" = "$CLIENT_SHA"
          echo "EXTRA_TM=. .extra-tm/ciris-website .extra-tm/CIRISClient" >> "$GITHUB_ENV"

      - name: Run the lane (this shard's locales only)
        id: lane
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOCALIZE_PROVIDER: ${{ vars.LOCALIZE_PROVIDER || 'openrouter' }}
          LOCALIZE_LADDER: ${{ vars.LOCALIZE_LADDER }}
          LOCALIZE_REVIEW_MODEL: ${{ vars.LOCALIZE_REVIEW_MODEL }}
        run: |
          set -uo pipefail
          pip install --quiet anthropic
          rc=0
          localization/run_lane.sh --mode "$MODE" --report i18n-report.json 2>&1 | tee lane.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "### $TARGET / $LANE lane -- shard $SHARD ($LANGS), exit $rc"
            echo '```'
            tail -400 lane.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Pack this shard's own locale files
        # always(), so a shard that exited 1 still hands over what it accepted.
        if: always()
        env:
          LANE_RC: ${{ steps.lane.outputs.rc }}
        run: |
          set -euo pipefail
          python3 localization/lane_shards.py pack --shard "$SHARD" --langs "$LANGS" --rc "$LANE_RC" \
            --report i18n-report.json --log lane.log --out "$RUNNER_TEMP/i18n-shard"

      - name: Upload this shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/i18n-shard
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: [plan, shard]
    # always(): a failed shard still has accepted work to bank (fail-closed
    # withholds only the rejected values). Not when the plan refused the run.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TARGET: ${{ inputs.target }}
      LANE: ${{ inputs.lane }}
      ACCORD_VERSION: ${{ inputs.accord_version }}
      STEM: ${{ inputs.accord_stem }}
      LANGS: ${{ inputs.langs }}
      SHARDS: ${{ inputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the shards
        # Outside the checkout: nothing reaches the tree until collect has
        # checked who wrote it. A shard with no artifact is reported by collect.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: i18n-shard-*
          path: ${{ runner.temp }}/i18n-shards

      - name: Collect -- each shard's own locales, nothing else
        # Recomputes the assignment from the same inputs (it does not take an
        # artifact's word for what it owns), refuses a shard WHOLE if it carries
        # any file outside its locales, copies the rest into the checkout, and
        # merges the MQM reports with the spend summed. Exits 1 if any shard is
        # missing, refused or failed -- after copying what passed.
        id: collect
        run: |
          set -euo pipefail
          echo "count=$(python3 localization/lane_shards.py layout --shards "$SHARDS" --langs "$LANGS" | wc -l)" >> "$GITHUB_OUTPUT"
          python3 localization/lane_shards.py collect --shards "$SHARDS" --langs "$LANGS" \
            --from "$RUNNER_TEMP/i18n-shards" --report i18n-report.json | tee collect.log
          {
            echo "### Collect -- $TARGET / $LANE lane"
            echo '```'
            cat collect.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: MQM findings
        if: always() && hashFiles('i18n-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: i18n-report-${{ inputs.target }}-${{ inputs.lane }}
          path: i18n-report.json

      - name: Gate -- the pipeline proposes, this decides
        # always(), so a run with a failed shard still gets what it DID write
        # checked, and the operator sees both facts.
        id: gate
        if: always()
        run: |
          set -euo pipefail
          python3 tools/dev/check_localize_vendoring.py
          if [ "$TARGET" = "accord" ]; then
            # Round trip of the English source, every staged passage against the
            # accord's structural rules, every reassembled file byte-equal to its
            # bundle, and no per-locale accord mirror anywhere.
            python3 localization/accord_localize.py --version "$ACCORD_VERSION" --stem "$STEM" --verify
          else
            python3 tools/dev/check_localization_sync.py
          fi

      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
          SHARD_COUNT: ${{ steps.collect.outputs.count || inputs.shards }}
          EXTRA_TM_PROVENANCE: ${{ needs.plan.outputs.extra_tm_provenance }}
        # Even when a shard failed: the lane writes only ACCEPTED values, so
        # committing on failure banks the good work and leaves the rejected keys
        # missing for the next run (CIRISClient: skipping this on failure
        # discarded 587 good translations per run, seven runs running). NOT when
        # the combined tree failed the gate: the gate is what decides.
        if: always() && inputs.commit && steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$TARGET" = "accord" ]; then
            # The segment bundles are the lane's state (en.json and manifest.json
            # there are generated and git-ignored); the .txt files are what the
            # loader reads, written only for COMPLETE locales.
            # The stage dir is localization/accord/<version> for the Accord and
            # localization/accord/<stem>_<version> for any other stem.
            if [ "$STEM" = "accord" ]; then STAGE="$ACCORD_VERSION"; else STAGE="${STEM}_${ACCORD_VERSION}"; fi
            git add --all -- "localization/accord/$STAGE" ciris_engine/data/localized
          else
            git add --all -- ciris_engine/data/localized
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -F - <<MSG
          i18n($TARGET): $LANE lane (translate -> evaluate -> repair)

          Machine translation through the vendored CIRISClient pipeline,
          independently reviewed against MQM by a different model family, and
          repaired where the review found a critical, major or terminology error.
          Every value is status=draft / review_status=machine_reviewed: this
          guarantees terminology, structure and meaning, not native fluency.

          Extra translation memory (terminology anchors only, never values):
          ${EXTRA_TM_PROVENANCE:-none}

          Gated in this run by tools/dev/check_localize_vendoring.py and, for the
          Accord, accord_localize.py --verify. The MQM findings are attached to
          the run as i18n-report.json.

          Run as $SHARD_COUNT parallel locale shard(s); each shard's own locale
          files were collected into this one commit (localization/lane_shards.py).

          Accord files are hash-pinned (ETHICS_TEXT_EXPECTED_HASHES) and covered by
          the root-signed accord manifest: re-pin and re-sign before merge.
          MSG
          # REBASE BEFORE PUSHING: a lane takes minutes, and a human can land a
          # commit on the same branch meanwhile.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) -- rebasing onto the branch and retrying"
            git pull --rebase origin "$BRANCH" || true
          done
          echo "::error::could not push the translations after 3 attempts -- the branch moved under the lane each time"
          exit 1
