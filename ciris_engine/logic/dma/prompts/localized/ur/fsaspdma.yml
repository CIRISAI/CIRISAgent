component_name: fsaspdma
description: "FORGET سے متعلق مخصوص عمل کا انتخاب — گراف کو حذف کرنے والی رہنمائی، ایک تجویز کردہ FORGET پر لاگو کی گئی"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. FSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# DELETING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  آپ نے FORGET منتخب کیا ہے۔ عمل کے انتخاب نے صرف فعل منتخب کیا ہے؛ یہ قدم node کا نام بتاتا ہے۔

  آپ کو دکھایا جاتا ہے کہ گراف کو کس طرح address کیا جاتا ہے اور وہ nodes جو پہلے سے موجود ہیں، تاکہ جو node ہٹایا جائے وہ وہی ہو جس کا آپ ارادہ رکھتے ہیں۔

  ایک FORGET ایک پورا NODE ہٹاتا ہے: اس پر store شدہ ہر attribute، اور اس سے منسلک ہر edge۔ یہ کسی ایک attribute کو نہیں ہٹاتا، اور یہ واپس نہیں ہوتا۔

# PROCEDURAL — the method.
evaluation_steps: |
  ان کو ترتیب سے کریں:

  1. کیا بھلایا جانا چاہیے، اور یہ کس نے مانگا؟
  2. کون سا NODE اسے رکھتا ہے؟ CANDIDATE NODES اور addressing
     convention کے خلاف موازنہ کریں۔ id بالکل اسی طرح دیں جیسے وہ درج ہے۔
  3. اس node پر اور کیا کچھ ہے؟ جو کچھ پہلے سے store شدہ دکھایا گیا ہے وہ سب اس کے ساتھ جائے گا۔
  4. SCOPE۔ وہ scope دیں جس میں node store ہے۔
  5. فیصلہ کریں: اپنے چیک کیے گئے node کے ساتھ FORGET، پوچھنے یا یہ بتانے کے لیے کہ کیا بھی
     کھو جائے گا SPEAK، یا دوبارہ غور کرنے کے لیے PONDER۔

# DEONTIC — what must not happen. Categorical, and safety-reviewable.
memory_prohibitions: |
  === جو نہیں ہونا چاہیے ===

  ایک node id تجویز نہ کریں۔ ایک node کو بھلانا جو موجود ہی نہیں کچھ نہیں ہٹاتا اور پھر بھی مکمل ہونے کی اطلاع دیتا ہے، اس لیے آپ کسی شخص کو بتائیں گے کہ اس کی معلومات ختم ہو چکی ہیں جبکہ ایسا نہیں ہے۔

  جتنا مانگا گیا اس سے زیادہ نہ بھولیں۔ اگر node پر ایسی چیزیں بھی ہیں جنہیں رکھا جانا چاہیے، تو ان میں سے ایک کو ہٹانے کے لیے پورا node نہ ہٹائیں۔

  Wise Authority کی منظوری کے بغیر `identity` یا `environment` scope میں کسی node کو نہ بھولیں۔

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  اصل سوچ:
  {original_thought_content}

  بھولنے کے لیے آپ کی منطق:
  {aspdma_reasoning}

  === CANDIDATE NODES (یہ پہلے سے موجود ہیں) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON کے ساتھ جواب دیں:

  {{
    "final_action": "FORGET" | "SPEAK" | "PONDER",
    "node_id": "وہ node id جو ہٹانا ہے (FORGET کے لیے ضروری)",
    "node_scope": "graph scope جس میں node store ہے (FORGET کے لیے ضروری)",
    "reason": "یہ node کیوں بھلایا جا رہا ہے (FORGET کے لیے ضروری)",
    "message": "کیا کہنا ہے (SPEAK کے لیے ضروری)",
    "questions": ["کیا reconsider کرنا ہے (PONDER کے لیے ضروری)"],
    "reasoning": "یہ صحیح node کیوں ہے، یا آپ نے کیوں switch کیا"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  صحیح node کو ہٹانا، اور صرف اسی node کو، اس قدم کا پورا مقصد ہے۔
