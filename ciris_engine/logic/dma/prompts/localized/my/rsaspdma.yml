component_name: rsaspdma
description: "ပြန်သတိရခြင်း-အထူးပြု လုပ်ဆောင်ချက်ရွေးချယ်မှု — graph ဖတ်ခြင်း လမ်းညွှန်ကို အဆိုပြုထားသော RECALL တစ်ခုအပေါ် အသုံးချထားသည်"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  သင်သည် RECALL ကို ရွေးချယ်ပြီးပါပြီ။ Action Selection သည် ကြိယာကိုသာ
  ရွေးချယ်ခဲ့ပြီး၊ ဤအဆင့်သည် မည်သည့်အရာကို ဖတ်ရှုရမည်ကို ဖော်ပြသည်။

  Graph ကို မည်သို့လိပ်စာပေးသည်နှင့် မည်သည့် node များ ရှိနှင့်ပြီးဖြစ်သည်ကို
  သင့်အားပြသထားသည့်အတွက် ဖတ်ရှုမှုသည် အချက်အလက်ရှိရာနေရာကို ကြည့်မည်
  ဖြစ်သည်။

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  ပြန်သတိရခြင်းသည် ဤအစဉ်အတိုင်း ဖြေရှင်းသည်:

    node_id   အတိအကျရှာဖွေခြင်း။ အဆိုပါ node ရှိလျှင် ၎င်းကို ပြန်ပေးမည်ဖြစ်ပြီး၊
              အခြားမည်သည့်အရာကိုမျှ ရှာဖွေမည်မဟုတ်။
    query     memory ၏ စာသားရှာဖွေမှု တစ်ခု ဖြစ်ပြီး၊ node_type နှင့် scope
              ပေးထားပါက ၎င်းတို့ဖြင့် ကျဉ်းမြှောင်းပေးသည်။ node_id မရှိသောအခါ
              သို့မဟုတ် ၎င်းနှင့် မည်သည့်အရာမျှ မကိုက်ညီသောအခါ အသုံးပြုသည်။

  အောက်ပါအဆင့်များကို အစဥ်လိုက် ဆောင်ရွက်ပါ:

  1. သင် မည်သည့်အရာကို ရှာနေသနည်း? ရိုးရှင်းစွာ ဖော်ပြထားသော တစ်ခုတည်းသော အရာ။
  2. ၎င်းသည် သင့်ရှေ့တွင် ရှိနှင့်ပြီးလား? ပုဂ္ဂိုလ်တစ်ဦး၏ သိမ်းဆည်းထားသော
     အချက်အလက်များသည် ၎င်းတို့၏ profile နှင့်အတူ ရောက်ရှိလာပြီး၊ စကားဝိုင်းသည်
     သင့် context ထဲတွင် ရှိနေသည်။ သင်ဖတ်ရှုနိုင်ပြီးသားဖြစ်သော အရာသည် ပြန်သတိရရန်
     မလိုအပ်ပါ။
  3. ၎င်းသည် သင်အမည်ပေးနိုင်သော node တစ်ခုပေါ်တွင် ရှိသလား? CANDIDATE NODES
     များအနက် တစ်ခုက ၎င်းကို ပါဝင်လျှင်၊ ထို id ကို node_id အဖြစ် ပေးပါ။
  4. သို့မဟုတ်ပါက query တစ်ခု ပေးပါ: သင်လိုချင်သည့်အရာကို ဖော်ပြသော
     စကားလုံးအနည်းဆုံးဖြင့်။ node_type သို့မဟုတ် node_scope ကို သိသည့်အခါမှသာ
     ထည့်သွင်းပါ။
  5. ဆုံးဖြတ်ပါ: စစ်ဆေးပြီးသော အချက်များဖြင့် RECALL ပြုလုပ်ရန်၊ ဖြေဆိုရန်
     သို့မဟုတ် မေးရန် SPEAK ပြုလုပ်ရန်၊ သို့မဟုတ် ပြန်လည်စဉ်းစားရန် PONDER
     ပြုလုပ်ရန်။

# DEONTIC — what must not happen.
memory_prohibitions: |
  === မည်သည်မျှ ဖြစ်ပွားပေးမည်မဟုတ် ===

  Node id ကို ဖန်တီးမထားပါနှင့်။ အကျင့်စဉ်ကို မလိုက်နာသော id သည် မည်သည့်အရာနှင့်မျှ
  မကိုက်ညီဘဲ၊ ရလဒ်ဗလာသည် "ကျွန်ုပ် ဤအရာကို ဘယ်တော့မှ မသင်ယူခဲ့ပါ" ဟူ၍
  ဖတ်ရှုရမည်ဖြစ်သော်လည်း အမှန်တကယ်မှာ "ကျွန်ုပ်သည် မှားသောနေရာတွင်
  ရှာဖွေခဲ့သည်" ဖြစ်သည်။

  ပြန်သတိရမှုမပြုလုပ်မီ ၎င်း၏ ရလဒ်ကို ဖော်ပြမထားပါနှင့်။ ဤအဆင့်သည်
  ဖတ်ရှုမှုကို ဦးတည်သည်; ရလဒ်သည် ထို့နောက်မှ ရောက်ရှိလာသည်။

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  မူလအတွေးအခေါ်:
  {original_thought_content}

  ပြန်သတိရရန်ခွင့်ပြုလုပ်ချက်ဆိုင်ရာ သင့်လျင်းပွားချက်:
  {aspdma_reasoning}

  === CANDIDATE NODES (ဤ node များ ရှိနှင့်ပြီးဖြစ်သည်) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON အားဖြင့် အဆိုပြုသည်:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "ဖတ်ရှုရန် အတိအကျ node id (RECALL တွင် ဤအရာ သို့မဟုတ် query ကို ပေးပါ)",
    "query": "ရှာဖွေရန် စာသား (RECALL တွင် ဤအရာ သို့မဟုတ် node_id ကို ပေးပါ)",
    "node_type": "ရှာဖွေမှုကို ကျဉ်းမြှောင်းရန် node အမျိုးအစား (ရွေးချယ်နိုင်သည်)",
    "node_scope": "ရှာဖွေမှုကို ကျဉ်းမြှောင်းရန် graph scope (ရွေးချယ်နိုင်သည်)",
    "limit": 10,
    "message": "ဖော်ပြသည့် အရာ (SPEAK နှင့်အတူ လိုအပ်သည်)",
    "questions": ["ပြန်လည်စဉ်းစားမည့် အရာ (PONDER နှင့်အတူ လိုအပ်သည်)"],
    "reasoning": "ဤဖတ်ရှုမှုက သင်ရှာဖွေနေသည့်အရာကို အဘယ်ကြောင့် ရှာတွေ့သည်၊ သို့မဟုတ် အဘယ်ကြောင့်သင်ကူးပြောင်းခဲ့သည်"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  မှန်ကန်သောနေရာတွင် ရှာဖွေခြင်းသည် ဤအဆင့်၏ အဓိကရည်ရွယ်ချက် ဖြစ်သည်။
