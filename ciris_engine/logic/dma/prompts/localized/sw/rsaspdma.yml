component_name: rsaspdma
description: "Uchaguzi wa kitendo mahususi wa kurudisha — mwongozo wa kusoma grafu, ukitumika kwa RECALL moja iliyopendekezwa"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  Umechagua RECALL. Uchaguzi wa Kitendo ulichagua kitenzi tu; hatua hii
  inasema nini cha kusoma.

  Unaonyeshwa jinsi grafu inavyoelekezwa na nodi ambazo tayari zipo, ili
  usomaji uangalie mahali habari ilipo.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  Ombi la RECALL hutatuliwa kwa mpangilio huu:

    node_id   utafutaji hasa. Kama nodi hiyo ipo, inarudishwa, na hakuna
              kingine kinachotafutwa.
    query     utafutaji wa maandishi wa kumbukumbu, unaopunguzwa na node_type na scope unapovitoa.
              Hutumika pale hakuna node_id, au haikupata kitu chochote.

  Fanya kila moja kwa mpangilio:

  1. NINI unachotafuta? Kitu kimoja, kilichoelezwa wazi.
  2. JE, TAYARI KIKO MBELE YAKO? Ukweli wa mtu uliohifadhiwa unafika pamoja na
     wasifu wake, na mazungumzo yako yako katika muktadha wako. Kile unachoweza tayari kusoma
     hakihitaji kurudishwa kupitia RECALL.
  3. JE, KIKO KWENYE NODI UNAYOWEZA KUITAJA? Kama mojawapo ya NODI AMBAZO
     INAWEZA KUZINGATIWA inakishikilia, toa
     kitambulisho hicho kama node_id.
  4. VINGINEVYO toa query: maneno machache kabisa yanayoainisha kile unachotaka. Ongeza
     node_type au node_scope tu unapoyajua.
  5. Amua: RECALL na kile ulichokagua, SPEAK kujibu au kuuliza, au
     PONDER kufikiria upya.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === KILE KILICHOZUIWA KABISA ===

  Usitunge kitambulisho cha nodi. Kitambulisho kisichofuata kawaida hakilingani
  na chochote, na matokeo tupu kisha husomwa kama "Sijawahi kujifunza hili" wakati
  ukweli ni "Nilitazama mahali pasipofaa".

  Usieleze kile ambacho RECALL imerudisha kabla haijatekelezwa. Hatua hii inahusu
  usomaji; matokeo linafika baadaye.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Fikra ya awali:
  {original_thought_content}

  Sababu yako ya kurudisha:
  {aspdma_reasoning}

  === NODI AMBAZO INAWEZA KUZINGATIWA (zinaposini, tayari zipo) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  Jibu na JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "kitambulisho hasa cha nodi ya kusoma (toa hiki au query wakati RECALL)",
    "query": "maandishi ya kutafuta (toa hiki au node_id wakati RECALL)",
    "node_type": "aina ya nodi ya kupunguza utafutaji (hiari)",
    "node_scope": "uwanja wa grafu wa kupunguza utafutaji (hiari)",
    "limit": 10,
    "message": "kile cha kusema (kinachohitajika wakati SPEAK)",
    "questions": ["kile cha kufikiria upya (kinachohitajika wakati PONDER)"],
    "reasoning": "kwa nini usomaji huu unapata kile unachotafuta, au kwa nini ulibadilisha"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Kuangalia mahali sahihi ndiyo lengo zima la hatua hii.
