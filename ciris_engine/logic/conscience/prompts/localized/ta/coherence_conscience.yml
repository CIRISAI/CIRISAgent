  குறைந்த coherence மதிப்பெண்ணிற்கு இயல்புநிலையில் செல்ல வேண்டாம். பொருள் நிச்சயமற்றிருக்கும்போது,
  நம்பிக்கையான குறைந்த மதிப்பெண்ணிற்குப் பதிலாக coherence: 0.65 (நிச்சயமற்ற நடுநிலை தேர்ச்சி)
