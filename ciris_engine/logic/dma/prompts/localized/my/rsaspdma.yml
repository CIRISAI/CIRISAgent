component_name: rsaspdma
description: "ပြန်သတိရခြင်း-အထူးပြု လုပ်ဆောင်ချက်ရွေးချယ်မှု — graph ဖတ်ခြင်း လမ်းညွှန်ကို အဆိုပြုထားသော RECALL တစ်ခုအပေါ် အသုံးချထားသည်"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  သင်သည် RECALL ကို ရွေးချယ်ပြီးပါပြီ။ Action Selection သည် ကြိယာကိုသာ
  ရွေးချယ်ခဲ့ပြီး၊ ဤအဆင့်သည် မည်သည့်အရာကို ဖတ်ရှုရမည်ကို ဖော်ပြသည်။

  Graph ကို မည်သို့လိပ်စာပေးသည်နှင့် မည်သည့် node များ ရှိနှင့်ပြီးဖြစ်သည်ကို
  သင့်အားပြသထားသည့်အတွက် ဖတ်ရှုမှုသည် အချက်အလက်ရှိရာနေရာကို ကြည့်မည်
  ဖြစ်သည်။

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  RECALL (ပြန်သတိရပါ) တစ်ခုသည် ဤအစီအစဉ်အတိုင်း ဖြေရှင်းသည်:

    node_id   အတိကျသော ရှာဖွေမှု။ ထို node ရှိနေပါက ၎င်းကို ပြန်ပေးမည်ဖြစ်ပြီး၊
              အခြားမည်သည့်အရာကိုမျှ ထပ်မံ ရှာဖွေမည်မဟုတ်။
    query     node_type နှင့် scope ဖြင့် ကန့်သတ်နိုင်သော graph ၏ စာသား ရှာဖွေမှု
              ဖြစ်သည်။ node_id မရှိသောအခါ၊ သို့မဟုတ် ၎င်းသည် မည်သည့်အရာနှင့်မျှ
              မကိုက်ညီသောအခါ အသုံးပြုသည်။

  ဤအရာများကို အစီအစဉ်အတိုင်း လုပ်ဆောင်ပါ:

  1. သင်ရှာနေသည့်အရာကား အဘယ်နည်း? ရိုးရှင်းစွာ ဖော်ပြထားသော အရာတစ်ခုတည်း။
  2. ၎င်းသည် သင့်ရှေ့မှောက်တွင် ရှိနှင့်ပြီးလား? ပုဂ္ဂိုလ်တစ်ဦး၏ သိမ်းဆည်းထားသော
     အချက်အလက်များသည် သူ၏ ပရိုဖိုင်နှင့်အတူ ရောက်ရှိလာပြီး၊ စကားဝိုင်းသည် သင်၏
     context တွင်ရှိသည်။ သင်ဖတ်နိုင်နှင့်ပြီးသားအရာအတွက် RECALL (ပြန်သတိရပါ)
     လိုအပ်မည်မဟုတ်။
  3. ၎င်းသည် သင်အမည်ပေးနိုင်သော node တစ်ခုပေါ်တွင် ရှိသလား? CANDIDATE NODES
     ထဲမှ တစ်ခုတွင် ၎င်းရှိနေပါက ထို id ကို node_id အဖြစ် ပေးပါ။
  4. မဟုတ်ပါက query တစ်ခု ပေးပါ - သင်လိုချင်သည့်အရာကို ဖော်ပြနိုင်သော
     စကားလုံး အနည်းဆုံးကို အသုံးပြုပါ။ node_type သို့မဟုတ် node_scope ကို
     သင်သိသောအခါတွင်သာ ထည့်ပါ။
  5. ဆုံးဖြတ်ပါ - သင်စစ်ဆေးပြီးသောအရာဖြင့် RECALL (ပြန်သတိရပါ)၊ ဖြေကြားရန်
     သို့မဟုတ် မေးရန် SPEAK (ပြောပါ)၊ သို့မဟုတ် ပြန်လည်စဉ်းစားရန် PONDER
     (စဉ်းစားပါ)။

# DEONTIC — what must not happen.
memory_prohibitions: |
  === မည်သည်မျှ ဖြစ်ပွားပေးမည်မဟုတ် ===

  Node id ကို ဖန်တီးမထားပါနှင့်။ ဆောင်ရွက်ထုံးစံအတိုင်း မဟုတ်သော id တစ်ခုသည် မည်သည့်အရာနှင့်မျှ
  မကိုက်ညီဘဲ၊ ဗလာ ရလဒ်တစ်ခုသည် "ကျွန်ုပ်သည် ၎င်းကို တစ်ခါမျှ မသင်ယူခဲ့ပါ" ဟု ဖတ်ရသော်လည်း
  အမှန်တကယ်မှာ "ကျွန်ုပ်သည် မှားသောနေရာတွင် ရှာဖွေခဲ့ခြင်း" ဖြစ်သည်။

  RECALL (ပြန်သတိရပါ) အလုပ်မလုပ်မီ ၎င်း၏ ရလဒ်ကို ကြိုတင်ပြောမပြောပါနှင့်။ ဤအဆင့်သည်
  ဖတ်ခြင်းကို ဆောင်ရွက်သည်; ရလဒ်သည် နောက်မှ ရောက်ရှိလာသည်။

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  မူလအတွေးအခေါ်:
  {original_thought_content}

  ပြန်သတိရရန်ခွင့်ပြုလုပ်ချက်ဆိုင်ရာ သင့်လျင်းပွားချက်:
  {aspdma_reasoning}

  === CANDIDATE NODES (ဤ node များ ရှိနှင့်ပြီးဖြစ်သည်) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON အားဖြင့် အဆိုပြုသည်:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "ဖတ်ရန် အတိကျသော node id (RECALL နှင့်အတူ ၎င်းကို သို့မဟုတ် query ကို ပေးပါ)",
    "query": "ရှာဖွေမည့် စာသား (RECALL နှင့်အတူ ၎င်းကို သို့မဟုတ် node_id ကို ပေးပါ)",
    "node_type": "ရှာဖွေမှုကို ကန့်သတ်ရန် node အမျိုးအစား (ရွေးချယ်နိုင်သည်)",
    "node_scope": "ရှာဖွေမှုကို ကန့်သတ်ရန် graph scope (ရွေးချယ်နိုင်သည်)",
    "limit": 10,
    "message": "ပြောရမည့်အရာ (SPEAK နှင့်အတူ လိုအပ်သည်)",
    "questions": ["ပြန်လည်စဉ်းစားမည့်အရာ (PONDER နှင့်အတူ လိုအပ်သည်)"],
    "reasoning": "ဤဖတ်ခြင်းသည် သင်ရှာနေသည့်အရာကို အဘယ်ကြောင့် တွေ့ရှိနိုင်သည်၊ သို့မဟုတ် အဘယ်ကြောင့် SPEAK သို့မဟုတ် PONDER ကို ယင်းအစား ရွေးချယ်ခဲ့သည်"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  မှန်ကန်သောနေရာတွင် ရှာဖွေခြင်းသည် ဤအဆင့်၏ အဓိကရည်ရွယ်ချက် ဖြစ်သည်။
