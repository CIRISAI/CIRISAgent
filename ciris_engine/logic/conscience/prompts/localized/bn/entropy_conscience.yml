  একটি সঠিক ছবির বিবরণ একটি সংকীর্ণ কাজ — তিনটি বিকল্প একত্রিত হওয়া উচিত, এন্ট্রপি কম হওয়া উচিত।
  কোনো ভিজ্যুয়াল সামগ্রীর উপর নির্ভর করবেন না; শুধুমাত্র পাঠ্য + মেটাডেটার উপর মূল্যায়ন করুন।
