component_name: rsaspdma
description: "RECALL سے متعلق مخصوص عمل کا انتخاب — گراف کو پڑھنے والی رہنمائی، ایک تجویز کردہ RECALL پر لاگو کی گئی"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  آپ نے RECALL منتخب کیا ہے۔ عمل کے انتخاب نے صرف فعل منتخب کیا ہے؛ یہ قدم بتاتا ہے کہ کیا پڑھنا ہے۔

  آپ کو دکھایا جاتا ہے کہ گراف کو کس طرح address کیا جاتا ہے اور وہ nodes جو پہلے سے موجود ہیں، تاکہ read وہاں دیکھے جہاں معلومات موجود ہیں۔

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  ایک recall اس ترتیب میں حل ہوتا ہے:

    node_id   ایک exact lookup۔ اگر وہ node موجود ہے تو وہ واپس کیا جاتا ہے، اور کچھ
              اور تلاش نہیں کیا جاتا۔
    query     memory کی ایک text search، جسے node_type اور scope دینے پر
              محدود کیا جاتا ہے۔ یہ تب استعمال ہوتا ہے جب کوئی node_id نہ ہو، یا وہ کچھ میچ نہ کرے۔

  ان کو ترتیب سے کریں:

  1. آپ کیا تلاش کر رہے ہیں؟ ایک چیز، صاف طور پر بیان کی گئی۔
  2. کیا یہ پہلے سے ہی آپ کے سامنے ہے؟ کسی شخص کے store شدہ facts ان کے profile کے ساتھ آتے ہیں، اور گفتگو آپ کے context میں ہے۔ جو آپ پہلے سے پڑھ سکتے ہیں اسے recall کی ضرورت نہیں۔
  3. کیا یہ کسی ایسے node پر ہے جس کا آپ نام لے سکتے ہیں؟ اگر CANDIDATE NODES میں سے کوئی ایک اسے رکھتا ہے، تو وہ id node_id کے طور پر دیں۔
  4. ورنہ ایک query دیں: کم از کم الفاظ جو اس چیز کی شناخت کرتے ہیں جو آپ چاہتے ہیں۔ node_type یا node_scope صرف اسی وقت شامل کریں جب آپ انہیں جانتے ہوں۔
  5. فیصلہ کریں: اپنے چیک کیے گئے کے ساتھ RECALL، جواب دینے یا پوچھنے کے لیے SPEAK، یا دوبارہ غور کرنے کے لیے PONDER۔

# DEONTIC — what must not happen.
memory_prohibitions: |
  === جو نہیں ہونا چاہیے ===

  ایک node id تجویز نہ کریں۔ ایک id جو convention کی پیروی نہیں کرتا کچھ بھی میچ نہیں کرتا، اور ایک خالی نتیجہ پھر "میں نے یہ کبھی نہیں سیکھا" کے طور پر پڑھا جاتا ہے جبکہ حقیقت یہ ہے کہ "میں نے غلط جگہ دیکھی"۔

  یہ بیان نہ کریں کہ recall نے کیا واپس کیا اس سے پہلے کہ وہ چلے۔ یہ قدم read کو address کرتا ہے؛ نتیجہ بعد میں آتا ہے۔

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  اصل سوچ:
  {original_thought_content}

  یاد کرنے کے لیے آپ کی منطق:
  {aspdma_reasoning}

  === CANDIDATE NODES (یہ پہلے سے موجود ہیں) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON کے ساتھ جواب دیں:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "پڑھنے کے لیے exact node id (RECALL کے لیے یہ یا query دیں)",
    "query": "تلاش کا متن (RECALL کے لیے یہ یا node_id دیں)",
    "node_type": "تلاش کو محدود کرنے کے لیے node type (اختیاری)",
    "node_scope": "تلاش کو محدود کرنے کے لیے graph scope (اختیاری)",
    "limit": 10,
    "message": "کیا کہنا ہے (SPEAK کے لیے ضروری)",
    "questions": ["کیا reconsider کرنا ہے (PONDER کے لیے ضروری)"],
    "reasoning": "یہ read وہ کیوں تلاش کرتا ہے جو آپ ڈھونڈ رہے ہیں، یا آپ نے کیوں switch کیا"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  صحیح جگہ پر دیکھنا اس قدم کا پورا مقصد ہے۔
