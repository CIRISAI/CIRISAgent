  የኢንትሮፒ ጥራትን ሳያሻሽል።

  ተግባሩ ጠባብ/እውነታዊ ከሆነ (ለምሳሌ "H2O ምንድነው?") ሶስቱ አማራጮች
  በተፈጥሮ በትርጉም ይሰባሰባሉ — ይህ ትክክል እና ጥሩ ነው። ተግባሩ ክፍት-ጫፍ
