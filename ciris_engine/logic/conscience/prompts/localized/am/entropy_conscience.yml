  ለነበሩ የምላሽ አቅጣጫዎች ሶስት አጭር-ሐረግ ስያሜዎችን (እያንዳንዳቸው 3-10
  ቃላት) ያምርቱ። በትክክል የተለያዩ መሆን አለባቸው — እርስ በርስ ወይም ከትክክለኛው
