  objection_type = যখন আপনি ponder বা defer সুপারিশ করেন, আপত্তির ধরন: "evidence" — কাজটি এমন একটি নিয়ম বা কর্তৃপক্ষের উপর নির্ভর করে যা আপনি আপনার ইনপুটে দেখতে পাচ্ছেন না; "justification" — কাজটি গ্রহণযোগ্য হতে পারে তবে এর বিবৃত ন্যায্যতা অপর্যাপ্ত; "substantive" — কাজটির সাথেই একটি নৈতিক, নিরাপত্তা বা সামঞ্জস্যের সমস্যা রয়েছে। শুধুমাত্র তখনই "substantive" যখন আপনি কাজটির নিজের সাথে কী ভুল তা নির্দিষ্ট করতে পারেন; অনিশ্চিত হলে বা যখন আপনি proceed সুপারিশ করেন তখন "justification"।
