  फक्त JSON आउटपुट करा: {"epistemic_certainty": <0.0-1.0>, "identified_uncertainties": ["list"], "reflective_justification": "explanation", "recommended_action": "proceed|ponder|defer", "objection_type": "evidence|justification|substantive"}
  objection_type = जेव्हा तुम्ही ponder किंवा defer शिफारस करता, तेव्हा आक्षेपाचा प्रकार: "evidence" — कृती अशा नियमावर किंवा प्राधिकरणावर अवलंबून आहे जे तुम्हाला तुमच्या इनपुटमध्ये दिसत नाही; "justification" — कृती स्वीकार्य असू शकते परंतु तिचे नमूद केलेले औचित्य अपुरे आहे; "substantive" — कृतीतच एक नैतिक, सुरक्षा किंवा सुसंगतता समस्या आहे. "substantive" फक्त तेव्हाच जेव्हा तुम्ही कृतीतच काय चुकीचे आहे ते नाव देऊ शकता; "justification" जेव्हा अनिश्चित असाल किंवा जेव्हा तुम्ही proceed शिफारस करता.
