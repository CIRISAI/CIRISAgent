component_name: rsaspdma
description: "Recall-विशिष्ट कृती निवड — graph-read करणारा मार्गदर्शक, एका प्रस्तावित RECALL वर लागू केलेला"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  आपणे RECALL निवडले आहे. कृती निवडाने फक्त verb निवडला; ही पायरी काय वाचायचे ते सांगते.

  आपल्याला दाखवले जाते की graph कसे address केले जाते आणि कोणते nodes आधीच अस्तित्वात आहेत, जेणेकरून read तिथे पाहतो जिथे माहिती आहे.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  RECALL खालील क्रमाने निकालावर पोचते:

    node_id   एक exact lookup. जर तो node अस्तित्वात असेल तर तो परत केला जातो, आणि आणखी काहीही शोधले जात नाही.
    query     memory वरील एक text search, आपण दिल्यास node_type आणि scope ने संकुचित केलेला. जेव्हा node_id नसतो, किंवा त्याला काहीही जुळले नाही तेव्हा वापरला जातो.

  या क्रमाने काम करा:

  1. आपण काय शोधत आहात? एक गोष्ट, स्पष्टपणे सांगितलेली.
  2. ती आधीच आपल्यासमोर आहे का? एखाद्या व्यक्तीबद्दल साठवलेली तथ्ये त्यांच्या profile सोबत येतात, आणि संभाषण आपल्या context मध्ये आहे. जे आपण आधीच वाचू शकता त्यासाठी RECALL ची गरज नाही.
  3. ती अशा node वर आहे का ज्याचे नाव आपण देऊ शकता? जर CANDIDATE NODES पैकी एखाद्या node मध्ये ती साठवलेली असेल, तर तो id node_id म्हणून द्या.
  4. अन्यथा एक query द्या: कमीत कमी शब्द जे आपल्याला हवे ते ओळखून देतील. node_type किंवा node_scope फक्त तेव्हाच जोडा जेव्हा आपल्याला ते माहीत असतील.
  5. निर्णय घ्या: आपण तपासलेल्या गोष्टीसह RECALL, उत्तर देण्यासाठी किंवा विचारण्यासाठी SPEAK, किंवा पुनर्विचारासाठी PONDER.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === जे घडू नये ===

  एक node id invent करू नका. convention चे पालन न करणारा id कशालाही जुळत नाही, आणि मग एक रिकामे result असे वाचले जाते की "मी हे कधीही शिकलो नाही" जेव्हा सत्य हे आहे की "मी चुकीच्या ठिकाणी शोधले".

  एक recall चालण्यापूर्वी त्याने काय परत केले हे सांगू नका. ही पायरी read ला address करते; result नंतर येतो.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  मूळ विचार:
  {original_thought_content}

  आठवण्यासाठी आपला reasoning:
  {aspdma_reasoning}

  === CANDIDATE NODES (हे आधीच अस्तित्वात आहेत) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON स्वरूपात उत्तर द्या:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "वाचायचा exact node id (RECALL साठी हे किंवा query द्या)",
    "query": "search text (RECALL साठी हे किंवा node_id द्या)",
    "node_type": "search ची व्याप्ती संकुचित करण्यासाठी node type (optional)",
    "node_scope": "search ची व्याप्ती संकुचित करण्यासाठी graph scope (optional)",
    "limit": 10,
    "message": "काय सांगायचे (SPEAK साठी आवश्यक)",
    "questions": ["काय पुनर्विचार करायचे (PONDER साठी आवश्यक)"],
    "reasoning": "हे वाचन आपण जे शोधत आहात ते का शोधून काढते, किंवा आपण का switch केले"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  योग्य ठिकाणी शोधणे हाच या पायरीचा संपूर्ण उद्देश आहे.
