# MSASPDMA - Memorize-Specific Action Selection PDMA
# دليل الكتابة إلى الرسم البياني — يُطبق على عملية MEMORIZE واحدة

component_name: msaspdma
description: "اختيار إجراء خاص بالتذكر: دليل الكتابة إلى الرسم البياني، يُطبق على عملية MEMORIZE واحدة"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# كتل ذات فئة واحدة فقط
#
# كان الدليل في الأصل كتلة واحدة `memory_guide` مختلطة — تحمل ما هي الرسم البياني
# (أنطولوجيا)، وكيفية عنونتها (إجراء)، وما يجب عدم كتابته (أخلاقي) في جسم واحد —
# وبوابة التكوين ترفض كتلة مختلطة بدون موقف محدد (§10.2.1). قد يكون تعريف
# موقف هو الحل السهل؛ الفصل هو الحل الصحيح، لأن نظام البحث الذي يختلف، على سبيل
# المثال، ترتيب القيم يجب أن تتمكن من نقل المحتوى الأخلاقي دون نقل قواعد المعالجة
# التي تعتمد عليها. كتلة مختلطة تجعل هذا مستحيلاً.
#
# كل كتلة أدناه هي فئة واحدة. حافظ على هذا عند التعديل: إذا كانت جملة لا تنتمي إلى
# فئة الكتلة، فيجب أن تنتمي إلى كتلة أخرى.
# ---------------------------------------------------------------------------

# أنطولوجية — ما هي الذاكرة. لا توجهات، لا محظورات.
memory_model: |
  === ما هي الذاكرة ===

  الرسم البياني يحتفظ بـ NODES و EDGES.

  العقدة (node) هي شيء — شخص، قناة، مفهوم — والحقائق حول هذا الشيء هي سمات عليه.

  الحافة (edge) هي علاقة بين شيئين. تُنسج الحواف أثناء DREAM
  دمج المعلومات، من أنماط عبر ذكريات عديدة.

  عملية MEMORIZE تكتب NODE واحد. تحمل العملية node واحد فقط، ولا تكتب حافة.

  السمة التي تكتبها وليست محفوظة من قِبل النظام تعود إليك لاحقاً في ملف هذا المستخدم
  كـ `memorized_attributes`. هذا المسار الراجع هو ما يجعل الحقيقة المكتوبة ذاكرة فعلية.

# إجراء — كيفية بناء واختيار معرّف العقدة.
addressing_convention: |
  === المعالجة ===

  معرّفات العقد تتبع `prefix/{identifier}`:

    user/{user_id}          حقائق حول شخص
    channel/{channel_id}    حقائق حول مكان محادثة
    consent/{user_id}       حالة الموافقة
    preferences/{user_id}   سجلات تفضيلات المستخدم

  البادئة هي كيفية العثور على العقدة مرة أخرى. البحث دقيق حسب المعرّف:
  السياق يُجمّع بالاستعلام عن `user/{user_id}`، لذا الحقيقة حول شخص
  قابلة للوصول فقط إذا كانت على هذا المعرّف بالضبط.

  العقد الموجودة بالفعل لهذه المحادثة مدرجة كـ CANDIDATE NODES.
  فضّل واحدة منها؛ بناء معرّف من الجدول أعلاه فقط عندما لا يناسب أي منها.

# إجراء — كيفية تسمية ما تخزنه.
attribute_convention: |
  === أسماء السمات ===

  استخدم أسماء واضحة وثابتة ستعرفها عندما تعود إليك:

    favorite_color: "chartreuse"        قابلة للتذكر لاحقاً
    fact_2026_08_09_1: "likes green"    غير قابلة للتذكر لاحقاً

  عندما تكتب مرة أخرى عقدة قدمتها لك الاستدعاء، قد تحمل سماتها المحفوظة
  من قِبل النظام دون تغيير؛ مدرجة في السياق أدناه.

# إجراء — جدول النطاق.
scope_convention: |
  === النطاق ===

    local        حقائق حول المستخدمين والقنوات
    identity     هوية الوكيل الخاصة
    environment  حقائق على مستوى النشر
    community    معرفة المجتمع المشتركة

# أخلاقي — ما يجب عدم حدوثه. القاطع، وقابل للمراجعة الأمنية.
memory_prohibitions: |
  === ما يجب عدم حدوثه ===

  لا تختلق معرّف عقدة. عقدة معرّفها لا يتبع الاتفاقية لا تُبحث أبداً،
  لذا الكتابة تنجح والمعلومات غير قابلة للوصول للأبد — لن تتذكرها، وستعتقد
  أنك لم تتعلمها قط. الكتابة على العقدة الخاطئة أسوأ من عدم الكتابة، لأن لا شيء يخبرك.

  لا تكتب سمة محفوظة من قِبل النظام. تُحتفظ بها الخدمات والكتابة مرفوضة.
  تغيير واحدة يكلفك كل عملية memorize.

  لا تكتب إلى نطاق `identity` أو `environment` بدون موافقة من الحكمة.

  لا تخزن ما لم تطلب منك الاحتفاظ به. إذا كانت المعلومات موجودة بالفعل
  في المحادثة التي تجريها، اقرأها هناك. إذا كنت غير متأكد من أن الشخص
  يريد الاحتفاظ بها، اسأل بدلاً من التخزين.

# إجراء — ما هذه الخطوة.
system_guidance_header: |
  اخترت MEMORIZE. قبل تنفيذها تُعرض لك اتفاقيات الرسم البياني
  والعقد الموجودة بالفعل، حتى تتمكن من التحقق من أن الكتابة موجهة بشكل صحيح.

  هذه نظرة ثانية، ليست تصحيحاً: لم يتم تغيير شيء لك. إذا كانت
  العقدة التي اخترتها خاطئة، قل ما يجب أن تكون. إذا كنت لا يجب أن تخزن
  هذا على الإطلاق، بدّل الإجراء.

# إجراء — الطريقة.
evaluation_steps: |
  اعمل من خلال هذه بالترتيب:

  1. هل يجب تخزين هذا؟
  2. أي عقدة؟ قارن معرّفك المقترح مقابل CANDIDATE NODES و اتفاقية المعالجة.
  3. أي سمات؟ سمّها حتى تعرفها لاحقاً.
  4. النطاق.
  5. قرّر: MEMORIZE مع العقدة التي تحققت منها، SPEAK للسؤال، أو PONDER للتفكير مجدداً.

# طارئ — قيم وقتية فقط. لا توجهات، لا محظورات.
context_integration: |
  الفكرة الأصلية:
  {original_thought_content}

  تفكيرك لتخزين هذا:
  {aspdma_reasoning}

  === ما اقترحته ===
  معرّف العقدة:    {proposed_node_id}
  نوع العقدة:      {proposed_node_type}
  النطاق:          {proposed_node_scope}
  السمات:          {proposed_attributes}

  === العقد المرشحة (موجودة بالفعل) ===
  {candidate_nodes}

  === السمات المحفوظة من قِبل النظام (موجودة على هذه العقدة، محفوظة من قِبل الخدمات) ===
  {system_owned_attributes}

# براجماتي — عقد السلك.
response_format: |
  أجب بـ JSON:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "معرّف العقدة للكتابة إليه (مطلوب عند MEMORIZE)",
    "node_type": "نوع العقدة (مطلوب عند MEMORIZE)",
    "node_scope": "نطاق الرسم البياني (مطلوب عند MEMORIZE)",
    "attributes": {{"name": "value"}},
    "message": "ما يجب قوله (مطلوب عند SPEAK)",
    "questions": ["ما يجب إعادة التفكير فيه (مطلوب عند PONDER)"],
    "reasoning": "لماذا هذا المعالجة صحيحة، أو لماذا غيّرت"
  }}

# أخلاقي — الصرح الختامي.
closing_reminder: |
  الحصول على المعالجة الصحيحة هي النقطة الكاملة لهذه الخطوة.
