component_name: rsaspdma
description: "Zaɓin Aiki na musamman don tunawa — jagorar karanta Zane na alaƙa, wanda aka yi amfani da shi ga shawarar RECALL guda ɗaya da aka gabatar"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  Ka zaɓi RECALL. Zaɓin Aiki ya zaɓi kalmar aikin ne kawai; wannan mataki
  yana faɗi abin da za a karanta.

  An nuna maka yadda ake yunakawa Zane na alaƙa da sakon da suke nan tuni, domin
  karantawar ta duba inda bayanin yake.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  RECALL yana warwarewa a wannan tsari:

    node_id   bincike daidai ne. Idan kumburin yana nan, za a mayar da shi, kuma babu
              wani abu da za a nema kuma.
    query     bincike na rubutu a Ƙwaƙwalwa, wanda za a taƙaita ta node_type da node_scope idan kuka
              bayar da su. Ana amfani da shi lokacin babu node_id, ko kuma bai dace da komai ba.

  Wuce waɗannan juna-juna:

  1. MENE NE kuke nema? Abu ɗaya, a faɗi a sarari.
  2. SHIN TUNI YANA GABAN KU NE? Bayanan da aka ajiye na mutum suna zuwa tare da
     bayaninsa, kuma tattaunawar tana cikin mahallinku. Abin da kuka riga kuka iya karantawa
     ba ya buƙatar RECALL.
  3. SHIN YANA KAN KUMBURIN DA ZA KU IYA SUNANTA? Idan ɗaya daga cikin CANDIDATE NODES yana riƙe da shi, bayar
     da wannan id a matsayin node_id.
  4. IDAN HAKA BA NE, bayar da query: mafi ƙarancin kalmomi da suke bayyana abin da kuke so. Ƙara
     node_type ko node_scope kawai idan kun san su.
  5. Yanke shawara: RECALL tare da abin da kuka bincika, SPEAK don amsa ko tambaya, ko
     PONDER don sake yin tunani.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === Abin da ba zu kaɗa ===

  Kada ka gina ID na sako. ID wanda ba ya biya ka'ida ba zai dace da
  komai ba, kuma sakamako mara komai sai ya zama kamar "Ban taɓa koyon wannan ba" alhali
  gaskiyar ita ce "Na nemi a wurin da bai dace ba".

  Kada ka faɗi abin da RECALL ya mayar kafin ya gudana. Wannan mataki yana magana a kan
  karantawa; sakamakon yana zuwa bayan haka.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Tunanin farko:
  {original_thought_content}

  Dalilin ka na tunawa:
  {aspdma_reasoning}

  === SAKON DA KE YANA (waɗannan sun kasance jiya) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  Amsa tare da JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "sako id daidai don karantawa (bayar da wannan ko query lokacin RECALL)",
    "query": "rubutun bincike (bayar da wannan ko node_id lokacin RECALL)",
    "node_type": "nawa sako don taƙaita bincike (na zaɓi)",
    "node_scope": "yankin Zane na alaƙa don taƙaita bincike (na zaɓi)",
    "limit": 10,
    "message": "abin da za a faɗi (yana buƙata lokacin SPEAK)",
    "questions": ["abin da za a sake yin tunani a kai (yana buƙata lokacin PONDER)"],
    "reasoning": "dalilin da ya sa wannan karatu ya samo abin da kake nema, ko dalilin sauyawa"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Neman a wurin da ya dace shine ainihin manufar wannan mataki.
