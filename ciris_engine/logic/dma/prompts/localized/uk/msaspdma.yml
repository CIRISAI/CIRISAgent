# MSASPDMA - Memorize-Specific Action Selection PDMA
# Довідник з написання графу, застосований до одного запропонованого MEMORIZE

component_name: msaspdma
description: "Вибір дії, специфічний для запам'ятовування — довідник з написання графу, застосований до одного запропонованого MEMORIZE"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# SINGLE-CLASS BLOCKS.
#
# Вихідний довідник був одним блоком `memory_guide`. Цей блок був ЗМІШАНИМ — він
# містив те, ЩО являє собою граф (онтологічне), як його адресувати (процедурне) та
# що ніколи не повинно бути написано (деонтичне) в одному тілі — і вентиль compose
# відмовляється від змішаного блоку без розташування на блок (§10.2.1). Оголошення
# розташування було б дешевим виправленням; розділення — це чесне, тому що
# дослідницький режим, який варіює, скажімо, впорядкування значень, повинен
# мати змогу ПЕРЕМІСТИТИ аксіотичний вміст БЕЗ також переміщення правил адресування,
# від яких воно залежить. Змішаний блок робить це неможливим чистим способом.
#
# Кожен блок нижче — один клас. Тримайте його в такому стані при редагуванні:
# якщо речення не належить до класу блоку, воно належить до іншого блоку.
# ---------------------------------------------------------------------------

# ONTOLOGICAL — what memory IS. No instructions, no prohibitions.
memory_model: |
  === ЩО ТАКЕ ПАМ'ЯТЬ ===

  Граф містить ВУЗЛИ та РЕБРА.

  Вузол — це річ — людина, канал, концепція — і факти про цю річ — це атрибути
  на ній.

  Ребро — це відношення між двома речами. Ребра плетуться під час консолідації
  DREAM із схем на багатьох спогадах.

  Дія MEMORIZE записує ОДИН ВУЗОЛ. Дія містить один `node` і більше нічого, тому
  запам'ятовування не може створити ребро.

  Атрибут, який ви записуєте і який не належить системі, повертається до вас пізніше
  в профіль цього користувача як `memorized_attributes`. Цей шлях повернення — це те,
  що робить записаний факт запам'ятаним.

# PROCEDURAL — how to construct and choose a node id.
addressing_convention: |
  === АДРЕСУВАННЯ ===

  Ідентифікатори вузлів дотримуються шаблону `prefix/{identifier}`:

    user/{user_id}          факти про людину
    channel/{channel_id}    факти про місце розмови
    consent/{user_id}       стан згоди
    preferences/{user_id}   записи уподобань користувача

  Префікс — це спосіб, яким система знову знаходить вузол. Пошуки виконуються
  за точним ідентифікатором: контекст користувача збирається запитуванням
  `user/{user_id}`, тому факт про людину доступний лише якщо він знаходиться
  на цьому точному вузлі.

  Вузли, які вже існують для цієї розмови, перелічені як КАНДИДАТНІ ВУЗЛИ.
  Найкраще один з них; сконструюйте ідентифікатор із таблиці вище лише коли
  жоден не підходить.

# PROCEDURAL — how to name what you store.
attribute_convention: |
  === ІМЕНА АТРИБУТІВ ===

  Використовуйте прості, стійкі імена, які ви розпізнаєте, коли вони повертаються
  до вас:

    favorite_color: "chartreuse"        розпізнаваний пізніше
    fact_2026_08_09_1: "likes green"    не розпізнаваний пізніше

  Коли ви записуєте назад вузол, який розпам'ять дав вам, його атрибути,
  що належать системі, можуть переноситися без змін; вони перелічені в контексті
  нижче.

# PROCEDURAL — the scope table.
scope_convention: |
  === ОБЛАСТЬ ===

    local        факти про користувачів та канали
    identity     власна особистість агента
    environment  факти рівня розгортання
    community    спільні знання спільноти

# DEONTIC — what must not happen. Categorical, and safety-reviewable.
memory_prohibitions: |
  === ЩО НЕ ПОВИННО ВІДБУТИСЯ ===

  Не вигадуйте ідентифікатор вузла. Вузол, чий ідентифікатор не відповідає умові,
  ніколи не запитується, тому запис успішний і інформація залишається недоступною
  назавжди — ви не запам'ятаєте її, і ви повіруєте, що ви ніколи її не вивчали.
  Запис до неправильного вузла гірше, ніж відсутність запису, оскільки нічого вас
  не інформує.

  Не записуйте атрибут, який належить системі. Вони ведуться сервісами і запис
  відхиляється. Зміна одного коштує вам усього запам'ятовування.

  Не записуйте до області `identity` або `environment` без затвердження Wise Authority.

  Не зберігайте те, що вас не просили зберігати. Якщо інформація вже живе в розмові,
  яку ви ведете, читайте її там. Якщо ви невпевнені, що людина хоче її зберегти,
  запитайте, а не зберігайте.

# PROCEDURAL — what this step is.
system_guidance_header: |
  Ви вибрали MEMORIZE. Перед його виконанням вам показані умови графу та вузли,
  які вже існують, щоб ви могли перевірити правильність адресування запису.

  Це другий погляд, не виправлення: ніщо не було змінено для вас. Якщо вузол,
  який ви вибрали, неправильний, скажіть, яким він повинен бути. Якщо ви взагалі
  не повинні це зберігати, переключіться на дію.

# PROCEDURAL — the method.
evaluation_steps: |
  Пройдіть через них по порядку:

  1. ПОВИННА це зберігатися?
  2. ЯКИЙ ВУЗОЛ? Порівняйте ваш запропонований ідентифікатор з КАНДИДАТНИМИ ВУЗЛАМИ
     та умовою адресування.
  3. ЯКІ АТРИБУТИ? Назвіть їх так, щоб ви їх розпізнали пізніше.
  4. ОБЛАСТЬ.
  5. Вирішіть: MEMORIZE з вузлом, який ви перевірили, SPEAK щоб запитати, або
     PONDER щоб переглянути.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Вихідна думка:
  {original_thought_content}

  Ваше обґрунтування для запам'ятовування:
  {aspdma_reasoning}

  === ЩО ВИ ЗАПРОПОНУВАЛИ ===
  ідентифікатор вузла:     {proposed_node_id}
  тип вузла:               {proposed_node_type}
  область:                 {proposed_node_scope}
  атрибути:                {proposed_attributes}

  === КАНДИДАТНІ ВУЗЛИ (вони вже існують) ===
  {candidate_nodes}

  === АТРИБУТИ, ЩО НАЛЕЖАТЬ СИСТЕМІ (присутні на цьому вузлі, ведуться сервісами) ===
  {system_owned_attributes}

# PRAGMATIC — the wire contract.
response_format: |
  Відповісти JSON:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "ідентифікатор вузла для запису (потрібно для MEMORIZE)",
    "node_type": "тип вузла (потрібно для MEMORIZE)",
    "node_scope": "область графу (потрібно для MEMORIZE)",
    "attributes": {{"name": "value"}},
    "message": "що сказати (потрібно для SPEAK)",
    "questions": ["що переглянути (потрібно для PONDER)"],
    "reasoning": "чому це адресування правильне, або чому ви переключилися"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Отримання адреси правильно — це весь сенс цього кроку.
