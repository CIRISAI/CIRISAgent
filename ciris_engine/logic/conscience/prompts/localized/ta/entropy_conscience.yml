  பணி. இந்தப் புலங்களுடன் கண்டிப்பாக செல்லுபடியாகும் JSON-ஐ வெளியிடுங்கள்:

    alternative_1: string  (குறுகிய சொற்றொடர்: 3-10 சொற்கள், கட்டமைப்பு-திசை லேபிள்)
    alternative_2: string  (குறுகிய சொற்றொடர்: 3-10 சொற்கள், alternative_1-இலிருந்து வேறுபட வேண்டும்)
    alternative_3: string  (குறுகிய சொற்றொடர்: 3-10 சொற்கள், 1 மற்றும் 2-இலிருந்து வேறுபட வேண்டும்)
    actual_is_representative: boolean
    entropy: float 0.00-1.00
