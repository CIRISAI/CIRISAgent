component_name: rsaspdma
description: "RECALL-विशिष्ट क्रिया चयन — graph पढ़ने वाली guide, एक प्रस्तावित RECALL पर लागू"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  आपने RECALL चुना है। क्रिया चयन ने केवल verb चुना; यह step बताता है कि क्या पढ़ना है।

  आपको दिखाया जाता है कि graph को कैसे address किया जाता है और कौन से nodes पहले से exist करते हैं, ताकि read वहां देखे जहां information है।

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  एक recall इस क्रम में resolve होता है:

    node_id   एक exact lookup। यदि वह node exists करता है तो वह return किया जाता है, और कुछ भी और search नहीं किया जाता।
    query     memory की एक text search, जिसे आप node_type और scope देने पर narrow किया जाता है। इसका उपयोग तब होता है जब कोई node_id नहीं है, या वह किसी से match नहीं हुआ।

  इनको क्रम में काम करें:

  1. आप क्या ढूंढ रहे हैं? एक चीज़, स्पष्ट रूप से बताई गई।
  2. क्या यह पहले से आपके सामने है? किसी व्यक्ति के stored facts उनके profile के साथ आते हैं, और conversation आपके context में है। जो आप पहले से पढ़ सकते हैं उसके लिए recall की जरूरत नहीं है।
  3. क्या यह किसी ऐसे node पर है जिसे आप नाम दे सकते हैं? यदि CANDIDATE NODES में से कोई इसे रखता है, तो उस id को node_id के रूप में दें।
  4. अन्यथा एक query दें: सबसे कम शब्द जो आपके चाहे गए को पहचानते हैं। node_type या node_scope तभी जोड़ें जब आप उन्हें जानते हों।
  5. Decide करें: आपके checked किए हुए के साथ RECALL, उत्तर देने या पूछने के लिए SPEAK, या reconsider करने के लिए PONDER।

# DEONTIC — what must not happen.
memory_prohibitions: |
  === जो नहीं होना चाहिए ===

  एक node id invent न करें। एक id जो convention का पालन नहीं करता किसी से भी match नहीं होता, और फिर एक empty result "मैंने यह कभी नहीं सीखा" जैसा पढ़ा जाता है जबकि truth यह है कि "मैंने गलत जगह देखी"।

  एक recall के चलने से पहले यह न बताएं कि उसने क्या return किया। यह step read को address करता है; result बाद में आता है।

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  मूल विचार:
  {original_thought_content}

  Recall करने के लिए आपका reasoning:
  {aspdma_reasoning}

  === CANDIDATE NODES (ये पहले से exist करते हैं) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON के साथ respond करें:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "पढ़ने के लिए exact node id (RECALL के समय यह या query दें)",
    "query": "search text (RECALL के समय यह या node_id दें)",
    "node_type": "search को narrow करने के लिए node type (वैकल्पिक)",
    "node_scope": "search को narrow करने के लिए graph scope (वैकल्पिक)",
    "limit": 10,
    "message": "क्या कहना है (SPEAK के लिए आवश्यक)",
    "questions": ["क्या reconsider करना है (PONDER के लिए आवश्यक)"],
    "reasoning": "यह read वह क्यों खोजता है जो आप ढूंढ रहे हैं, या आपने क्यों switch किया"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  सही जगह पर देखना ही इस step का पूरा उद्देश्य है।
