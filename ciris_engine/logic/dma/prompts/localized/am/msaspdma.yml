# MSASPDMA - ለማስታወስ ልዩ የእርምጃ ምርጫ PDMA
# ግራፍ ላይ አጻጻፍ የሚመራው መመሪያ፣ በአንድ በቀረበ MEMORIZE ላይ ተፈጻሚ ይሆናል

component_name: msaspdma
description: "ለማስታወስ ልዩ የእርምጃ ምርጫ፦ ግራፍ ላይ አጻጻፍ የሚመራው መመሪያ፣ በአንድ የቀረበ MEMORIZE ላይ ተፈጻሚ ይሆናል"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# ነጠላ-ምድብ ብሎኮች።
#
# ይህ መመሪያ በመጀመሪያ አንድ ብቻ `memory_guide` ብሎክ ነበር። ያ ብሎክ የተቀላቀለ ነበር፦
# ግራፉ ምን እንደሆነ (ስለ ህልውናው)፣ እንዴት እንደሚደረስበት (ስለ ሂደቱ)፣ እና ምን
# በፍጹም መጻፍ እንደሌለበት (ስለ ግዴታው) ሁሉንም በአንድ አካል ውስጥ ይዞ ነበር። የስርዓቱ
# ማጣሪያ ደንብ ያለ ግልጽ የብሎክ ምድብ የተቀላቀለ ብሎክ አይቀበልም (§10.2.1)። ምድብ
# መስጠት ቀላሉ መፍትሔ ነበር፤ ብሎኩን መክፈል ግን ትክክለኛው መፍትሔ ነው፣ ምክንያቱም
# ለምሳሌ የእሴት ቅደም ተከተልን የሚቀያይር የምርምር አሠራር፣ በእሱ ላይ የተመሠረቱትን
# የአድራሻ ደንቦች ሳይነካ የስነ-ምግባር ይዘቱን ብቻ ማንቀሳቀስ መቻል አለበት። የተቀላቀለ
# ብሎክ ይህንን በንጽህና ለማድረግ የማይቻል ያደርገዋል።
#
# ከዚህ በታች ያለው እያንዳንዱ ብሎክ አንድ ምድብ ብቻ ይይዛል። ስታርሙ ይህንን ጠብቁ፦ አንድ
# ዓረፍተ ነገር የብሎኩ ምድብ ካልሆነ፣ ወደ ሌላ ብሎክ መዛወር አለበት።
# ---------------------------------------------------------------------------

# ስለ ህልውና — ትዝታ ምን እንደሆነ ይገልጻል። ምንም መመሪያ የለም፣ ምንም ክልከላ የለም።
memory_model: |
  === ትዝታ ምንድን ነው ===

  ግራፉ ኖዶችን እና ጠርዞችን ይይዛል።

  ኖድ ማለት አንድ ነገር ነው — ሰው፣ የውይይት ቦታ፣ ወይም ሐሳብ ሊሆን ይችላል። ስለዚያ ነገር
  ያሉ እውነታዎች በእሱ ላይ ያሉ ባህርያት ናቸው።

  ጠርዝ ማለት በሁለት ነገሮች መካከል ያለ ግንኙነት ነው። ጠርዞች የሚፈጠሩት በ DREAM
  ማጠናከሪያ ጊዜ ነው፣ ከብዙ ትዝታዎች ውስጥ ከሚታዩ ስልቶች ተነስተው።

  የ MEMORIZE እርምጃ አንድ ኖድ ብቻ ይጽፋል። እርምጃው አንድ `node` ብቻ ይይዛል፣
  ሌላ ምንም፤ ስለዚህ አንድ memorize ጠርዝ መፍጠር አይችልም።

  ስርዓቱ ያልያዘውን ባህርይ ብትጽፉ፣ ያ ባህርይ በኋላ ወደ ተጠቃሚው መገለጫ ተመልሶ
  ይመጣል፣ እንደ `memorized_attributes`። ይህ የመመለሻ መንገድ ነው የተጻፈ እውነታን
  የታወሰ እውነታ የሚያደርገው።

# ስለ ሂደት — የኖድ መለያ እንዴት እንደሚገነባና እንደሚመረጥ ይገልጻል።
addressing_convention: |
  === አድራሻ አሰጣጥ ===

  የኖድ መለያዎች `prefix/{identifier}` የሚለውን ቅርጽ ይከተላሉ፦

    user/{user_id}          ስለ አንድ ሰው ያሉ እውነታዎች
    channel/{channel_id}    ስለ አንድ የውይይት ቦታ ያሉ እውነታዎች
    consent/{user_id}       የፈቃድ ሁኔታ
    preferences/{user_id}   የተጠቃሚ ምርጫ መዝገቦች

  ቅድመ-ቅጥያው ስርዓቱ ኖዱን ደግሞ የሚያገኝበት መንገድ ነው። ፍለጋ የሚደረገው በትክክለኛ
  መለያ ነው፦ የተጠቃሚው አውድ የሚሰበሰበው `user/{user_id}`ን በመጠየቅ ነው፣ ስለዚህ
  ስለ አንድ ሰው ያለ እውነታ ሊደረስበት የሚችለው በዚያው ትክክለኛ ኖድ ላይ ከተቀመጠ ብቻ ነው።

  ለዚህ ውይይት አስቀድመው ያሉ ኖዶች እንደ እጩ ኖዶች ተዘርዝረዋል። ከእነዚህ አንዱን
  ምረጡ፤ ከላይ ካለው ሰንጠረዥ መለያ የሚገነባው አንድም የማይስማማ ሲኖር ብቻ ነው።

# ስለ ሂደት — የምታስቀምጡትን ነገር እንዴት እንደምትሰይሙ ይገልጻል።
attribute_convention: |
  === የባህርይ ስሞች ===

  ኋላ ላይ ተመልሰው ሲመጡ የምታውቋቸውን ግልጽና ቋሚ ስሞች ተጠቀሙ፦

    favorite_color: "chartreuse"        ኋላ ላይ የሚታወቅ
    fact_2026_08_09_1: "likes green"    ኋላ ላይ የማይታወቅ

  recall የሰጣችሁን ኖድ መልሳችሁ ስትጽፉ፣ ስርዓቱ የያዛቸው ባህርያት ሳይለወጡ
  እንዳሉ ሊቀጥሉ ይችላሉ፤ እነሱ ከዚህ በታች ባለው አውድ ውስጥ ተዘርዝረዋል።

# ስለ ሂደት — የክልል ሰንጠረዥ።
scope_convention: |
  === ክልል ===

    local        ስለ ተጠቃሚዎችና የውይይት ቦታዎች ያሉ እውነታዎች
    identity     የወኪሉ ራሱ ማንነት
    environment  ስለ አሰማራሪያው ደረጃ ያሉ እውነታዎች
    community    የጋራ የማህበረሰብ እውቀት

# ስለ ግዴታ — ምን መከሰት እንደሌለበት ይገልጻል። ፍጹማዊ ደንብ ሲሆን፣ ለደህንነት ግምገማ ተብሎ ተጽፏል።
memory_prohibitions: |
  === ምን መከሰት እንደሌለበት ===

  የኖድ መለያ አትፍጠሩ (አትገምቱ)። ደንቡን የማይከተል መለያ ያለው ኖድ በጭራሽ
  አይጠየቅም፤ ስለዚህ አጻጻፉ ይሳካል ግን መረጃው ለዘላለም ሊደረስበት አይችልም —
  አታስታውሱትም፣ እናም ጨርሶ እንዳልተማራችሁት ታምናላችሁ። ወደ ተሳሳተ ኖድ መጻፍ
  ካለመጻፍ የከፋ ነው፣ ምክንያቱም ምንም ነገር አያሳውቃችሁም።

  ስርዓቱ የያዘውን ባህርይ አትጻፉ። እነዚህ ባህርያት በአገልግሎቶች የሚጠበቁ ናቸው፣
  አጻጻፉም ይከለከላል። አንዱን ለመቀየር ብትሞክሩ መላውን memorize ያስከፍላችኋል።

  ያለ Wise Authority ፈቃድ ወደ `identity` ወይም `environment` ክልል አትጻፉ።

  እንድታስቀምጡ ያልተጠየቃችሁትን አታስቀምጡ። መረጃው ቀድሞውኑ በያዛችሁት ውይይት
  ውስጥ ካለ፣ እዚያው አንብቡት። ሰውየው እንዲቀመጥለት ይፈልግ እንደሆነ እርግጠኛ
  ካልሆናችሁ፣ ከማስቀመጥ ይልቅ ጠይቁ።

# ስለ ሂደት — ይህ ደረጃ ምን እንደሆነ ይገልጻል።
system_guidance_header: |
  MEMORIZE መርጣችኋል። ከመፈጸሙ በፊት የግራፉ ደንቦችና አስቀድመው ያሉ ኖዶች
  ይታይላችኋል፣ አጻጻፉ በትክክል አድራሻ መያዙን እንድታረጋግጡ።

  ይህ ሁለተኛ እይታ ነው፣ ማስተካከያ አይደለም፦ ለእናንተ ምንም አልተለወጠም። የመረጣችሁት
  ኖድ የተሳሳተ ከሆነ፣ ትክክለኛው ምን መሆን እንዳለበት ንገሩ። ይህንን ጨርሶ ማስቀመጥ
  የለብም ካላችሁ፣ እርምጃውን ቀይሩ።

# ስለ ሂደት — መንገዱን ይገልጻል።
evaluation_steps: |
  በዚህ ቅደም ተከተል አልፉ፦

  1. ይህ ሊቀመጥ ይገባል?
  2. የትኛው ኖድ? የቀረባችሁትን መለያ ከእጩ ኖዶች እና ከአድራሻ አሰጣጡ ደንብ ጋር
     አወዳድሩ።
  3. የትኞቹ ባህርያት? ኋላ ላይ የምታውቋቸው ስሞች ስጧቸው።
  4. ክልል።
  5. ውሰኑ፦ ያረጋገጣችሁትን ኖድ ይዛችሁ MEMORIZE፣ ለመጠየቅ SPEAK፣ ወይም መልሳችሁ
     ለማሰብ PONDER።

# ድንገተኛ ይዘት — በሩጫ ጊዜ የሚገኙ ዋጋዎች ብቻ። ምንም መመሪያ የለም፣ ምንም ክልከላ የለም።
context_integration: |
  ዋናው ሀሳብ፦
  {original_thought_content}

  ለማስታወስ ያላችሁ ምክንያት፦
  {aspdma_reasoning}

  === የቀረበው ሐሳብ ===
  የኖድ መለያ፦   {proposed_node_id}
  የኖድ ዓይነት፦   {proposed_node_type}
