# Phase-1 gate SELF-CHECK regime (#973) — varies NOTHING.
#
# Purpose: CI runs the compose dump twice and gates the two dumps against
# each other under this regime. Every class is held, so a deterministic
# composition must PASS every Phase-1 assertion; a mutated copy must FAIL.
# This is the gate gating itself — not a campaign regime, and never a
# template for one (a campaign regime pins a concrete residue_digest and
# does NOT blanket-hold its mixed blocks without reading §10.2.1).
#
# `pins.residue_digest: "live"` is the self-check-only sentinel: the gate
# resolves it to the digest of the tree it runs in. A campaign regime MUST
# pin the concrete sha256 value (see research_overrides digest).
schema: ciris.ai/experimental_regime/v2-phase1
regime_id: phase1-selfcheck-null
arms:
  a: {harness: h3ere}
  b: {harness: h3ere}
blocks:
  # Every mixed block needs an explicit disposition (§10.2.1 refusal by
  # default). Nothing is varied here, so holding them accepts no confound.
  #
  # This list is EXACTLY the #997 EXPECTED_MIXED ratchet plus the five
  # FSD-declared irreducible worked exemplars (§10.2.1 [T-5a]) — down from the
  # pre-#997 world where most of the prompt surface was mixed and the bare
  # `system:` / `user:` suffixes swallowed it. Keys are `<component>.<field>`
  # because a block is now a FIELD; `_regime_entry_for` resolves them by the
  # suffix after the step, so one entry covers every step that composes it.
  #
  # `language_guidance` (bare) is now the UNSPLIT scalar only — the 24 locales
  # whose prose does not partition on the English boundaries. en/es/fr/it/pt
  # compose 29 `language_guidance.<part>` blocks instead, of which 24 are
  # single-class and need no entry here.
  language_guidance:
    disposition: hold
    contaminant: [axiotic, deontic, empirical]
  # The five worked exemplars. FSD §10.2.1 [T-5a]: verdict, register and schema
  # in the same tokens — the co-occurrence IS the demonstration, so the honest
  # options are hold-verbatim or replace-whole-exemplar, never split. Nothing is
  # varied in this regime, so holding them accepts no confound; a campaign
  # regime that varies axiotic must write `confound_accepted: axiotic` and mean it.
  language_guidance.13_exemplar_speak_response:
    disposition: hold
    contaminant: [pragmatic, axiotic, deontic, empirical]
  language_guidance.14_exemplar_register_pressure:
    disposition: hold
    contaminant: [pragmatic, axiotic]
  language_guidance.16_exemplar_false_reassurance:
    disposition: hold
    contaminant: [deontic, pragmatic, axiotic]
  language_guidance.23_ratification_templates:
    disposition: hold
    contaminant: [pragmatic, epistemic, ontological, axiotic]
  language_guidance.25_exemplar_cross_cluster:
    disposition: hold
    contaminant: [deontic, epistemic, empirical, axiotic]
  pdma_ethical.system_guidance_header:
    disposition: hold
    contaminant: [procedural, axiotic, structural]
  action_selection_pdma.system_message:
    disposition: hold
    contaminant: [ontological, axiotic, procedural, pragmatic, contingent]
  action_selection_pdma.context_integration.slots:
    disposition: hold
    contaminant: [procedural, axiotic, deontic, contingent]
  coherence_conscience.system_prompt:
    disposition: hold
    contaminant: [axiotic, deontic, epistemic, ontological, procedural]
  epistemic_humility_conscience.system_prompt:
    disposition: hold
    contaminant: [axiotic, deontic, epistemic, ontological, procedural]
  optimization_veto_conscience.system_prompt:
    disposition: hold
    contaminant: [axiotic, deontic, epistemic, empirical, procedural, structural]
pins:
  residue_digest: "live"
