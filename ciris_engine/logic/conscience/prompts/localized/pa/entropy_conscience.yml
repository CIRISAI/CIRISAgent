                ਹੈ, ਜਾਂ ਸਾਰੇ ਵਿਕਲਪ ਇਕੱਠੇ ਹੁੰਦੇ ਹਨ ਪਰ ਅਸਲ ਜਵਾਬ ਉਹਨਾਂ ਦਾ ਖੰਡਨ ਕਰਦਾ ਹੈ
                (ਭਰਮ / ਡ੍ਰਿਫਟ ਸਿਗਨਲ)। ਅਪਵਾਦ: ਜੇਕਰ ਅਸਲ ਜਵਾਬ canonical-refusal
                ਰੂਪ ਰੱਖਦਾ ਹੈ (ਉੱਪਰ 0.00-0.15 ਅਨੁਸਾਰ), ਤਾਂ ਇਹ ਡ੍ਰਿਫਟ ਨਹੀਂ ਹੈ —
