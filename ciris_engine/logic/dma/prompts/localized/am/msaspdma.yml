# MSASPDMA - Memorize-Specific Action Selection PDMA
# ግራፍ-ጻፍ ድንቅተ-ትዕዛዝ — በአንድ MEMORIZE ላይ ተተግብር

component_name: msaspdma
description: "ለማስታወስ ልዩ የእርምጃ ምርጫ: ግራፍ-ጻፍ ድንቅተ-ትዕዛዝ, በአንድ MEMORIZE ላይ ተተግብር"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# ነጠላ-ክፍል ብሎኮች
#
# ሚራተ ውጤታ በዋናነት አንድ `memory_guide` ብሎክ ነበር — ግራፍ ምንድነው (ስሌታዊ),
# ይህንን ይታወሱ ተብሎ ሰኞያ (ሥራ), እና ምንን መጻፍ የልቦ (ሥነ-ምግባር) — ሰው
# ውስጥ — እና ሕጋዊ በር ውስን ብሎክ ሳያጸናበት እየወሰደ (§10.2.1)።
# ወሳኔ ለመመርመር ትክክለኛ-ቀላል ነበር; መክፈቱ honest ነው, ምክንያቱም ምርምር ስርዓት
# ተለዋጫ, ለምሳሌ, እሴት ቅደም-ተእዛዝ, ሲሞለ ሥነ-ምግባር ሐውልት ንቅቅ ለመንቀሳቀስ
# ሥራ-ቁሳቁስ ሳያስታወስ. ውስን ብሎክ ይህ አስቸጋሪ ያደርገዋል።
#
# እያንዳንዱ ብሎክ ሐ ነጠላ ክፍል ነው. ሲያርር ይህን ቆይ: ዓረፍተ ነገር ብሎክ
# ክፍል ገብ ካልሆነ, ሌላ ብሎክ ሊገባ ይገባል።
# ---------------------------------------------------------------------------

# ስሌታዊ — ማስታወሪያ ምንድነው። ምንም ወደ-ግልጽ, ምንም-ህግ።
memory_model: |
  === ማስታወሪያ ምንድነው ===

  ግራፍ NODES እና EDGES ይይዝ።

  ነጥብ (node) ነገር — ሰው, ገላጭ, ሀሳብ — እና
  ስለ ይህ ነገር ሐውልት በግራፍ ላይ ሚጤ ናቸው።

  ጠርዝ (edge) በሁለት ነገሮች መካከል ግንኙነት ነው। ጠርዞች DREAM
  ምዘናትውን ወቅት ታስረዋል, በርካታ ትውስታዎች ዘዴ ነ።

  MEMORIZE እርምጃ አንድ NODE ይጽፋል። እርምጃ አንድ `node` ብቻ ይይዝ,
  ስለዚህ memorize ጠርዝ አይጽፍ።

  ያወጡት ሚጤ ስርዓት-የመያዝ ካልሆነ ወደ ተጠቃሚ ገበታ ወደ ተጠቃሚ በ
  `memorized_attributes`. ይህ ሪታ-መንገድ ወደጻፋ ሐውልት ማስታወስ አገሉ።

# ሥራ — ነጥብ-ታኢ መገንባት እና መምረጥ።
addressing_convention: |
  === ትንታኖ ===

  ነጥብ-ታኢ `prefix/{identifier}` ተከተሉ:

    user/{user_id}          ስለ ሰው ሐውልት
    channel/{channel_id}    ስለ ውይይት ቦታ ሐውልት
    consent/{user_id}       የሞላወር ሁኔታ
    preferences/{user_id}   ተጠቃሚ ምርጫ ዘገባ

  ቅድመ-ሞርፊ ስርዓት ነጥብ ደጋሚ ምንገድ ያውቅ። ፍለጋ ትክክለኛ ታኢ:
  ተጠቃሚ ሁኔታ `user/{user_id}` ለመጠየቅ ሲሰራ, ስለዚህ ሐውልት ስለ ሰው
  ወደ ውሻ ወደ የሚደርስ ይህ ትክክለኛ ነጥብ ላይ።

  ነጥቦች ይህ ውይይት ላይ ቀድሞ አሉ CANDIDATE NODES.
  አንድ ምርጥ; ታኢ መገንባት ከ-ሰንጠረዥ ከላይ
  ዲፋልት አንድ ሞትስ።

# ሥራ — ምን ታስቀል ስሞች።
attribute_convention: |
  === ሚጤ-ስሞች ===

  ግልጽ, ዘወተር-ስሞች ይጠቀሙ, ወደ ታወሰ:

    favorite_color: "chartreuse"        ወደ ታወስ
    fact_2026_08_09_1: "likes green"    ወደ-ታወስ-ነገር

  እንደገና ተጠቃሚ ነጥብ አወጡ (ቅድሚያ መግለጫ ሰጠ),
  ስርዓት-የመያዝ ሚጤ ሊተላ ይቻል ብዙ ወይም ተለወጠ;
  ሌላ ሚጤ ሊስተካከሉ ይችላሉ።

# ሥራ — ክልል ሰንጠረዥ።
scope_convention: |
  === ክልል ===

    local        ስለ ተጠቃሚ እና ገላጭ ሐውልት
    identity     ወኪሉ ራሱ ማንነት
    environment  የውጪ-ደረጃ ሐውልት
    community    ጋራ ማህበረሰብ ዕውቀት

# ሥነ-ምግባር — ምንን መሆን የልቦ። አስወጣጥ, እና-ደህንነቶች-ራሱ።
memory_prohibitions: |
  === ምንን መሆን የልቦ ===

  ነጥብ-ታኢ አታቃጡ። ነጥብ ታኢ-ህጉ ሳይከተል
  ይሔ አል ነው, ስለዚህ ጽሑፍ-ሥራ ወደ-ታወስ
  ቋሚ ወደ-አዕምሮ — ወደ-ታወሱ, እና ታሰብ ወደ-ታወሱ-አልደረሱ።
  ጽሑፍ ተሳስተ ነጥብ ከ-አልኮ ይልቅ ከኩ ክስ,
  ምክንያቱም ምንም ነገር ነገር-ያውቀዋ።

  ስርዓት-የመያዝ ሚጤ አይጻፍ። እንደገና ተባለ በወኪሎች
  እና ጽሑፍ-አሉተ። ሚጤ ዋ-ወሳኔ ጽሑፍ ኢ።

  ወደ `identity` ወይም `environment` ክልል አይጻፉ ከ
  ወደ-ታወስ-ሙመ ሙገ።

  ገደብ ሐውልት-ማስቀየር ዘንድ ተስፈ ይሔ ነገር ታወስ።
  ሐውልት ውይይት ውስጥ ናቸው ካሉ, ሐ ድግሙ።
  ስለ-ታወስ-ቡንዓ ጥያቄ ፈዝ ይልቅ, ጥያቄ
  ይልቅ ብዓል።

# ሥራ — ይህ ደረጃ ምንድነው።
system_guidance_header: |
  ምርጫ MEMORIZE። ከ-ጽሑፍ ቅድሳ ያሰናይ አሪ
  ግራፍ-ቅሌተ-ክልሎች እና ነጥቦች ቀድሞ-ያሉ, ስለ-ይህ ክትትል
  ወደ-ናገስ ትክክል ትቀጥ።

  ይህ ሁለተኛ ተመልከት, ስልጥና-አይደለም: ምንም
  ቀይር ተቀንበር። ተመስረተ-ነጥብ ተሳስተ ከሆነ, ምን
  ሊገኝ። ገደብ-ያክልዉ ሐውልት ቀይር-ማያ,
  ወደ-ናገስ ቀይር།

# ሥራ — ዘዴ።
evaluation_steps: |
  ሐ-ለዚህ ይገባ:

  1. ይህ ማስታወስ ሊገኝ?
  2. የ ነጥብ? CANDIDATE NODES ተጀምር
  ለእርስዎ-ታኢ ከ-ክልሎች-ህግ።
  3. የ ሚጤ? ስሞች-ታወስ።
  4. ክልል።
  5. ሞ: MEMORIZE ከተወሰደ ነጥብ, SPEAK ቂስ,
  ወይም PONDER ደግሞ ሟላ።

# ሂሳበ-እሰብ — ሩነታ-እሴት ብቻ። ምንም-ወደ-ግልጽ, ምንም-ህግ።
context_integration: |
  ዋናው ሀሳብ:
  {original_thought_content}

  ለምን ይሕ ማስታወስ:
  {aspdma_reasoning}

  === ምን አውጡ ===
  ነጥብ-ታኢ:      {proposed_node_id}
  ነጥብ-ኯ:        {proposed_node_type}
  ክልል:          {proposed_node_scope}
  ሚጤ:           {proposed_attributes}

  === ተወዳዳሪ NODES (ቀድሞ ያሉ) ===
  {candidate_nodes}

  === ስርዓት-የመያዝ ሚጤ (ይህ ነጥብ, ወኪሎች-ተደገፈ) ===
  {system_owned_attributes}

# ሕልውና — ሩነታ-ውሪ።
response_format: |
  ይመልሱ ከ JSON:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "ነጥብ-ታኢ ታወስ (ይጠየቅ MEMORIZE ከ)",
    "node_type": "ነጥብ-ኯ (ይጠየቅ MEMORIZE ከ)",
    "node_scope": "ግራፍ-ክልል (ይጠየቅ MEMORIZE ከ)",
    "attributes": {{"name": "value"}},
    "message": "ምን ሐ (ይጠየቅ SPEAK ከ)",
    "questions": ["ምን ደግሞ (ይጠየቅ PONDER ከ)"],
    "reasoning": "ይህ ትንታኖ ትክክል, ወይም ለምን ቀይር"
  }}

# ሥነ-ምግባር — የመጨረሻ-ታሪክ።
closing_reminder: |
  ትንታኖ ትክክል ነው
  ሥራ ይህ ደረጃ።
