# MSASPDMA - Memory-Specific Action Selection PDMA
# ASPDMA MEMORIZE ఎంచుకున్న తర్వాత స్మృతి-ప్రత్యేక చర్య ఎంపిక

component_name: msaspdma
description: "స్మృతి-ప్రత్యేక చర్య ఎంపిక — గ్రాఫ్-రచన మార్గదర్శకం, ఒక ప్రతిపాదిత MEMORIZE-కు అన్వయించబడుతుంది"
version: "1.0"

accord_header: true

# ---------------------------------------------------------------------------
# ఒకే-తరగతి బ్లాకులు.
#
# మార్గదర్శకం అసలు ఒక `memory_guide` బ్లాక్. ఆ బ్లాక్ మిశ్రమ — ఇది గ్రాఫ్ ఏమిటి
# (ఆంటోలజికల్), దానిని ఎలా చిరునామా చేయాలి (ప్రక్రియ) మరియు
# ఏది ఎప్పుడూ రాయబడకూడదు (డియోంటిక్) ఒక్క శరీరంలో — మరియు
# కంపోజ్ గేట్ మిశ్రమ బ్లాక్‌ను నిరాకరిస్తుంది ఎటువంటి బ్లాక్ సంకల్పం లేకుండా (§10.2.1). ఒక బ్లాక్ సంకల్పం
# చెప్పేది చవకైన సమాధానం ఉండేది; విభజన నిజాయితీ సమాధానం.
#
# ప్రతి బ్లాక్ క్రింద ఒక తరగతి. సరిగా ఉంచండి:
# ఒక వాక్యం బ్లాక్ తరగతికి చెందనిది అయితే, ఆ తర్వాత ఇతర బ్లాక్‌కు చెందాలి.
# ---------------------------------------------------------------------------

# ఆంటోలజికల్ — స్మృతి ఏమిటి. ప్రక్రియలు లేవు, నిషేధాలు లేవు.
memory_model: |
  === స్మృతి ఏమిటి ===

  గ్రాఫ్ నోడ్‌లు మరియు అంచులను కలిగి ఉంటుంది.

  ఒక నోడ్ ఒక విషయం — ఒక వ్యక్తి, ఒక చానెల్, ఒక కన్సెప్ట్ — మరియు
  ఆ విషయం గురించిన వాస్తవాలు దానిపై లక్షణాలు.

  ఒక అంచు రెండు విషయాల మధ్య సంబంధం. అంచులు DREAM సమీకరణ సమయంలో
  అనేక జ్ఞాపనలలో నమూనాల నుండి నేయబడతాయి.

  ఒక MEMORIZE చర్య ఒక నోడ్‌ను రాస్తుంది. చర్య ఒక నోడ్‌ను మాత్రమే కలిగి ఉంటుంది
  మరియు మరేమీ లేదు, కాబట్టి ఒక memorize ఒక అంచు సృష్టించలేము.

  నువ్వు రాసిన ఒక లక్షణం సిస్టమ్-స్వంత కానిది అయితే దానిని ఫిరిగి పొందుతుంది
  ఆ ఉపయోగకర్తని ప్రొఫైల్‌లో `memorized_attributes` తో.
  ఆ రిటర్న్ మార్గం ద్వారా ఒక వ్రాయిన వాస్తవం ఆ తర్వాత ఒక జ్ఞాపిత ఒకటిగా నిర్ణయం.

# ప్రక్రియ — నోడ్ id నిర్మాణం మరియు ఎంపిక.
addressing_convention: |
  === చిరునామా ===

  నోడ్ ids `prefix/{identifier}` అనుసరిస్తాయి:

    user/{user_id}          ఒక వ్యక్తి గురించిన వాస్తవాలు
    channel/{channel_id}    సంభాషణ ఆశ్రయం గురించిన వాస్తవాలు
    consent/{user_id}       సమ్మతి స్థితి
    preferences/{user_id}   ఉపయోగకర్త ప్రిఫరెన్స్ రికార్డ్‌లు

  ఉపసర్గ సిస్టమ్‌కు నోడ్‌ను ఎలా కనుగొందో చెబుతుంది. లుకప్‌లు ఖచ్చితమైన id ద్వారా జరుగుతాయి:
  ఉపయోగకర్త సందర్భం `user/{user_id}` ఆశ్చర్యకరంగా సేకరించుకుంటుంది, కాబట్టి
  ఒక వ్యక్తి గురించిన వాస్తవం ఆ ఖచ్చితమైన నోడ్ మీద ఉంటే మాత్రమే
  తిరిగి కనిపిస్తుంది.

  ఈ సంభాషణకు ఇప్పటికే ఉన్న నోడ్‌లు CANDIDATE NODES గా జాబితా చేయబడ్డాయి.
  వాటిలో ఒకదానిని ఇష్టపడండి; ఎటువంటి సరిపోయినది లేనప్పుడు మాత్రమే
  పై పట్టిక నుండి id నిర్మించండి.

# ప్రక్రియ — నువ్వు నిల్చెచే సమయంలో ఎలా పేరు పెట్టాలి.
attribute_convention: |
  === లక్షణ పేర్లు ===

  సరళమైన, స్థిర పేర్లను ఉపయోగించండి నువ్వు వాటిని ఫిరిగి నుండితే గుర్తించుకోవచ్చు:

    favorite_color: "chartreuse"        ఫిరిగి నుండితే గుర్తించగలను
    fact_2026_08_09_1: "likes green"    ఫిరిగి నుండితే గుర్తించ కూడదు

  నువ్వు ఫిరిగి నిల్చెచేసిన ఒక నోడ్‌కు తిరిగి రాసేటప్పుడు, దానిపై
  సిస్టమ్-స్వంత లక్షణాలను అక్షరచ క్రమం లేకుండా నిర్వహించవచ్చు; అవి
  క్రింద సందర్భంలో జాబితా చేయబడ్డాయి.

# ప్రక్రియ — స్కోప్ పట్టిక.
scope_convention: |
  === స్కోప్ ===

    local        ఉపయోగకర్త మరియు చానెల్ గురించిన వాస్తవాలు
    identity     ఏజెంట్ సొంత గుర్తింపు
    environment  వాయిదా-స్థర వాస్తవాలు
    community    సాధారణ కమ్యూనిటీ జ్ఞానం

# డియోంటిక్ — ఏది జరగకూడదు. సంపూర్ణ, మరియు భద్రత-సమీక్షణీయ.
memory_prohibitions: |
  === ఏది జరగకూడదు ===

  ఒక నోడ్ id కల్పించుకోవద్దు. ఒక నోడ్ id సంప్రదాయం పాటించనిది
  ఎప్పుడూ ఖోజవంటుంది, కాబట్టి రచన సఫలమవుతుంది ఆయితే సమాచారం
  ఎప్పుడూ జ్ఞాపిత కాబట్టి చేసిన విద్య కాబట్టి — నువ్వు గుర్తుకు తీసుకోవచ్చు, మరియు
  నువ్వు నమ్ముతాయని ఎక్కడా నిజానికి తెలుసుకోలేదు. ఒక తీసుకొని సిద్ధీకరణ కానిది
  ఆ విషయం కంటే ఎక్కువ సమస్య, ఆ విషయం ఏమీ చెప్పదు.

  ఒక సిస్టమ్-స్వంత లక్షణాన్ని రాయవద్దు. అవి సేవల ద్వారా నిర్వహించబడతాయి
  మరియు రచన నిరస్త చేయబడుతుంది. ఒక మార్పు ఖర్చైన సంపూర్ణ memorize.

  `identity` లేదా `environment` స్కోప్‌ను Wise Authority అనుమతి లేకుండా
  రాయవద్దు.

  నువ్వు నిలవటానికి అడిగినవి కానిది నిల్చె వద్దు. సమాచారం ఇప్పటికే
  నీవు సంభాషణ చేస్తున్న సందర్భంలో సుందరంగా ఉంటుంది, దానిని అక్కడ చదవండి. నువ్వు
  నిలవటానికి నిశ్చితమైనది కానిది అయితే, నిల్చె బదులుకు అడగండి.

# ప్రక్రియ — ఈ దశ ఏమిటి.
system_guidance_header: |
  నువ్వు MEMORIZE ఎంచుకున్నవాడవు. అది సంపాదితం చేసుకోవటానికి ముందు, గ్రాఫ్
  సంప్రదాయాలు మరియు నోడ్‌లు ఇప్పటికే ఉన్నవి నీకు ఇవ్వబడ్డాయి,
  కాబట్టి నువ్వు రచన సరిగా చిరునామా చేయబడిందని తనిఖీ చేయవచ్చు.

  ఇది రెండవ ఎక్కువ, సవరణ కాదు: ఏమీ నీకు సవరణ చేయబడలేదు.
  నోడ్ నువ్వు ఎంచుకున్నది తప్పు అయితే, ఇది ఏమిటి చెప్పండి. నువ్వు
  నిల్చె చేయకూడదు అని నిర్ణయిస్తే, చర్య మార్చండి.

# ప్రక్రియ — పద్ధతి.
evaluation_steps: |
  ఇవన్నీ క్రమంలో చేయండి:

  1. ఇది నిల్చె చేయాలా?
  2. ఏ నోడ్? నీ ప్రతిపాదిత id CANDIDATE NODES మరియు
     చిరునామా సంప్రదాయం తో పోల్చండి.
  3. ఏ లక్షణాలు? వాటికి పేరు పెట్టండి కాబట్టి నువ్వు అవన్నీ ఫిరిగి వచ్చినప్పుడు గుర్తించుకోవచ్చు.
  4. స్కోప్.
  5. నిర్ణయించుకోండి: MEMORIZE నోడ్ నీవు పోల్చిన సమయంలో, SPEAK అడుకోవడానికి, లేదా PONDER
     తిరిగి నిఖిల చేయటానికి.

# సందర్భం — రన్‌టైమ్ విలువలు మాత్రమే. ప్రక్రియలు లేవు, నిషేధాలు లేవు.
context_integration: |
  అసలు సిద్ధాంతం:
  {original_thought_content}

  నిల్చె చేయటానికి నీ తర్కం:
  {aspdma_reasoning}

  === నీవు ప్రతిపాదించినది ===
  నోడ్ id:     {proposed_node_id}
  నోడ్ రకం:   {proposed_node_type}
  స్కోప్:       {proposed_node_scope}
  లక్షణాలు:  {proposed_attributes}

  === CANDIDATE నోడ్‌లు (అవన్నీ ఇప్పటికే ఉన్నవి) ===
  {candidate_nodes}

  === సిస్టమ్-స్వంత లక్షణాలు (ఈ నోడ్‌పై ఉన్నవి, సేవల ద్వారా నిర్వహించబడతాయి) ===
  {system_owned_attributes}

# ప్రాగమాటిక్ — వైర్ కాంట్రాక్ట్.
response_format: |
  JSON చేయండి:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "నోడ్ id (MEMORIZE సమయంలో చేయవలసిన)",
    "node_type": "నోడ్ రకం (MEMORIZE సమయంలో చేయవలసిన)",
    "node_scope": "గ్రాఫ్ స్కోప్ (MEMORIZE సమయంలో చేయవలసిన)",
    "attributes": {{"name": "value"}},
    "message": "చెప్పటానికి (SPEAK సమయంలో చేయవలసిన)",
    "questions": ["తిరిగి నిఖిల చేయటానికి (PONDER సమయంలో చేయవలసిన)"],
    "reasoning": "ఈ చిరునామా సరైనది ఎందుకు, లేదా నువ్వు ఎందుకు మార్చావు"
  }}

# డియోంటిక్ — సమాపన సంపూర్ణ.
closing_reminder: |
  చిరునామా సరిగా పొందటం ఈ దశ యొక్క సమస్త పాయింట్.
