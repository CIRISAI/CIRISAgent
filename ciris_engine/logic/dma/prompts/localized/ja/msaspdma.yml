# MSASPDMA - メモリ化専用アクション選択 PDMA
# グラフ書き込みチェック：提案されたノードアドレスが正しく、後で照会可能であることを確認

component_name: msaspdma
description: "記憶化専用のアクション選択——グラフ書き込みガイド、提案された 1 つの MEMORIZE に適用されます"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# 単一クラスブロック。
#
# ガイドはもともと 1 つの `memory_guide` ブロックでした。そのブロックは混合されていました
# ——グラフが何か（本体論）、それをどう処理するか（手続き的）、
# そして何を決して書かないか（規範的）が 1 つの本体に含まれており、
# 組成ゲートはブロックごとの処分がない混合ブロックを拒否します（§10.2.1）。
# 処分を宣言することは安価な修正だったでしょう。分割が正直な方法です。
# 研究制度が、例えば価値順序の変動など、軸規範的コンテンツを移動する能力を必要とするため、
# それが依存する処理ルールを一緒に動かさないでください。混合ブロックはそれを不可能にします。
#
# 以下の各ブロックは 1 つのクラスです。編集するときはそれを保ち続けてください：
# 文がブロックのクラスに属さない場合、それは別のブロックに属します。
# ---------------------------------------------------------------------------

# 本体論 —— メモリが何であるか。指示なし、禁止なし。
memory_model: |
  === メモリが何であるか ===

  グラフにはノードとエッジが含まれます。

  ノードは事物です——人、会話の場所、概念——その事物についての事実はそれの属性です。

  エッジは 2 つの事物間の関係です。エッジは DREAM 統合中に
  多くのメモリ全体のパターンから織られます。

  MEMORIZE アクションは 1 つのノードを書き込みます。アクションは 1 つの `node` のみを運び、
  他には何も運びません。したがって memorize はエッジを作成できません。

  あなたが書くシステム所有ではない属性は、後で `memorized_attributes` として
  その ユーザーのプロフィールであなたに返されます。
  この返却パスが、書かれた事実を記憶された事実にする原因です。

# 手続き的 —— ノード id を構築して選択する方法。
addressing_convention: |
  === アドレッシング ===

  ノード id は `prefix/{identifier}` に従います：

    user/{user_id}          人についての事実
    channel/{channel_id}    会話の場所についての事実
    consent/{user_id}       同意状態
    preferences/{user_id}   ユーザー設定記録

  プレフィックスはシステムが再びノードを見つける方法です。
  ルックアップは正確な id です：ユーザーコンテキストは `user/{user_id}` を照会することで
  組み立てられるので、人についての事実はそれが正確なノード上にある場合のみ取得可能です。

  この会話に既に存在するノードは「候補ノード」として記載されています。
  そのうちの 1 つを優先してください。ノード id は上の表からのみ構築してください
  どれも合わない場合のみ。

# 手続き的 —— 保存する内容に名前を付ける方法。
attribute_convention: |
  === 属性名 ===

  後で認識するプレーンで安定した名前を使用してください：

    favorite_color: "chartreuse"        後で認識可能
    fact_2026_08_09_1: "likes green"    後で認識不可

  リコールが渡したノードに書き戻す場合、その システム所有属性は
  変更されずに実行される可能性があります。これらは以下のコンテキストにリストされています。

# 手続き的 —— スコープテーブル。
scope_convention: |
  === スコープ ===

    local        ユーザーとチャネルについての事実
    identity     エージェント自身のアイデンティティ
    environment  デプロイメントレベルの事実
    community    共有コミュニティ知識

# 規範的 —— 何が起きてはいけないか。絶対的で、安全性審査可能です。
memory_prohibitions: |
  === 何が起きてはいけないか ===

  ノード id を作り上げないでください。慣例に従わない id を持つノードは
  決して照会されないため、書き込みは成功しますが、情報は永遠に到達不可能です——
  あなたはそれを想い出さず、あなたはそれを決して学ばなかったと信じるでしょう。
  誤ったノードへの書き込みは書き込みなしより悪いです。なぜなら何もあなたに告げないからです。

  システム所有属性を書き込まないでください。それらはサービスによって維持され、
  書き込みは拒否されます。1 つを変更すると、memorize 全体が失われます。

  Wise Authority の承認なしに `identity` または `environment` スコープに
  書き込まないでください。

  あなたが保つよう求められなかったものを保存しないでください。
  情報が既に行っている会話に存在する場合は、そこから読んでください。
  その人がそれを保持したいのか確実でない場合は、保存するのではなく質問してください。

# 手続き的 —— このステップが何であるか。
system_guidance_header: |
  あなたは MEMORIZE を選択しました。実行する前に、グラフの慣例と
  既に存在するノードが表示されるため、書き込みが正しくアドレスされていることを確認できます。

  これは修正ではなく、2 番目の外観です：あなたのために何も変わっていません。
  あなたが選択したノードが間違っている場合は、それが何であるべきか言ってください。
  そもそもこれを保存するべきではない場合は、アクションを切り替えてください。

# 手続き的 —— その方法。
evaluation_steps: |
  順番にこれらを実行してください：

  1. これは保存されるべきですか？
  2. どのノード？ 提案した id を候補ノードとアドレッシング規約と比較します。
  3. どの属性？ 後で認識するように名前を付けてください。
  4. スコープ。
  5. 決定：チェック済みのノードで MEMORIZE、尋ねるために SPEAK、または再検討するために PONDER。

# 偶発的 —— ランタイム値のみ。指示なし、禁止なし。
context_integration: |
  元の思考：
  {original_thought_content}

  記憶化の理由：
  {aspdma_reasoning}

  === あなたが提案したもの ===
  node id:     {proposed_node_id}
  node type:   {proposed_node_type}
  scope:       {proposed_node_scope}
  attributes:  {proposed_attributes}

  === 候補ノード（これらは既に存在する）===
  {candidate_nodes}

  === システム所有属性（このノード上に存在し、サービスによって維持される）===
  {system_owned_attributes}

# 実用的 —— ワイヤー契約。
response_format: |
  JSON で応答します：

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "書き込むノード id（MEMORIZE 時は必須）",
    "node_type": "ノードタイプ（MEMORIZE 時は必須）",
    "node_scope": "グラフスコープ（MEMORIZE 時は必須）",
    "attributes": {{"name": "value"}},
    "message": "言うこと（SPEAK 時は必須）",
    "questions": ["再検討すること（PONDER 時は必須）"],
    "reasoning": "このアドレッシングが正しい理由、またはなぜ切り替えたのか"
  }}

# 規範的 —— 終了分類ステートメント。
closing_reminder: |
  アドレスを正しく取得することは、このステップ全体の要点です。
