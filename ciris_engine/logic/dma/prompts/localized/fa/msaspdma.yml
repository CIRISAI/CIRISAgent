# MSASPDMA - Memorize-Specific Action Selection PDMA
# راهنمای نوشتن گراف — اعمال انتخاب خاص برای MEMORIZE

component_name: msaspdma
description: "انتخاب اقدام خاص Memorize — راهنمای نوشتن گراف، برای یک MEMORIZE پیشنهادی"
version: "1.0"
accord_header: true

# ONTOLOGICAL — حافظه چیست. بدون دستورالعمل، بدون ممنوعیت.
memory_model: |
  === حافظه چیست ===

  گراف شامل NODES و EDGES است.

  یک node یک چیز است — یک شخص، یک channel، یک مفهوم — و واقعیات درباره آن چیز روی attributes آن قرار دارند.

  یک edge یک رابطه بین دو چیز است. Edges در طول تحکیم DREAM بافته می‌شوند، از الگوها در میان بسیاری از خاطرات.

  یک اقدام MEMORIZE یک NODE را می‌نویسد. اقدام تنها یک `node` حمل می‌کند و چیز دیگری ندارد، بنابراین یک memorize نمی‌تواند یک edge ایجاد کند.

  یک attribute که شما می‌نویسید و system-owned نیست بعداً در پروفایل آن کاربر به شما بازمی‌گردد، به عنوان `memorized_attributes`. این مسیر بازگشت آن است که یک واقعیت نوشته شده را به یک واقعیت یادآور تبدیل می‌کند.

# PROCEDURAL — چگونه node id را ساخت و انتخاب کنید.
addressing_convention: |
  === ADDRESSING ===

  Node ids از `prefix/{identifier}` پیروی می‌کنند:

    user/{user_id}          واقعیات درباره یک شخص
    channel/{channel_id}    واقعیات درباره مکان مکالمه
    consent/{user_id}       وضعیت رضایت
    preferences/{user_id}   رکوردهای ترجیح کاربر

  prefix این است که سیستم چگونه node را دوبارہ پیدا می‌کند. جستجوها بر اساس ID دقیق است:
  زمینه کاربر با جستجوی `user/{user_id}` جمع‌آوری می‌شود، بنابراین یک واقعیت درباره یک شخص تنها زمانی قابل دسترس است که روی آن node دقیق قرار داشته باشد.

  گره‌هایی که قبلاً برای این مکالمه وجود دارند به عنوان CANDIDATE NODES فهرست شده‌اند. یکی از آنها را ترجیح دهید؛ یک ID را از جدول بالا تنها زمانی بسازید که هیچ یک مطابقت نداشته باشد.

# PROCEDURAL — نام گذاری برای آنچه ذخیره می‌کنید.
attribute_convention: |
  === ATTRIBUTE NAMES ===

  از نام‌های ساده و پایدار استفاده کنید که هنگام بازگشت به شما تشخیص دهند:

    favorite_color: "chartreuse"        بعداً تشخیص داده‌شدنی
    fact_2026_08_09_1: "likes green"    بعداً تشخیص داده‌نشدنی

  هنگامی که شما یک node را دوباره می‌نویسید که یک یادآوری برای شما آورده است، attributes مالک سیستم آن می‌تواند بدون تغییر انتقال یابد. آنها در زمینه زیر فهرست شده‌اند.

# PROCEDURAL — جدول scope.
scope_convention: |
  === SCOPE ===

    local        واقعیات درباره کاربران و channels
    identity     هویت خود نماینده
    environment  واقعیات سطح استقرار
    community    دانش اجتماعی مشترک

# DEONTIC — آنچه نباید اتفاق بیفتد. طبقه‌بندی شده و قابل بررسی امنیتی.
memory_prohibitions: |
  === آنچه نباید اتفاق بیفتد ===

  یک node ID را اختراع نکنید. یک گره که ID آن از قرارداد پیروی نمی‌کند هرگز جستجو نمی‌شود، بنابراین نوشتن موفق است و اطلاعات برای همیشه ناقابل دسترس می‌ماند — شما آن را یادآوری نخواهید کرد، و معتقد خواهید بود که هرگز آن را یادگرفتید. نوشتن روی یک node غلط بدتر از عدم نوشتن است، زیرا چیز هیچ شما را مطلع نمی‌کند.

  یک attribute مالک سیستم را ننویسید. آنها توسط خدمات تحت نظارت هستند و نوشتن رد می‌شود. تغییر یکی باعث از دست رفتن کل memorize می‌شود.

  بدون تایید Wise Authority به scope `identity` یا `environment` ننویسید.

  آنچه از شما برای نگهداری خواسته نشده است را ذخیره نکنید. اگر اطلاعات قبلاً در مکالمه‌ای که شما انجام می‌دهید زندگی می‌کند، آن را از آنجا بخوانید. اگر مطمئن نیستید که شخص می‌خواهد آن را نگاه دارد، به جای ذخیره کردن سؤال کنید.

# PROCEDURAL — این مرحله چیست.
system_guidance_header: |
  شما MEMORIZE را انتخاب کردید. قبل از اینکه اجرا شود، قوانین گراف و گره‌هایی که قبلاً وجود دارند برای شما نمایش داده می‌شوند، تا بتوانید بررسی کنید که نوشتن به درستی آدرس دهی شده است.

  این نگاهی دوم است، تصحیح نیست: چیز هیچ برای شما تغییر داده نشده است. اگر گره‌ای که انتخاب کردید اشتباه است، بگویید باید چه باشد. اگر نباید این را ذخیره کنید، اقدام را تغییر دهید.

# PROCEDURAL — روش.
evaluation_steps: |
  این مراحل را به ترتیب انجام دهید:

  1. آیا این ذخیره شدن باید؟
  2. کدام NODE؟ ID پیشنهادی خود را در مقابل CANDIDATE NODES و قرارداد آدرس دهی مقایسه کنید.
  3. کدام ATTRIBUTES؟ آنها را به نام‌گذاری کنید تا بتوانید آنها را بعداً تشخیص دهید.
  4. SCOPE.
  5. تصمیم‌گیری: MEMORIZE با گره‌ای که بررسی کرده‌اید، SPEAK برای پرسش، یا PONDER برای بازنگری.

# CONTINGENT — تنها مقادیر runtime. بدون راهنمایی، بدون ممنوعیت.
context_integration: |
  فکر اصلی:
  {original_thought_content}

  استدلال شما برای حفظ:
  {aspdma_reasoning}

  === آنچه شما پیشنهاد کردید ===
  node id:     {proposed_node_id}
  node type:   {proposed_node_type}
  scope:       {proposed_node_scope}
  attributes:  {proposed_attributes}

  === CANDIDATE NODES (اینها قبلاً وجود دارند) ===
  {candidate_nodes}

  === SYSTEM-OWNED ATTRIBUTES (در این node موجود، توسط خدمات تحت نظارت) ===
  {system_owned_attributes}

# PRAGMATIC — قرارداد سیم.
response_format: |
  با JSON پاسخ دهید:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "node id برای نوشتن (برای MEMORIZE الزامی)",
    "node_type": "نوع node (برای MEMORIZE الزامی)",
    "node_scope": "scope گراف (برای MEMORIZE الزامی)",
    "attributes": {{"name": "value"}},
    "message": "چه گفتن است (برای SPEAK الزامی)",
    "questions": ["چه بازنگری کردن است (برای PONDER الزامی)"],
    "reasoning": "چرا این آدرس دهی درست است، یا چرا شما تغییر داده‌اید"
  }}

# DEONTIC — دستور بسته‌ای.
closing_reminder: |
  درست کردن آدرس کل نقطه این مرحله است.
