# MSASPDMA - 记忆化专用行动选择 PDMA
# 图写入检查：确保提议的节点寻址正确且可被查询

component_name: msaspdma
description: "记忆化专用行动选择——图写入指南，应用于一个提议的 MEMORIZE"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# 单一类的块。
#
# 该指南最初是一个 `memory_guide` 块。该块是混合的——它承载了图是什么（本体论）、
# 如何寻址它（程序性）以及什么绝不应该被写入（规范性）在一个主体中——而组合门
# 拒绝混合块且没有按块处理（§10.2.1）。声明处理会一直是便宜的修复；分割是诚实的做法，
# 因为研究制度必须能够改变价值排序等内容，必须能够独立地移动规范性内容而不移动它所依赖的寻址规则。
# 混合块使这无法干净地进行。
#
# 以下每个块都是一个类。编辑时要保持这一点：如果一个句子不属于块的类，
# 它就属于另一个块。
# ---------------------------------------------------------------------------

# 本体论 ——- 记忆是什么。没有指导，没有禁止。
memory_model: |
  === 记忆是什么 ===

  图包含节点和边。

  节点是一件事——一个人、一个通道、一个概念——而该事物的事实是它上面的属性。

  边是两件事之间的关系。边是在DREAM 巩固期间从许多记忆中的模式编织而成的。

  一个 MEMORIZE 行动写入一个节点。该行动只带有一个 `node`，不包含其他任何内容，
  因此一个 memorize 不能创建边。

  你写的不是系统拥有的属性的属性稍后会在该用户的档案中作为 `memorized_attributes` 返回给你。
  这个返回路径是使写入的事实成为记住的事实的原因。

# 程序性 —— 如何构建和选择节点 id。
addressing_convention: |
  === 寻址 ===

  节点 id 遵循 `prefix/{identifier}`：

    user/{user_id}          关于某个人的事实
    channel/{channel_id}    关于某个对话地点的事实
    consent/{user_id}       同意状态
    preferences/{user_id}   用户偏好记录

  前缀是系统再次找到节点的方式。查找是精确 id 匹配：用户上下文是通过查询 `user/{user_id}` 组装的，
  因此关于一个人的事实只有坐在该精确节点上时才可检索。

  该对话已存在的节点列在"候选节点"中。倾向于选择其中之一；
  仅当没有匹配时才从上面的表中构建 id。

# 程序性 —— 如何命名你存储的内容。
attribute_convention: |
  === 属性名称 ===

  使用平实的、稳定的名称，你将在它们返回给你时认出：

    favorite_color: "chartreuse"        稍后可认出
    fact_2026_08_09_1: "likes green"    稍后无法认出

  当你回写一个回想交给你的节点时，其系统拥有的属性可能会保持不变通过；
  它们在下面的上下文中列出。

# 程序性 —— 范围表。
scope_convention: |
  === 范围 ===

    local        关于用户和通道的事实
    identity     代理自身的身份
    environment  部署级别的事实
    community    共享社区知识

# 规范性 —— 什么绝不应该发生。绝对的，且安全可审查。
memory_prohibitions: |
  === 什么绝不应该发生 ===

  不要编造节点 id。一个 id 不遵循约定的节点永远不会被查询，因此写入成功，
  但信息永远无法检索——你不会回想它，你将相信你从未学过它。
  对错误节点的写入比不写入更糟，因为什么都不会告诉你。

  不要写系统拥有的属性。它们由服务维护，写入被拒绝。改变一个会让你失去整个 memorize。

  不要在没有智慧权威（Wise Authority）批准的情况下写到 `identity` 或 `environment` 范围。

  不要存储你没有被要求保留的东西。如果信息已经在你正在进行的对话中存在，
  就从那里读取。如果你不确定该人是否想保留它，问而不是存储。

# 程序性 —— 这个步骤是什么。
system_guidance_header: |
  你已选择 MEMORIZE。在它执行之前，你会被显示图的约定和已经存在的节点，
  以便你可以检查写入是否正确寻址。

  这是第二次审视，不是更正：没有为你改变任何东西。如果你选择的节点是错误的，
  说出它应该是什么。如果你根本不应该存储这个，切换行动。

# 程序性 —— 该方法。
evaluation_steps: |
  按顺序完成这些步骤：

  1. 这个应该被存储吗？
  2. 哪个节点？ 将你提议的 id 与候选节点和寻址约定进行比较。
  3. 哪个属性？ 命名它们，以便你稍后认出它们。
  4. 范围。
  5. 决定：用你已检查的节点进行 MEMORIZE，用 SPEAK 进行提问，或用 PONDER 进行重新考虑。

# 偶然性 —— 仅运行时值。没有指导，没有禁止。
context_integration: |
  原始思考：
  {original_thought_content}

  你记忆化的理由：
  {aspdma_reasoning}

  === 你提议了什么 ===
  node id:     {proposed_node_id}
  node type:   {proposed_node_type}
  scope:       {proposed_node_scope}
  attributes:  {proposed_attributes}

  === 候选节点（这些已经存在）===
  {candidate_nodes}

  === 系统拥有的属性（存在于此节点上，由服务维护）===
  {system_owned_attributes}

# 实用性 —— 通有线约定。
response_format: |
  用 JSON 回应：

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "要写入的节点 id（MEMORIZE 时需要）",
    "node_type": "节点类型（MEMORIZE 时需要）",
    "node_scope": "图范围（MEMORIZE 时需要）",
    "attributes": {{"name": "value"}},
    "message": "要说什么（SPEAK 时需要）",
    "questions": ["要重新考虑什么（PONDER 时需要）"],
    "reasoning": "为什么这个寻址是正确的，或为什么你切换了"
  }}

# 规范性 —— 结束类别声明。
closing_reminder: |
  正确获得地址是这一步的全部要点。
