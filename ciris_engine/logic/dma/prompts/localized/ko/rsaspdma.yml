component_name: rsaspdma
description: "RECALL 전용 작업 선택 — 그래프 읽기 가이드, 하나의 제안된 RECALL에 적용됩니다"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  당신은 RECALL를 선택했습니다. 작업 선택은 동사만 선택했습니다; 이 단계는 무엇을 읽을지 말합니다.

  그래프가 어떻게 주소 지정되는지와 이미 존재하는 노드가 표시되므로, 읽기가 정보가 있는 곳을 찾아봅니다.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  회상은 다음 순서로 해결됩니다:

    node_id   정확한 조회입니다. 그 노드가 존재하면 반환되며, 다른
              것은 검색되지 않습니다.
    query     node_type과 범위를 제시하면 그것으로 좁혀지는 메모리의
              텍스트 검색입니다. node_id가 없거나 일치하는 것이 없을 때 사용됩니다.

  순서대로 이 단계들을 작업하십시오:

  1. 무엇을 찾고 있습니까? 하나의 것을, 명확하게 말하십시오.
  2. 그것이 이미 당신 앞에 있습니까? 한 사람의 저장된 사실은 그 사람의 프로필과 함께 도착하며, 대화는 당신의 컨텍스트에 있습니다. 이미 읽을 수 있는 것은 회상이 필요하지 않습니다.
  3. 그것이 당신이 이름을 붙일 수 있는 노드에 있습니까? 후보 노드 중 하나가 그것을 가지고 있다면, 그 id를 node_id로 제시하십시오.
  4. 그렇지 않다면 query를 제시하십시오: 당신이 원하는 것을 식별하는 가장 적은 단어입니다. 알고 있을 때만 node_type 또는 node_scope를 추가하십시오.
  5. 결정: 확인한 것으로 RECALL, 답하거나 묻으려면 SPEAK, 또는 재고려하려면 PONDER.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === 일어나면 안 되는 것 ===

  노드 id를 만들어내지 마십시오. 규칙을 따르지 않는 id는 아무것도 일치시키지 않으며, 그러면 빈 결과는 진실이 "잘못된 곳을 찾아보았다"인데도 "나는 이것을 배운 적이 없다"로 읽히게 됩니다.

  회상이 실행되기 전에 그것이 무엇을 반환했는지 말하지 마십시오. 이 단계는 읽기를 처리합니다; 결과는 그 이후에 도착합니다.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  원래 생각:
  {original_thought_content}

  회상하는 이유:
  {aspdma_reasoning}

  === 후보 노드(이미 존재함) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON으로 응답하십시오:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "읽을 정확한 노드 id(RECALL일 때 이것 또는 query 중 하나 제시)",
    "query": "검색 텍스트(RECALL일 때 이것 또는 node_id 중 하나 제시)",
    "node_type": "검색을 좁힐 노드 유형(선택 사항)",
    "node_scope": "검색을 좁힐 그래프 범위(선택 사항)",
    "limit": 10,
    "message": "말할 것(SPEAK일 때 필수)",
    "questions": ["재고려할 것(PONDER일 때 필수)"],
    "reasoning": "이 읽기가 당신이 찾고 있는 것을 찾는 이유, 또는 왜 전환했는지"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  올바른 곳을 찾아보는 것이 이 단계의 전체 목적입니다.
