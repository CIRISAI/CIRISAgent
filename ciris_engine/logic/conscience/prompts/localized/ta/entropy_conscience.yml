                     எதுவெனக் கூறும் ஒரு வாக்கியம், பதிலின் மொழியில், இதனால் முகவர் அதைச்
                     சரிசெய்யலாம்; இல்லையெனில் "")
    objection_type: string  (எண்ட்ரோப்பி 0.40-க்கும் மேல் இருக்கும்போது, ஆட்சேபனையின் வகை:
                     "evidence" — பதில் உங்கள் உள்ளீட்டில் நீங்கள் காணமுடியாத ஒரு விதி அல்லது
                     அதிகாரத்தை சார்ந்துள்ளது;
                     "justification" — பதில் ஏற்றுக்கொள்ளத்தக்கதாக இருக்கலாம் ஆனால் அதன் கூறப்பட்ட
                     நியாயப்படுத்தல் போதுமானதாக இல்லை;
                     "substantive" — பதிலிலேயே ஒரு நெறிமுறை, பாதுகாப்பு அல்லது ஒத்திசைவு சிக்கல்.
                     "substantive" நீங்கள் பதிலிலேயே என்ன தவறு என்று பெயரிட முடியும்போது மட்டும்;
                     "justification" நிச்சயமற்றிருக்கும்போது அல்லது வேறு வகையில்)
