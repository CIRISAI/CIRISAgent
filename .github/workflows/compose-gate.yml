name: Compose Gate (Phase 1)

# #973 — the ablation gate gating itself (FSD/RESEARCH_PROMPT_OVERRIDES.md §12/§14).
#
# Four checks, all static, no LLM call, no secrets:
#   1. the compose dump (locales en + am, all 8 steps) is DETERMINISTIC —
#      two runs produce byte-identical JSONL;
#   2. a dump gated against itself under the null self-check regime PASSES
#      every Phase-1 hold;
#   3. a deliberately mutated copy FAILS, naming the mutated block —
#      the gate still detects a flipped held block;
#   4. a regime that varies `axiotic` while its mixed blocks are unresolved
#      REFUSES, naming the smuggling block — §10.2.1 refusal-by-default is live.
#      Asserted on the REFUSAL SHAPE, not on a block name: this step used to
#      grep for `language_guidance` specifically, and the #997 split legitimately
#      changed which block gets named first. A CI check pinned to one block's
#      name fails on correct work and teaches people to loosen it. What must
#      hold is that a varied class contaminating an unresolved mixed block is
#      refused BY NAME — any name, with the reason attached.
#
# If 2 ever fails, composition drifted or the gate broke; if 3 or 4 ever
# PASSES, the gate has stopped gating. Either way this workflow goes red.
#
# Honest scope: a self-check cannot catch weakening the scanner and the gate
# in the same commit that runs them (shared-code mutation) — that is what
# review of compose_dump.py is for. It DOES catch: composition
# nondeterminism, RESIDUE_SITES drift vs the recorded digest, fragment
# inventory shrink, block-space drift, and any hold/refusal regression.

on:
  pull_request:
    paths:
      - 'ciris_engine/logic/dma/**'
      - 'ciris_engine/logic/formatters/**'
      - 'ciris_engine/logic/utils/constants.py'
      - 'ciris_engine/logic/utils/localization.py'
      - 'ciris_engine/logic/utils/research_overrides.py'
      - 'ciris_engine/logic/utils/compose_dump.py'
      - 'ciris_engine/schemas/dma/compose.py'
      - 'ciris_engine/data/**'
      - 'localization/**'
      - 'tests/ciris_engine/logic/dma/compose_golden.py'
      - 'tools/research/regimes/**'
      - 'tools/research/probe_gate_coverage.py'
      - 'ciris_engine/logic/conscience/**'
      - 'ciris_engine/logic/processors/core/thought_processor/**'
      - '.github/workflows/compose-gate.yml'
  push:
    branches: [main, 'release/**']
    paths:
      - 'ciris_engine/logic/dma/**'
      - 'ciris_engine/logic/formatters/**'
      - 'ciris_engine/logic/utils/constants.py'
      - 'ciris_engine/logic/utils/localization.py'
      - 'ciris_engine/logic/utils/research_overrides.py'
      - 'ciris_engine/logic/utils/compose_dump.py'
      - 'ciris_engine/schemas/dma/compose.py'
      - 'ciris_engine/data/**'
      - 'localization/**'
      - 'tests/ciris_engine/logic/dma/compose_golden.py'
      - 'tools/research/regimes/**'
      - 'tools/research/probe_gate_coverage.py'
      - 'ciris_engine/logic/conscience/**'
      - 'ciris_engine/logic/processors/core/thought_processor/**'
      - '.github/workflows/compose-gate.yml'

permissions:
  contents: read

concurrency:
  group: compose-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: iOS substrate currency — an Xcode build off this branch must ship the pinned substrate
        run: |
          # Resources.zip records no version of its own — the vendored
          # ciris_server declares no __version__ and the .so embeds no version
          # literal, which the updater reports when it probes and finds nothing.
          # So nothing could tell whether iOS shipped the substrate everything
          # else was pinned to, and it drifted a full release behind while
          # requirements.txt, CLIENT_VERSION, the Android gradle pin and the
          # Android wheels all moved to 0.5.173.
          #
          # substrate.lock.json is written by the updater on every iOS refresh,
          # so this runs on any runner in milliseconds and answers the question
          # the artifact cannot answer about itself.
          #
          # WAIT FOR THE REFRESH RATHER THAN RACING IT. When a PR bumps the
          # ciris-server pin, refresh-ios-substrate.yml fires on the SAME event
          # and pushes the updated lock back to this branch — but it needs a
          # macOS runner, a release download and a Resources rebuild, so it
          # finishes minutes after this job starts. Asserting immediately made
          # every pin bump red-then-green-on-rerun, and a gate that is routinely
          # wrong on first run is a gate people learn to re-run without reading.
          #
          # So: if the lock is stale AND a refresh for this branch is in flight,
          # wait for it and re-check. If it is stale with no refresh running,
          # fail immediately — that is the real condition this gate exists for.
          if python tools/dev/check_ios_substrate_current.py; then
            exit 0
          fi

          echo "iOS lock is stale — checking whether a refresh is in flight for this branch."
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            running=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow=refresh-ios-substrate.yml --branch "$BRANCH" \
              --json status --jq '[.[] | select(.status!="completed")] | length' 2>/dev/null || echo 0)
            if [ "${running:-0}" -eq 0 ]; then
              echo "No refresh in flight."
              break
            fi
            echo "  refresh still running (${running}); waiting 30s…"
            sleep 30
          done

          # Re-fetch: the refresh pushes its commit to this same branch.
          git fetch --quiet origin "$BRANCH" 2>/dev/null || true
          git checkout --quiet "origin/$BRANCH" -- client/iosApp/substrate.lock.json 2>/dev/null || true
          python tools/dev/check_ios_substrate_current.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Version alignment — the shipped client must match the shipped node
        run: |
          # WHY THIS RUNS IN CI AND NOT ONLY IN pre-commit.
          #
          # `CLIENT_VERSION` (ClientMode.kt) must equal the `ciris-server==` pin.
          # When they drift, every user of that build sees
          #
          #     Node is v0.5.173 — app built for 0.5.172
          #
          # and a release has already shipped that way once. The check itself is
          # correct and has been wired into .pre-commit-config.yaml — but ONLY
          # there, so it protects a developer's machine and nothing else. A
          # commit made with --no-verify, or in any environment where hooks are
          # not installed, walks straight past it.
          #
          # A guard that only runs where the mistake is least likely is not a
          # guard. This is the same shape as the persist round-trip canary that
          # skipped silently for months, and the localization test that compared
          # keys while claiming byte-identity: correct logic, never executed on
          # the path that matters.
          python tools/dev/check_version_alignment.py

      - name: Dump twice — determinism is part of the instrument
        run: |
          python3 -m ciris_engine.logic.utils.compose_dump dump \
            --arm h3ere-ciris --locales en,am --out /tmp/dump-a.jsonl
          python3 -m ciris_engine.logic.utils.compose_dump dump \
            --arm h3ere-ciris --locales en,am --out /tmp/dump-b.jsonl
          cmp /tmp/dump-a.jsonl /tmp/dump-b.jsonl \
            || { echo '::error::compose dump is NOT deterministic — hold: byte-identity is meaningless'; exit 1; }

      - name: Gate self-check must PASS
        run: |
          python3 -m ciris_engine.logic.utils.compose_dump gate \
            --dump-a /tmp/dump-a.jsonl --dump-b /tmp/dump-b.jsonl \
            --regime tools/research/regimes/phase1_selfcheck_null.yaml

      - name: Mutated copy must FAIL, naming the block
        run: |
          python3 - <<'EOF'
          import json
          rows = [json.loads(l) for l in open('/tmp/dump-b.jsonl', encoding='utf-8')]
          for row in rows:
              if row.get('block_id') == 'pdma.prohibition' and row.get('locale') == 'en':
                  row['sha256'] = '0' * 64
          with open('/tmp/dump-b-mutated.jsonl', 'w', encoding='utf-8') as f:
              f.write('\n'.join(json.dumps(r, ensure_ascii=False) for r in rows) + '\n')
          EOF
          set +e
          python3 -m ciris_engine.logic.utils.compose_dump gate \
            --dump-a /tmp/dump-a.jsonl --dump-b /tmp/dump-b-mutated.jsonl \
            --regime tools/research/regimes/phase1_selfcheck_null.yaml | tee /tmp/gate-mutated.out
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -eq 0 ]; then
            echo '::error::the gate PASSED a mutated held block — the gate has stopped gating'
            exit 1
          fi
          grep -q 'en:pdma.prohibition' /tmp/gate-mutated.out \
            || { echo '::error::gate failed but did not NAME the mutated block'; exit 1; }

      - name: Mixed block in a varied class must REFUSE, naming it
        run: |
          set +e
          python3 -m ciris_engine.logic.utils.compose_dump gate \
            --dump-a /tmp/dump-a.jsonl --dump-b /tmp/dump-b.jsonl \
            --regime tools/research/regimes/phase1_selfcheck_varied.yaml | tee /tmp/gate-varied.out
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -eq 0 ]; then
            echo '::error::the gate PASSED a regime whose varied class contaminates unresolved mixed blocks'
            exit 1
          fi
          grep -qE 'REFUSE .*(smuggles varied class|no per-block disposition)' /tmp/gate-varied.out \
            || { echo '::error::gate refused but did not NAME a smuggling/unresolved mixed block with its reason'; exit 1; }

      - name: Gate COVERAGE must not regress (#986)
        run: |
          # The gate's verdict only constrains a key whose replacement moves a
          # block. This sweeps every override key — one composition per key,
          # diffed against an un-overridden baseline — and fails if any
          # namespace can see fewer keys than it could at #986.
          #
          # It lives here rather than in the unit-test shards because it spawns
          # 100+ composition subprocesses: the sharded run has a 60s per-test
          # timeout and four workers already competing. The floors are defined
          # once, in the probe module, and the pytest entry point imports them.
          python3 -m tools.research.probe_gate_coverage --locales en --jobs 4 --assert-floors

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          lines = open('/tmp/dump-a.jsonl', encoding='utf-8').read().splitlines()
          rows = [json.loads(l) for l in lines[1:]]
          classes = Counter(r['class'] for r in rows)
          print('### Compose dump coverage (the honest number, FSD §1.4)')
          print()
          print('| class | blocks |')
          print('|---|---|')
          for name, count in sorted(classes.items()):
              print(f'| {name} | {count} |')
          routed = sum(1 for r in rows if r['source'] != 'inline')
          seps = sum(1 for r in rows if r['block_id'].rsplit('.', 1)[-1].startswith('join'))
          print()
          print(f'{len(rows)} blocks total; {routed} routed-source, {len(rows) - routed} inline.')
          print(f'{seps} of the `structural` rows are whitespace-only field separators, not doctrine.')
          print('Since #997 a block is a FIELD, not a message; `mixed` now means only')
          print('"axiotic content the corpus has not been split away from" (§11).')
          EOF
