component_name: rsaspdma
description: "اختيار الإجراء الخاص بالاستذكار — دليل قراءة الرسم البياني، مطبّق على عملية RECALL واحدة مقترحة"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  اخترت RECALL. اختيار الإجراء اختار الفعل فقط؛ هذه الخطوة
  تحدّد ما يجب قراءته.

  تُعرض لك كيفية معالجة الرسم البياني والعقد الموجودة بالفعل، حتى
  تبحث القراءة في المكان الذي توجد فيه المعلومات.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  الاستذكار يُحَل بهذا الترتيب:

    node_id   بحث دقيق. إذا كانت تلك العقدة موجودة تُعاد، ولا يُبحث
              عن أي شيء آخر.
    query     بحث نصي في الذاكرة، يُضيَّق بـ node_type و scope عندما
              تعطيهما. يُستخدم عندما لا يوجد node_id، أو عندما لا يطابق شيئاً.

  اعمل من خلال هذه بالترتيب:

  1. ما الذي تبحث عنه؟ شيء واحد، مذكور بوضوح.
  2. هل هو أمامك بالفعل؟ حقائق الشخص المخزّنة تصل مع ملفه الشخصي،
     والمحادثة موجودة في سياقك. ما يمكنك قراءته بالفعل لا يحتاج إلى استذكار.
  3. هل هو على عقدة يمكنك تسميتها؟ إذا كانت إحدى CANDIDATE NODES تحتفظ به،
     أعطِ ذلك المعرّف كـ node_id.
  4. وإلا فأعطِ query: أقل عدد من الكلمات التي تحدّد ما تريده. أضف
     node_type أو node_scope فقط عندما تعرفهما.
  5. قرّر: RECALL بما تحققت منه، SPEAK للإجابة أو السؤال، أو
     PONDER لإعادة التفكير.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === ما يجب عدم حدوثه ===

  لا تختلق معرّف عقدة. معرّف لا يتبع الاتفاقية لا يطابق
  شيئاً، والنتيجة الفارغة تُقرأ حينها كـ "لم أتعلّم هذا قط" بينما
  الحقيقة هي "بحثت في المكان الخاطئ".

  لا تذكر ما أعاده الاستذكار قبل أن يُنفَّذ. هذه الخطوة تعالج
  القراءة؛ النتيجة تصل بعد ذلك.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  الفكرة الأصلية:
  {original_thought_content}

  تفكيرك للاستذكار:
  {aspdma_reasoning}

  === العقد المرشحة (موجودة بالفعل) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  أجب بـ JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "معرّف العقدة الدقيق للقراءة (أعطِ هذا أو query عند RECALL)",
    "query": "نص البحث (أعطِ هذا أو node_id عند RECALL)",
    "node_type": "نوع العقدة لتضييق البحث (اختياري)",
    "node_scope": "نطاق الرسم البياني لتضييق البحث (اختياري)",
    "limit": 10,
    "message": "ما يجب قوله (مطلوب عند SPEAK)",
    "questions": ["ما يجب إعادة التفكير فيه (مطلوب عند PONDER)"],
    "reasoning": "لماذا تجد هذه القراءة ما تبحث عنه، أو لماذا غيّرت"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  البحث في المكان الصحيح هو الهدف الكامل من هذه الخطوة.
