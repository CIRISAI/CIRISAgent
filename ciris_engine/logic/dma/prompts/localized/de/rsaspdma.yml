component_name: rsaspdma
description: "Abrufen-spezifische Aktionsauswahl — der graphlesende Leitfaden, angewendet auf ein vorgeschlagenes RECALL"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  Sie haben RECALL ausgewählt. Die Aktionsauswahl hat nur das Verb gewählt; dieser
  Schritt legt fest, was gelesen wird.

  Ihnen wird gezeigt, wie der Graph adressiert wird und welche Knoten bereits
  existieren, damit der Lesevorgang dort sucht, wo sich die Information befindet.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  Ein Abruf löst sich in dieser Reihenfolge auf:

    node_id   eine exakte Suche. Existiert dieser Knoten, wird er zurückgegeben,
              und es wird nichts anderes durchsucht.
    query     eine Textsuche im Gedächtnis, eingegrenzt durch node_type und scope,
              wenn Sie diese angeben. Wird verwendet, wenn es keine node_id gibt
              oder diese nichts gefunden hat.

  Arbeite dich durch diese der Reihe nach:

  1. WAS suchen Sie? Eine Sache, klar benannt.
  2. HABEN SIE ES BEREITS VOR SICH? Die gespeicherten Fakten einer Person kommen
     mit ihrem Profil, und die Konversation ist in Ihrem Kontext. Was Sie bereits
     lesen können, braucht keinen Abruf.
  3. STEHT ES AUF EINEM KNOTEN, DEN SIE BENENNEN KÖNNEN? Wenn einer der
     KANDIDATENKNOTEN es enthält, geben Sie diese Kennung als node_id an.
  4. ANDERNFALLS geben Sie eine query an: die wenigsten Wörter, die das Gewünschte
     identifizieren. Fügen Sie node_type oder node_scope nur hinzu, wenn Sie diese
     kennen.
  5. Entscheiden Sie: RECALL mit dem, was Sie überprüft haben, SPEAK, um zu
     antworten oder zu fragen, oder PONDER, um zu überdenken.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === WAS NICHT PASSIEREN DARF ===

  Erfinden Sie keine Knotenkennzeichnung. Eine Kennung, die nicht der Konvention
  folgt, entspricht nichts, und ein leeres Ergebnis liest sich dann als „Das habe
  ich nie gelernt", obwohl die Wahrheit lautet: „Ich habe am falschen Ort gesucht".

  Geben Sie nicht an, was ein Abruf ergeben hat, bevor er ausgeführt wurde. Dieser
  Schritt adressiert den Lesevorgang; das Ergebnis kommt erst danach.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Ursprünglicher Gedanke:
  {original_thought_content}

  Ihre Begründung zum Abrufen:
  {aspdma_reasoning}

  === KANDIDATENKNOTEN (diese existieren bereits) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  Antworte mit JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "exakte Knotenkennzeichnung zum Lesen (geben Sie diese oder query an, wenn RECALL)",
    "query": "Suchtext (geben Sie diesen oder node_id an, wenn RECALL)",
    "node_type": "Knotentyp zur Eingrenzung einer Suche (optional)",
    "node_scope": "Graph-Umfang zur Eingrenzung einer Suche (optional)",
    "limit": 10,
    "message": "was zu sagen (erforderlich bei SPEAK)",
    "questions": ["was zu überdenken (erforderlich bei PONDER)"],
    "reasoning": "warum dieser Lesevorgang das findet, wonach Sie suchen, oder warum Sie gewechselt haben"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Das Suchen am richtigen Ort ist der ganze Sinn dieses Schritts.
