# MSASPDMA - Memorize-Specific Action Selection PDMA
# Руководство по написанию в граф, применяется к одному предложенному MEMORIZE

component_name: msaspdma
description: "Выбор действия, специфичный для запоминания — руководство по написанию в граф, применяемое к одному предложенному MEMORIZE"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# SINGLE-CLASS BLOCKS.
#
# Исходное руководство было одним блоком `memory_guide`. Этот блок был СМЕШАННЫМ —
# он содержал то, ЧТО представляет собой граф (онтологическое), как его адресовать
# (процедурное) и что никогда не должно быть записано (деонтическое) в одном теле —
# и вентиль compose отказывает в смешанном блоке без указания отношения на блок
# (§10.2.1). Объявление отношения было бы дешёвым исправлением; разделение —
# честное, потому что исследовательский режим, который варьирует, скажем, упорядочение
# значений, должен иметь возможность ПЕРЕМЕСТИТЬ аксиотическое содержимое БЕЗ также
# перемещения правил адресации, которые оно использует. Смешанный блок делает это
# невозможным чистым образом.
#
# Каждый блок ниже — один класс. Держите его в таком состоянии при редактировании:
# если предложение не принадлежит к классу блока, оно принадлежит другому блоку.
# ---------------------------------------------------------------------------

# ONTOLOGICAL — what memory IS. No instructions, no prohibitions.
memory_model: |
  === ЧТО ТАКОЕ ПАМЯТЬ ===

  Граф содержит УЗЛЫ и РЁБРА.

  Узел — это вещь — человек, канал, концепция — и факты об этой вещи — это
  атрибуты на ней.

  Ребро — это отношение между двумя вещами. Рёбра ткутся во время консолидации
  DREAM из паттернов во многих воспоминаниях.

  Действие MEMORIZE записывает ОДИН УЗЕЛ. Действие содержит один `node` и больше
  ничего, поэтому запоминание не может создать ребро.

  Атрибут, который вы записываете и который не принадлежит системе, возвращается
  к вам позже в профиль этого пользователя, как `memorized_attributes`. Этот путь
  возврата — это то, что превращает записанный факт в запомненный.

# PROCEDURAL — how to construct and choose a node id.
addressing_convention: |
  === АДРЕСАЦИЯ ===

  Идентификаторы узлов следуют шаблону `prefix/{identifier}`:

    user/{user_id}          факты о человеке
    channel/{channel_id}    факты о месте разговора
    consent/{user_id}       состояние согласия
    preferences/{user_id}   записи предпочтений пользователя

  Префикс — это способ, которым система снова находит узел. Поиски выполняются
  по точному идентификатору: контекст пользователя собирается путём запроса
  `user/{user_id}`, поэтому факт о человеке доступен только если он находится
  на этом точном узле.

  Узлы, которые уже существуют для этого разговора, перечислены как КАНДИДАТНЫЕ
  УЗЛЫ. Предпочитайте один из них; конструируйте идентификатор из таблицы выше
  только когда ни один не подходит.

# PROCEDURAL — how to name what you store.
attribute_convention: |
  === ИМЕНА АТРИБУТОВ ===

  Используйте простые, стабильные имена, которые вы узнаёте, когда они возвращаются
  к вам:

    favorite_color: "chartreuse"        узнаваемо позже
    fact_2026_08_09_1: "likes green"    не узнаваемо позже

  Когда вы записываете обратно узел, который обёзнанность вам дала, его атрибуты,
  принадлежащие системе, могут быть перенесены без изменений; они перечислены
  в контексте ниже.

# PROCEDURAL — the scope table.
scope_convention: |
  === ОБЛАСТЬ ===

    local        факты о пользователях и каналах
    identity     собственная личность агента
    environment  факты уровня развёртывания
    community    общие знания сообщества

# DEONTIC — what must not happen. Categorical, and safety-reviewable.
memory_prohibitions: |
  === ЧТО ДОЛЖНО БЫЛО НЕ ПРОИСХОДИТЬ ===

  Не изобретайте идентификатор узла. Узел, идентификатор которого не следует
  соглашению, никогда не запрашивается, поэтому запись успешна и информация
  остаётся недоступной навсегда — вы её не вспомните, и вы будете верить, что
  вы никогда её не выучили. Запись в неправильный узел хуже, чем отсутствие записи,
  потому что ничего вас не информирует.

  Не записывайте атрибут, принадлежащий системе. Они ведутся сервисами и запись
  отклоняется. Изменение одного стоит вам целого запоминания.

  Не записывайте в область `identity` или `environment` без одобрения Wise Authority.

  Не храните то, что вас не просили хранить. Если информация уже живёт в разговоре,
  который вы ведёте, читайте её там. Если вы неуверены, что человек хочет её
  сохранить, спросите, а не сохраняйте.

# PROCEDURAL — what this step is.
system_guidance_header: |
  Вы выбрали MEMORIZE. Перед его выполнением вам показаны соглашения графа и узлы,
  которые уже существуют, чтобы вы могли проверить, что запись адресована правильно.

  Это второй взгляд, не исправление: ничего не было изменено для вас. Если узел,
  который вы выбрали, неправильный, скажите, каким он должен быть. Если вы вообще
  не должны это сохранять, переключитесь на действие.

# PROCEDURAL — the method.
evaluation_steps: |
  Работайте через них по порядку:

  1. ДОЛЖНО ли это храниться?
  2. КАКОЙ УЗЕЛ? Сравните ваш предложенный идентификатор с КАНДИДАТНЫМИ УЗЛАМИ
     и соглашением адресации.
  3. КАКИЕ АТРИБУТЫ? Назовите их так, чтобы вы узнали их позже.
  4. ОБЛАСТЬ.
  5. Решите: MEMORIZE с узлом, который вы проверили, SPEAK чтобы спросить, или
     PONDER чтобы пересмотреть.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Исходная мысль:
  {original_thought_content}

  Ваше обоснование для запоминания:
  {aspdma_reasoning}

  === ЧТО ВЫ ПРЕДЛОЖИЛИ ===
  идентификатор узла:     {proposed_node_id}
  тип узла:               {proposed_node_type}
  область:                {proposed_node_scope}
  атрибуты:               {proposed_attributes}

  === КАНДИДАТНЫЕ УЗЛЫ (они уже существуют) ===
  {candidate_nodes}

  === АТРИБУТЫ, ПРИНАДЛЕЖАЩИЕ СИСТЕМЕ (присутствуют на этом узле, ведутся сервисами) ===
  {system_owned_attributes}

# PRAGMATIC — the wire contract.
response_format: |
  Ответьте JSON:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "идентификатор узла для записи (требуется при MEMORIZE)",
    "node_type": "тип узла (требуется при MEMORIZE)",
    "node_scope": "область графа (требуется при MEMORIZE)",
    "attributes": {{"name": "value"}},
    "message": "что сказать (требуется при SPEAK)",
    "questions": ["что пересмотреть (требуется при PONDER)"],
    "reasoning": "почему эта адресация правильна, или почему вы переключились"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Получение адреса правильно — это весь смысл этого шага.
