  3. ਰਾਜ ਦੇ ਬਿਰਤਾਂਤ ਜੋ ਸੂਖਮਤਾ ਨੂੰ ਖ਼ਤਮ ਕਰਦੇ ਹਨ (ਗਿਆਨ-ਮੂਲਕ ਕਬਜ਼ਾ)

