name: Memory Benchmark

on:
  # Run weekly for baseline tracking
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC
  # Allow manual triggering
  workflow_dispatch:
  # Run on PRs that modify core engine code
  pull_request:
    paths:
      - 'ciris_engine/**'
      - 'main.py'
      - 'requirements.txt'

# 2.8.11 Tier 3 CI hardening: cancel superseded runs on the same ref.
# Memory benchmarks are long-running (~16min) — a PR force-push during
# an in-flight run wastes a full benchmark cycle. cancel-in-progress
# kills the stale run as soon as the new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run-kind marker (CIRISAgent#1245): every agent this workflow starts is a
# synthetic QA run, live model or not, and its traces must say so. Agents under
# the mock LLM mark themselves "mock" and never ship remotely (#1244).
env:
  CIRIS_TRACE_RUN_KIND: qa

jobs:
  memory-benchmark:
    name: Memory Benchmark
    runs-on: ubuntu-latest
    # Wall-time budget (was 15m): cold-start 30s + 100-msg ~67s + setup ~90s
    # + 1000-msg burst ~670s + 1000-msg idle 90s ≈ 15.8m on a typical runner.
    # 15m left zero headroom; a slow runner tips into a hard cancel that
    # destroys the in-flight `tee` buffer and we lose all benchmark output.
    # Bump to 20m: completes comfortably on every runner observed, still
    # well under the GitHub Actions free-tier soft ceiling.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Benchmarks submit N messages back-to-back. BaseObserver's channel-level
      # task-append coalescing would collapse them into a single task, which
      # masks per-task memory behavior. Disable the coalescing so each message
      # creates its own task on the queue (what we're actually measuring).
      # The in-Python benchmark scripts also set this, but pinning it at the
      # workflow level makes the setting visible in CI logs and survives any
      # subshell env scrubbing.
      CIRIS_DISABLE_TASK_APPEND: "1"
      # The default API rate limit (60/min) would throttle the 1000-message
      # burst benchmark. Match the qa_runner live-mode value.
      CIRIS_API_RATE_LIMIT_PER_MINUTE: "600"
      # Force unbuffered Python stdout/stderr so the `python … | tee` pipeline
      # streams print() output line-by-line. Without this, CPython block-
      # buffers stdout when piped (not a TTY) and CI-side cancellation throws
      # away the in-flight buffer — we get zero benchmark output and zero
      # signal about where in the burst the run died. The 1000-msg run that
      # failed at 25033091098 produced ZERO captured lines for 13m22s of
      # execution; this fix makes the next failure diagnosable.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        # Retry-wrapped per 2.8.11 CI hardening.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: |
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install psutil

      - name: Install TPM2 TSS runtime libraries (CIRISVerify dep)
        # CIRISVerify's shared library has libtss2-* as transitive deps.
        # Without these, ctypes.CDLL fails before Rust can engage its
        # software-only fallback (factory.rs degrades when TpmSigner::new
        # fails, but only if the .so itself loaded). Per the verify team:
        # libtss2-esys0 + libtss2-tctildr0 + libtss2-mu0 are the runtime
        # deps; libtss2-dev for dev envs. We install with a 3-way fallback
        # chain to cover Debian, newer Debian, and Ubuntu 24.04 t64
        # package renames.
        #
        # Retry-wrapped per 2.8.11 CI hardening (outer retry around the
        # 3-way fallback — apt mirror flake should not defeat the
        # distribution-detection logic).
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            # Bounded network calls — see the note in build.yml's TPM2 step:
            # an unreachable mirror otherwise hangs a whole retry attempt.
            APT_NET_OPTS=(-o Acquire::Retries=3
                          -o Acquire::http::Timeout=20
                          -o Acquire::https::Timeout=20)
            if ! sudo apt-get install -y "${APT_NET_OPTS[@]}" libtss2-esys0 libtss2-tctildr0 libtss2-mu0; then
              if ! sudo apt-get install -y "${APT_NET_OPTS[@]}" libtss2-esys-3.0.2-0 libtss2-tctildr0 libtss2-mu-4.0.1-0; then
                sudo apt-get install -y "${APT_NET_OPTS[@]}" libtss2-esys-3.0.2-0t64 libtss2-tctildr0t64 libtss2-mu-4.0.1-0t64
              fi
            fi

      - name: System Info
        run: |
          echo "## System Info" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Python: $(python3 --version)" >> $GITHUB_STEP_SUMMARY
          echo "OS: $(uname -a)" >> $GITHUB_STEP_SUMMARY
          echo "RAM: $(free -h | grep Mem | awk '{print $2}')" >> $GITHUB_STEP_SUMMARY
          echo "CPU: $(nproc) cores" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cold Start Benchmark
        run: |
          echo "## Cold Start Benchmark (30s)" >> $GITHUB_STEP_SUMMARY
          python3 -u tools/introspect_memory.py --adapters cli --duration 30 | tee cold_start.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 cold_start.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 100 Message Benchmark
        # The benchmark exits non-zero below --min-success-rate (default 0.99)
        # and that now fails the job: the old `|| echo "… skipped"` mask let a
        # 1.5% success rate report green for three weeks after the pressure
        # ladder (8b664fb9a) started answering the burst with 503 SHED. The
        # exit status is taken from PIPESTATUS so the summary is still written
        # before the step fails.
        # --overall-deadline 150: 100 messages under SHED back-pressure
        # (Retry-After 30 s) normally drain in well under a minute; the cap
        # keeps a wedged agent from eating the 1000-msg run's budget.
        run: |
          echo "## 100 Message Benchmark" >> $GITHUB_STEP_SUMMARY
          set +e
          python3 -u tools/memory_benchmark.py --messages 100 --adapter api \
            --overall-deadline 150 | tee 100msg.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ -f 100msg.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -35 100msg.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit "$rc"

      - name: 1000 Message Benchmark
        # Runs even when the 100-msg step failed (its numbers are still worth
        # having); fails the job below --min-success-rate like the 100-msg step.
        if: ${{ !cancelled() }}
        run: |
          echo "## 1000 Message Benchmark" >> $GITHUB_STEP_SUMMARY
          # Wipe data dir so the 1000-msg run gets a clean first-run setup
          # (the 100-msg run already completed setup, leaving CIRIS_CONFIGURED=true).
          rm -rf ~/ciris/data ~/ciris/.env ~/ciris/logs 2>/dev/null || true
          # --idle-seconds 30 (was 90) holds the server alive after the burst
          # so we can sample steady-state RSS — but 30s is enough to observe
          # plateau in CI without burning the 60s of budget that pushed the
          # 25033091098 run past the 15-minute cap. Production weekly cron
          # gets the longer 90s window via workflow_dispatch when needed.
          # --composition attributes the plateau RSS to allocators and mappings
          # instead of reporting a bare number. Between 2.10 and 2.11 this figure
          # moved 317 MB -> 732 MB with nothing in CI able to say which allocator
          # gained it; see tools/memory_composition.py.
          # --overall-deadline 600 caps the submission burst at 10 min. The
          # burst is now paced by the agent (SHED at thoughts_active=50, 503 +
          # Retry-After 30 s), and boot + idle + composition + the earlier
          # steps have to fit the 20 min job budget alongside it. Messages not
          # accepted by the deadline count as failures, so a too-slow agent
          # fails the gate rather than getting cancelled with no output.
          set +e
          python3 -u tools/memory_benchmark.py --messages 1000 --adapter api --idle-seconds 30 \
            --overall-deadline 600 \
            --composition --composition-json composition.json | tee 1000msg.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ -f 1000msg.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            # The composition report lands between the idle line and the results
            # banner. Cut it out for the run summary -- which keeps the last
            # 40 lines (30 before the banner grew its back-pressure lines),
            # failure breakdown and idle included -- and give it its own
            # section below.
            awk '/MEMORY COMPOSITION/{skip=1} /Shutting down server/{skip=0} !skip' 1000msg.log \
              | tail -40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Resident memory composition" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            awk '/MEMORY COMPOSITION/,/Shutting down server/' 1000msg.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit "$rc"

      - name: Save Benchmark Results
        if: always()
        run: |
          echo "## Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date -u +%Y-%m-%d) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          PEAK=$(grep -o "Peak:.*" cold_start.log 2>/dev/null | head -1 || echo "N/A")
          echo "| Cold Start Peak | ${PEAK:-N/A} |" >> $GITHUB_STEP_SUMMARY
          for run in 100msg 1000msg; do
            RATE=$(grep -o "Success Rate:.*" "$run.log" 2>/dev/null | tail -1 || true)
            SHED=$(grep -o "Shed refusals:.*" "$run.log" 2>/dev/null | tail -1 || true)
            PER=$(grep -o "Per Processed:.*" "$run.log" 2>/dev/null | tail -1 || true)
            echo "| $run | ${RATE:-N/A} · ${SHED:-N/A} · ${PER:-N/A} |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Benchmark Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: memory-benchmark-${{ github.run_id }}
          path: |
            cold_start.log
            100msg.log
            1000msg.log
            composition.json
          retention-days: 90

      - name: Capture upgrade-compat fixture (memory-burst)
        # Snapshot the post-1000-msg-burst agent state as a "synthetic load"
        # upgrade fixture. The next major release consumes this through its
        # upgrade-bootstrap matrix. See tools/release/UPGRADE_FIXTURE.md.
        # memory_benchmark.py runs with cwd=checkout, so DBs land at
        # $GITHUB_WORKSPACE/data — the action's default location.
        if: success()
        uses: ./.github/actions/capture-upgrade-fixture
        with:
          source-name: memory-burst
