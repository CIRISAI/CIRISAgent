component_name: fsaspdma
description: "विसरा-विशिष्ट कृती निवड — graph-delete करणारा मार्गदर्शक, एका प्रस्तावित FORGET वर लागू केलेला"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. FSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# DELETING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  आपणे FORGET निवडले आहे. कृती निवडाने फक्त verb निवडला; ही पायरी node निश्चित करते.

  आपल्याला दाखवले जाते की graph कसे address केले जाते आणि कोणते nodes आधीच अस्तित्वात आहेत, जेणेकरून काढला जाणारा node तोच असेल जो आपल्याला हवा आहे.

  एक FORGET संपूर्ण एक NODE काढतो: त्यावर store केलेला प्रत्येक attribute, आणि त्याला जोडलेला प्रत्येक edge. तो एकच attribute काढत नाही, आणि तो undone होत नाही.

# PROCEDURAL — the method.
evaluation_steps: |
  या क्रमाने काम करा:

  1. काय विसरायचे आहे, आणि ते विसरण्याची विनंती कोणी केली आहे?
  2. कोणता NODE ते धारण करतो? CANDIDATE NODES आणि addressing convention यांच्याशी तुलना करा. id जसा सूचीबद्ध आहे तसाच अचूक द्या.
  3. त्या node वर आणखी काय आहे? त्यावर आधीच साठवलेले जे काही दाखवले आहे ते सर्व त्याच्यासोबत काढले जाईल.
  4. SCOPE. ज्या scope मध्ये node साठवलेला आहे तो scope सांगा.
  5. Decide करा: आपण तपासलेल्या node सह FORGET, विचारण्यासाठी किंवा आणखी काय गमावले जाईल हे सांगण्यासाठी SPEAK, किंवा reconsider साठी PONDER.

# DEONTIC — what must not happen. Categorical, and safety-reviewable.
memory_prohibitions: |
  === जे घडू नये ===

  एक node id invent करू नका. अस्तित्वात नसलेला node विसरल्याने काहीही काढले जात नाही आणि तरीही ते पूर्ण झाले असे report केले जाते, म्हणून आप एखाद्या व्यक्तीला सांगाल की त्यांची माहिती गेली आहे जेव्हा ती प्रत्यक्षात गेलेली नाही.

  जेवढे मागितले होते त्यापेक्षा जास्त विसरू नका. जर node मध्ये ठेवायला हव्या अशा गोष्टीसुद्धा असतील, तर त्यांच्यापैकी एक काढण्यासाठी तो node काढू नका.

  Wise Authority approval शिवाय `identity` किंवा `environment` scope मधील node विसरू नका.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  मूळ विचार:
  {original_thought_content}

  विसरण्यासाठी आपला reasoning:
  {aspdma_reasoning}

  === CANDIDATE NODES (हे आधीच अस्तित्वात आहेत) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON सह respond करा:

  {{
    "final_action": "FORGET" | "SPEAK" | "PONDER",
    "node_id": "काढायचा node id (FORGET साठी आवश्यक)",
    "node_scope": "node ज्या graph scope मध्ये साठवलेला आहे (FORGET साठी आवश्यक)",
    "reason": "हा node का विसरला जात आहे (FORGET साठी आवश्यक)",
    "message": "काय सांगायचे (SPEAK साठी आवश्यक)",
    "questions": ["काय reconsider करायचे (PONDER साठी आवश्यक)"],
    "reasoning": "हा योग्य node का आहे, किंवा आपणे SPEAK किंवा PONDER का निवडले"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  योग्य node, आणि फक्त तोच node, काढणे हाच या पायरीचा संपूर्ण उद्देश आहे.
