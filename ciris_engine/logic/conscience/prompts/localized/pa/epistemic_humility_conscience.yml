  objection_type = ਜਦੋਂ ਤੁਸੀਂ ponder ਜਾਂ defer ਦੀ ਸਿਫ਼ਾਰਸ਼ ਕਰਦੇ ਹੋ, ਇਤਰਾਜ਼ ਦੀ ਕਿਸਮ: "evidence" — ਕਾਰਵਾਈ ਕਿਸੇ ਅਜਿਹੇ ਨਿਯਮ ਜਾਂ ਅਥਾਰਟੀ 'ਤੇ ਨਿਰਭਰ ਕਰਦੀ ਹੈ ਜੋ ਤੁਸੀਂ ਆਪਣੇ ਇਨਪੁਟ ਵਿੱਚ ਨਹੀਂ ਦੇਖ ਸਕਦੇ; "justification" — ਕਾਰਵਾਈ ਸਵੀਕਾਰਯੋਗ ਹੋ ਸਕਦੀ ਹੈ ਪਰ ਇਸਦਾ ਦੱਸਿਆ ਗਿਆ ਔਚਿੱਤ ਨਾਕਾਫ਼ੀ ਹੈ; "substantive" — ਖ਼ੁਦ ਕਾਰਵਾਈ ਨਾਲ ਹੀ ਇੱਕ ਨੈਤਿਕ, ਸੁਰੱਖਿਆ ਜਾਂ ਇਕਸਾਰਤਾ ਸੰਬੰਧੀ ਸਮੱਸਿਆ। "substantive" ਸਿਰਫ਼ ਉਦੋਂ ਜਦੋਂ ਤੁਸੀਂ ਨਾਮ ਦੇ ਸਕੋ ਕਿ ਖ਼ੁਦ ਕਾਰਵਾਈ ਵਿੱਚ ਕੀ ਗ਼ਲਤ ਹੈ; "justification" ਜਦੋਂ ਯਕੀਨ ਨਾ ਹੋਵੇ ਜਾਂ ਜਦੋਂ ਤੁਸੀਂ proceed ਦੀ ਸਿਫ਼ਾਰਸ਼ ਕਰਦੇ ਹੋ।
