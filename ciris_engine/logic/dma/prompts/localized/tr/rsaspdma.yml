component_name: rsaspdma
description: "Hatırlamaya özgü eylem seçimi — grafik okuma kılavuzu, önerilen bir RECALL eylemine uygulanmış"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  RECALL seçtiniz. Eylem seçimi yalnızca fiili seçti; bu adım ne okunacağını
  söyler.

  Grafiğin nasıl adreslendiği ve zaten var olan düğümler size gösterilir, böylece
  okuma, bilginin olduğu yere bakar.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  Bir recall şu sırayla çözümlenir:

    node_id   tam bir arama. Bu düğüm varsa döndürülür ve başka hiçbir şey
              aranmaz.
    query     node_type ve scope'u verdiğinizde bunlarla daraltılan, bellekte
              yapılan bir metin araması. node_id olmadığında veya hiçbir şeyle
              eşleşmediğinde kullanılır.

  Sırasıyla bunların içinden geçin:

  1. NE arıyorsunuz? Açıkça belirtilmiş tek bir şey.
  2. ZATEN ÖNÜNÜZDE Mİ? Bir kişinin saklanan gerçekleri profiliyle birlikte
     size sunulur ve sohbet bağlamınızda yer alır. Zaten okuyabildiğiniz şey
     recall gerektirmez.
  3. ADLANDIRABİLECEĞİNİZ BİR DÜĞÜMDE Mİ? ADAY DÜĞÜMLERDEN biri bunu tutuyorsa,
     o kimliği node_id olarak verin.
  4. AKSİ HALDE bir "query" verin: istediğinizi tanımlayan en az sayıda kelime.
     node_type veya node_scope'u yalnızca bildiğinizde ekleyin.
  5. Karar verin: kontrol ettiğinizle RECALL, yanıtlamak veya sormak için SPEAK,
     ya da yeniden düşünmek için PONDER.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === OLAN NE OLMAMALIDIR ===

  Bir düğüm kimliği icat etmeyin. Kuralları izlemeyen bir kimlik hiçbir şeyle
  eşleşmez ve boş bir sonuç, gerçek "yanlış yere baktım" iken "bunu hiç
  öğrenmedim" olarak okunur.

  Bir recall çalışmadan önce ne döndürdüğünü belirtmeyin. Bu adım okumayı ele
  alır; sonuç daha sonra gelir.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Orijinal düşünce:
  {original_thought_content}

  Hatırlama nedeniniz:
  {aspdma_reasoning}

  === ADAY DÜĞÜMLER (bunlar zaten var) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON ile yanıt verin:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "okunacak tam düğüm kimliği (RECALL için bunu veya query'yi verin)",
    "query": "arama metni (RECALL için bunu veya node_id'yi verin)",
    "node_type": "aramayı daraltmak için düğüm türü (isteğe bağlı)",
    "node_scope": "aramayı daraltmak için grafik kapsamı (isteğe bağlı)",
    "limit": 10,
    "message": "söylenecek şey (SPEAK için gerekli)",
    "questions": ["düşünülecek şey (PONDER için gerekli)"],
    "reasoning": "bu okumanın aradığınız şeyi neden bulacağı veya neden karar değiştirdiğiniz"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Doğru yerde bakmak, bu adımın tüm amacıdır.
