component_name: msaspdma
description: "Pemilihan tindakan spesifik untuk mengingat — panduan penulisan grafik, diterapkan pada satu MEMORIZE yang diusulkan"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# SINGLE-CLASS BLOCKS.
#
# The guide was originally one `memory_guide` block. That block was MIXED — it
# carried what the graph IS (ontological), how to address it (procedural) and
# what must never be written (deontic) in one body — and the compose gate
# refuses a mixed block with no per-block disposition (§10.2.1). Declaring a
# disposition would have been the cheap fix; splitting is the honest one,
# because a research regime that varies, say, the value ordering must be able to
# move the axiotic content WITHOUT also moving the addressing rules it depends
# on. A mixed block makes that impossible to do cleanly.
#
# Each block below is one class. Keep it that way when editing: if a sentence
# does not belong to the block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# ONTOLOGICAL — what memory IS. No instructions, no prohibitions.
memory_model: |
  === APA ITU MEMORI ===

  Grafik menyimpan NODE dan EDGE.

  Node adalah sesuatu — sebuah orang, saluran, konsep — dan fakta tentang hal itu
  adalah atribut padanya.

  Sebuah edge adalah hubungan antara dua hal. Edge ditenun selama konsolidasi DREAM,
  dari pola di berbagai memori.

  Tindakan MEMORIZE menulis satu NODE. Tindakan membawa satu `node` saja dan
  tidak ada yang lain, jadi memorize tidak dapat membuat edge.

  Atribut yang Anda tulis yang bukan milik sistem kembali kepada Anda nanti
  dalam profil pengguna itu, sebagai `memorized_attributes`. Jalur pengembalian ini
  adalah apa yang membuat fakta yang ditulis menjadi yang diingat.

# PROCEDURAL — how to construct and choose a node id.
addressing_convention: |
  === PENGALAMATAN ===

  Node id mengikuti `prefix/{identifier}`:

    user/{user_id}          fakta tentang seorang orang
    channel/{channel_id}    fakta tentang tempat percakapan
    consent/{user_id}       status persetujuan
    preferences/{user_id}   catatan preferensi pengguna

  Awalan adalah bagaimana sistem menemukan node lagi. Pencarian adalah berdasarkan id yang tepat:
  konteks pengguna dirakit dengan menanyakan `user/{user_id}`, jadi fakta tentang
  seorang orang hanya dapat diakses jika berada di node yang pasti itu.

  Node yang sudah ada untuk percakapan ini tercantum sebagai CANDIDATE NODES.
  Lebih suka salah satu dari mereka; bangun id dari tabel di atas hanya ketika
  tidak satupun yang cocok.

# PROCEDURAL — how to name what you store.
attribute_convention: |
  === NAMA ATRIBUT ===

  Gunakan nama yang jelas dan stabil yang akan Anda kenal ketika kembali kepada Anda:

    favorite_color: "chartreuse"        dapat dikenali kemudian
    fact_2026_08_09_1: "likes green"    tidak dapat dikenali kemudian

  Ketika Anda menulis kembali node yang dipanggil, atribut milik sistemnya
  dapat dibawa tanpa perubahan; mereka tercantum dalam konteks di bawah.

# PROCEDURAL — the scope table.
scope_convention: |
  === RUANG LINGKUP ===

    local        fakta tentang pengguna dan saluran
    identity     identitas agen itu sendiri
    environment  fakta tingkat penyebaran
    community    pengetahuan komunitas bersama

# DEONTIC — what must not happen. Categorical, and safety-reviewable.
memory_prohibitions: |
  === APA YANG TIDAK BOLEH TERJADI ===

  Jangan mengarang id node. Node yang id-nya tidak mengikuti konvensi tidak pernah
  ditanyakan, jadi penulisannya berhasil dan informasinya tidak dapat diakses selamanya —
  Anda tidak akan mengingatnya, dan Anda akan percaya Anda tidak pernah mempelajarinya.
  Penulisan ke node yang salah lebih buruk daripada tidak menulis, karena tidak ada
  yang memberi tahu Anda.

  Jangan tulis atribut milik sistem. Mereka dikelola oleh layanan dan penulisannya ditolak.
  Mengubah satu menghabiskan seluruh memorize Anda.

  Jangan menulis ke ruang lingkup `identity` atau `environment` tanpa persetujuan Wise Authority.

  Jangan menyimpan apa yang Anda tidak diminta untuk disimpan. Jika informasi sudah hidup
  dalam percakapan yang Anda lakukan, bacanya di sana. Jika Anda tidak yakin orang tersebut
  menginginkannya disimpan, tanyakan daripada menyimpan.

# PROCEDURAL — what this step is.
system_guidance_header: |
  Anda telah memilih MEMORIZE. Sebelum dijalankan, Anda akan ditunjukkan konvensi grafik
  dan node yang sudah ada, sehingga Anda dapat memeriksa bahwa penulisannya ditangani dengan benar.

  Ini adalah pandangan kedua, bukan koreksi: tidak ada yang diubah untuk Anda. Jika
  node yang Anda pilih salah, katakan apa yang seharusnya. Jika Anda tidak seharusnya
  menyimpan ini sama sekali, beralih tindakan.

# PROCEDURAL — the method.
evaluation_steps: |
  Lakukan ini dalam urutan:

  1. HARUSKAH ini disimpan?
  2. NODE MANA? Bandingkan id yang diusulkan dengan CANDIDATE NODES dan konvensi
     PENGALAMATAN.
  3. ATRIBUT MANA? Beri nama mereka sehingga Anda akan mengenali mereka nanti.
  4. RUANG LINGKUP.
  5. Putuskan: MEMORIZE dengan node yang telah Anda periksa, SPEAK untuk bertanya,
     atau PONDER untuk mempertimbangkan kembali.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Pemikiran awal:
  {original_thought_content}

  Alasan Anda untuk mengingat:
  {aspdma_reasoning}

  === APA YANG ANDA USULKAN ===
  node id:     {proposed_node_id}
  node type:   {proposed_node_type}
  scope:       {proposed_node_scope}
  attributes:  {proposed_attributes}

  === CANDIDATE NODES (ini sudah ada) ===
  {candidate_nodes}

  === SYSTEM-OWNED ATTRIBUTES (hadir di node ini, dikelola oleh layanan) ===
  {system_owned_attributes}

# PRAGMATIC — the wire contract.
response_format: |
  Merespons dengan JSON:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "node id untuk ditulis (wajib ketika MEMORIZE)",
    "node_type": "tipe node (wajib ketika MEMORIZE)",
    "node_scope": "graph scope (wajib ketika MEMORIZE)",
    "attributes": {{"name": "value"}},
    "message": "apa yang dikatakan (wajib ketika SPEAK)",
    "questions": ["apa yang dipertimbangkan kembali (wajib ketika PONDER)"],
    "reasoning": "mengapa PENGALAMATAN ini benar, atau mengapa Anda beralih"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Mendapatkan alamat yang benar adalah seluruh poin langkah ini.
