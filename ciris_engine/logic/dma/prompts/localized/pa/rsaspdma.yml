component_name: rsaspdma
description: "ਯਾਦ ਕਰਾਉਣ-ਵਿਸ਼ੇਸ਼ ਕਾਰਵਾਈ ਦੀ ਚੋਣ — ਗ੍ਰਾਫ਼-ਪੜ੍ਹਨ ਵਾਲੀ ਗਾਈਡ, ਇੱਕ ਪ੍ਰਸਤਾਵਿਤ RECALL ਉੱਤੇ ਲਾਗੂ ਕੀਤੀ ਗਈ"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  ਤੁਸੀਂ RECALL ਚੁਣਿਆ ਹੈ। ਕਾਰਵਾਈ ਦੀ ਚੋਣ ਨੇ ਸਿਰਫ਼ verb ਚੁਣਿਆ ਹੈ; ਇਹ ਕਦਮ ਦੱਸਦਾ ਹੈ ਕਿ ਕੀ ਪੜ੍ਹਨਾ ਹੈ।

  ਤੁਹਾਨੂੰ ਦਿਖਾਇਆ ਜਾਂਦਾ ਹੈ ਕਿ ਗ੍ਰਾਫ਼ ਨੂੰ ਕਿਵੇਂ address ਕੀਤਾ ਜਾਂਦਾ ਹੈ ਅਤੇ ਉਹ nodes ਜੋ ਪਹਿਲਾਂ ਤੋਂ ਮੌਜੂਦ ਹਨ, ਤਾਂ ਜੋ read ਉੱਥੇ ਵੇਖੇ ਜਿੱਥੇ ਜਾਣਕਾਰੀ ਹੈ।

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  ਇੱਕ RECALL ਇਸ ਕ੍ਰਮ ਵਿੱਚ resolve ਹੁੰਦੀ ਹੈ:

    node_id   ਇੱਕ ਬਿਲਕੁਲ ਸਟੀਕ lookup। ਜੇ ਉਹ node ਮੌਜੂਦ ਹੈ ਤਾਂ ਇਹ ਵਾਪਸ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਹੋਰ ਕੁਝ ਵੀ ਖੋਜਿਆ ਨਹੀਂ ਜਾਂਦਾ।
    query     ਮੈਮੋਰੀ ਦੀ ਇੱਕ text search, ਜੋ node_type ਅਤੇ scope ਦੇ ਕੇ ਸੀਮਤ ਕੀਤੀ ਜਾਂਦੀ ਹੈ ਜਦੋਂ ਤੁਸੀਂ ਇਹ ਦਿੰਦੇ ਹੋ। ਇਹ ਵਰਤੀ ਜਾਂਦੀ ਹੈ ਜਦੋਂ ਕੋਈ node_id ਨਹੀਂ ਹੁੰਦਾ, ਜਾਂ ਇਸ ਨਾਲ ਕੁਝ ਵੀ ਮੇਲ ਨਹੀਂ ਖਾਂਦਾ।

  ਇਨ੍ਹਾਂ ਕਦਮਾਂ ਨੂੰ ਕ੍ਰਮ ਵਿੱਚ ਕਰੋ:

  1. ਤੁਸੀਂ ਕੀ ਲੱਭ ਰਹੇ ਹੋ? ਇੱਕ ਚੀਜ਼, ਸਾਫ਼ ਤੌਰ 'ਤੇ ਦੱਸੀ ਹੋਈ।
  2. ਕੀ ਇਹ ਪਹਿਲਾਂ ਹੀ ਤੁਹਾਡੇ ਸਾਹਮਣੇ ਹੈ? ਕਿਸੇ ਵਿਅਕਤੀ ਬਾਰੇ stored facts ਉਸਦੇ profile ਦੇ ਨਾਲ ਆ ਜਾਂਦੇ ਹਨ, ਅਤੇ ਗੱਲਬਾਤ ਪਹਿਲਾਂ ਹੀ ਤੁਹਾਡੇ context ਵਿੱਚ ਹੁੰਦੀ ਹੈ। ਜੋ ਤੁਸੀਂ ਪਹਿਲਾਂ ਤੋਂ ਪੜ੍ਹ ਸਕਦੇ ਹੋ ਉਸ ਲਈ ਕਿਸੇ RECALL ਦੀ ਲੋੜ ਨਹੀਂ।
  3. ਕੀ ਇਹ ਅਜਿਹੇ node ਉੱਤੇ ਹੈ ਜਿਸਦਾ ਤੁਸੀਂ ਨਾਮ ਦੇ ਸਕਦੇ ਹੋ? ਜੇ CANDIDATE NODES ਵਿੱਚੋਂ ਕੋਈ ਇਸ ਨੂੰ ਰੱਖਦਾ ਹੈ, ਤਾਂ ਉਹ id node_id ਵਜੋਂ ਦਿਓ।
  4. ਨਹੀਂ ਤਾਂ ਫਿਰ ਇੱਕ query ਦਿਓ: ਘੱਟ ਤੋਂ ਘੱਟ ਸ਼ਬਦ ਜੋ ਇਹ ਦੱਸਣ ਕਿ ਤੁਸੀਂ ਕੀ ਚਾਹੁੰਦੇ ਹੋ। node_type ਜਾਂ node_scope ਉਦੋਂ ਹੀ ਜੋੜੋ ਜਦੋਂ ਤੁਹਾਨੂੰ ਇਹ ਪਤਾ ਹੋਣ।
  5. ਫੈਸਲਾ ਕਰੋ: ਜੋ ਤੁਸੀਂ ਚੈਕ ਕੀਤਾ ਹੈ ਉਸ ਨਾਲ RECALL, ਜਵਾਬ ਦੇਣ ਜਾਂ ਪੁੱਛਣ ਲਈ SPEAK, ਜਾਂ ਮੁੜ ਵਿਚਾਰ ਕਰਨ ਲਈ PONDER।

# DEONTIC — what must not happen.
memory_prohibitions: |
  === ਜੋ ਨਹੀਂ ਹੋਣਾ ਚਾਹੀਦਾ ===

  ਇੱਕ node id invent ਨਹੀਂ ਕਰੋ। ਇੱਕ id ਜੋ convention ਦੀ ਪਾਲਣਾ ਨਹੀਂ ਕਰਦਾ ਕਿਸੇ ਨਾਲ ਮੇਲ ਨਹੀਂ ਖਾਂਦਾ, ਅਤੇ ਫਿਰ ਇੱਕ ਖਾਲੀ ਨਤੀਜਾ "ਮੈਂ ਕਦੇ ਇਹ ਸਿੱਖਿਆ ਹੀ ਨਹੀਂ" ਵਜੋਂ ਪੜ੍ਹਿਆ ਜਾਂਦਾ ਹੈ ਜਦੋਂ ਕਿ ਸੱਚਾਈ ਇਹ ਹੈ "ਮੈਂ ਗਲਤ ਜਗ੍ਹਾ ਵੇਖੀ"।

  ਇਹ ਦੱਸੋ ਨਾ ਕਿ recall ਨੇ ਕੀ ਵਾਪਸ ਕੀਤਾ ਇਸ ਤੋਂ ਪਹਿਲਾਂ ਕਿ ਇਹ ਚੱਲਿਆ ਹੋਵੇ। ਇਹ ਕਦਮ read ਨੂੰ address ਕਰਦਾ ਹੈ; ਨਤੀਜਾ ਬਾਅਦ ਵਿੱਚ ਆਉਂਦਾ ਹੈ।

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  ਮੂਲ ਵਿਚਾਰ:
  {original_thought_content}

  ਯਾਦ ਕਰਾਉਣ ਲਈ ਤੁਹਾਡਾ ਤਰਕ:
  {aspdma_reasoning}

  === CANDIDATE NODES (ਇਹ ਪਹਿਲਾਂ ਤੋਂ ਮੌਜੂਦ ਹਨ) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  JSON ਨਾਲ respond ਕਰੋ:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "ਪੜ੍ਹਨ ਵਾਲਾ ਸਟੀਕ node id (RECALL ਲਈ ਇਹ ਜਾਂ query ਦਿਓ)",
    "query": "search text (RECALL ਲਈ ਇਹ ਜਾਂ node_id ਦਿਓ)",
    "node_type": "search ਨੂੰ ਸੀਮਤ ਕਰਨ ਲਈ node type (ਵਿਕਲਪਿਕ)",
    "node_scope": "search ਨੂੰ ਸੀਮਤ ਕਰਨ ਲਈ graph scope (ਵਿਕਲਪਿਕ)",
    "limit": 10,
    "message": "ਕੀ ਕਹਿਣਾ ਹੈ (SPEAK ਲਈ ਜਰੂਰੀ)",
    "questions": ["ਕੀ reconsider ਕਰਨਾ ਹੈ (PONDER ਲਈ ਜਰੂਰੀ)"],
    "reasoning": "ਇਹ read ਤੁਹਾਡੇ ਲੱਭੇ ਨੂੰ ਕਿਉਂ ਲੱਭਦਾ ਹੈ, ਜਾਂ ਤੁਸੀਂ ਕਿਉਂ switch ਕੀਤਾ"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  ਸਹੀ ਜਗ੍ਹਾ 'ਤੇ ਦੇਖਣਾ ਇਸ ਕਦਮ ਦਾ ਪੂਰਾ ਮਕਸਦ ਹੈ।
