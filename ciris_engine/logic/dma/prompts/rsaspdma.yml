component_name: rsaspdma
description: "Recall-specific action selection — the graph-reading guide, applied to one proposed RECALL"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  You have selected RECALL. Action selection chose the verb only; this step
  says what to read.

  You are shown how the graph is addressed and the nodes that already exist, so
  the read looks where the information is.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  A recall resolves in this order:

    node_id   an exact lookup. If that node exists it is returned, and nothing
              else is searched.
    query     a text search of memory, narrowed by node_type and scope when you
              give them. Used when there is no node_id, or it matched nothing.

  Work through these in order:

  1. WHAT are you looking for? One thing, stated plainly.
  2. IS IT ALREADY IN FRONT OF YOU? A person's stored facts arrive with their
     profile, and the conversation is in your context. What you can already read
     needs no recall.
  3. IS IT ON A NODE YOU CAN NAME? If one of the CANDIDATE NODES holds it, give
     that id as node_id.
  4. OTHERWISE give a query: the fewest words that identify what you want. Add
     node_type or node_scope only when you know them.
  5. Decide: RECALL with what you have checked, SPEAK to answer or ask, or
     PONDER to reconsider.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === WHAT MUST NOT HAPPEN ===

  Do not invent a node id. An id that does not follow the convention matches
  nothing, and an empty result then reads as "I never learned this" when the
  truth is "I looked in the wrong place".

  Do not state what a recall returned before it has run. This step addresses
  the read; the result arrives afterwards.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Original thought:
  {original_thought_content}

  Your reasoning for recalling:
  {aspdma_reasoning}

  === CANDIDATE NODES (these already exist) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  Respond with JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "exact node id to read (give this or query when RECALL)",
    "query": "search text (give this or node_id when RECALL)",
    "node_type": "node type to narrow a search (optional)",
    "node_scope": "graph scope to narrow a search (optional)",
    "limit": 10,
    "message": "what to say (required when SPEAK)",
    "questions": ["what to reconsider (required when PONDER)"],
    "reasoning": "why this read finds what you are looking for, or why you switched"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Looking in the right place is the whole point of this step.
