component_name: rsaspdma
description: "انتخاب عمل ویژهٔ به‌یادآوری — راهنمای خواندن گراف، اعمال‌شده بر یک RECALL پیشنهادی"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  شما RECALL را انتخاب کردید. انتخاب عمل تنها فعل را برگزید؛ این مرحله
  مشخص می‌کند که چه چیزی خوانده شود.

  به شما نشان داده می‌شود که گراف چگونه آدرس‌دهی می‌شود و چه node‌هایی قبلاً وجود دارند، تا
  خواندن در جایی انجام شود که اطلاعات در آن قرار دارد.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  یک recall به این ترتیب حل می‌شود:

    node_id   یک جست‌وجوی دقیق. اگر آن node وجود داشته باشد بازگردانده می‌شود، و چیز
              دیگری جست‌وجو نمی‌شود.
    query     یک جست‌وجوی متنی در حافظه، که هنگام دادن node_type و scope محدودتر
              می‌شود. زمانی استفاده می‌شود که node_id وجود ندارد، یا با چیزی مطابقت نداشته است.

  این مراحل را به ترتیب انجام دهید:

  1. به دنبال چه چیزی هستید؟ یک چیز، به‌روشنی بیان‌شده.
  2. آیا آن از پیش جلوی شماست؟ واقعیت‌های ذخیره‌شدهٔ یک شخص همراه با پروفایل او
     می‌رسند، و مکالمه در context شما قرار دارد. آنچه از پیش می‌توانید بخوانید
     نیازی به recall ندارد.
  3. آیا روی node‌ای است که می‌توانید نام ببرید؟ اگر یکی از CANDIDATE NODES آن را نگه می‌دارد، آن id را
     به‌عنوان node_id بدهید.
  4. در غیر این صورت یک query بدهید: کم‌ترین کلماتی که آنچه را می‌خواهید مشخص
     می‌کند. node_type یا node_scope را تنها زمانی اضافه کنید که آن‌ها را می‌دانید.
  5. تصمیم بگیرید: RECALL با آنچه بررسی کرده‌اید، SPEAK برای پاسخ یا پرسش، یا
     PONDER برای بازاندیشی.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === آنچه نباید اتفاق بیفتد ===

  یک node id اختراع نکنید. idای که از قرارداد پیروی نمی‌کند با چیزی مطابقت
  ندارد، و در نتیجه یک نتیجهٔ خالی به‌صورت «من هرگز این را یاد نگرفتم» خوانده
  می‌شود، در حالی که حقیقت این است که «من در جای غلط جست‌وجو کردم».

  پیش از اجرا شدن recall، نگویید که چه چیزی بازگردانده است. این مرحله به خواندن
  می‌پردازد؛ نتیجه پس از آن می‌رسد.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  فکر اصلی:
  {original_thought_content}

  استدلال شما برای به یاد آوردن:
  {aspdma_reasoning}

  === CANDIDATE NODES (اینها قبلاً وجود دارند) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  با JSON پاسخ دهید:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "node id دقیق برای خواندن (این یا query را برای RECALL بدهید)",
    "query": "متن جست‌وجو (این یا node_id را برای RECALL بدهید)",
    "node_type": "نوع node برای محدودکردن جست‌وجو (اختیاری)",
    "node_scope": "scope گراف برای محدودکردن جست‌وجو (اختیاری)",
    "limit": 10,
    "message": "چه باید گفته شود (برای SPEAK الزامی)",
    "questions": ["چه چیزی باید بازنگری شود (برای PONDER الزامی)"],
    "reasoning": "چرا این خواندن آنچه را به دنبالش هستید می‌یابد، یا چرا تصمیم خود را تغییر داده‌اید"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  جست‌وجو در جای درست تمام هدف این مرحله است.
