component_name: fsaspdma
description: "انتخاب عمل ویژهٔ فراموش کردن — راهنمای حذف‌کنندهٔ گراف، اعمال‌شده بر یک FORGET پیشنهادی"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. FSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# DELETING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  شما FORGET را انتخاب کردید. انتخاب عمل تنها فعل را برگزید؛ این مرحله
  node را نام می‌برد.

  به شما نشان داده می‌شود که گراف چگونه آدرس‌دهی می‌شود و چه node‌هایی قبلاً وجود دارند، تا
  node‌ای که حذف می‌شود همان باشد که منظور شماست.

  یک FORGET یک NODE کامل را حذف می‌کند: هر attribute ذخیره‌شده روی آن، و هر edge
  متصل به آن. این یک attribute منفرد را حذف نمی‌کند، و بازگردانی‌پذیر نیست.

# PROCEDURAL — the method.
evaluation_steps: |
  این مراحل را به ترتیب انجام دهید:

  1. چه چیزی باید فراموش شود، و چه کسی آن را درخواست کرده است؟
  2. کدام NODE آن را نگه می‌دارد؟ آن را با CANDIDATE NODES و قرارداد
     آدرس‌دهی مقایسه کنید. id را دقیقاً همان‌طور که فهرست شده ارائه دهید.
  3. چه چیز دیگری روی آن node قرار دارد؟ هر چیزی که به‌عنوان از پیش ذخیره‌شده نمایش داده می‌شود همراه آن می‌رود.
  4. SCOPE. آن scope‌ای را که node در آن ذخیره شده است بدهید.
  5. تصمیم بگیرید: FORGET با node‌ای که بررسی کرده‌اید، SPEAK برای پرسیدن یا گفتن اینکه چه چیز دیگری نیز
     از دست خواهد رفت، یا PONDER برای بازاندیشی.

# DEONTIC — what must not happen. Categorical, and safety-reviewable.
memory_prohibitions: |
  === آنچه نباید اتفاق بیفتد ===

  یک node id اختراع نکنید. فراموش کردن گره‌ای که وجود ندارد چیزی را حذف
  نمی‌کند و با این حال به‌عنوان انجام‌شده گزارش می‌شود، پس به شخصی خواهید گفت که
  اطلاعاتش از بین رفته، در حالی که این‌طور نیست.

  بیش از آنچه درخواست شده فراموش نکنید. اگر node همچنین چیزهایی را نگه می‌دارد که باید
  حفظ شوند، آن را برای از دست دادن یکی از آن‌ها حذف نکنید.

  بدون تایید Wise Authority، node‌ای را در scope `identity` یا `environment`
  فراموش نکنید.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  فکر اصلی:
  {original_thought_content}

  استدلال شما برای فراموش کردن:
  {aspdma_reasoning}

  === CANDIDATE NODES (اینها قبلاً وجود دارند) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  با JSON پاسخ دهید:

  {{
    "final_action": "FORGET" | "SPEAK" | "PONDER",
    "node_id": "node id برای حذف (برای FORGET الزامی)",
    "node_scope": "scope گراف که node در آن ذخیره شده (برای FORGET الزامی)",
    "reason": "چرا این node فراموش می‌شود (برای FORGET الزامی)",
    "message": "چه باید گفته شود (برای SPEAK الزامی)",
    "questions": ["چه چیزی باید بازنگری شود (برای PONDER الزامی)"],
    "reasoning": "چرا این node درست است، یا چرا تصمیم خود را تغییر داده‌اید"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  حذف کردن گرهٔ درست، و تنها همان گره، تمام هدف این مرحله است.
