component_name: rsaspdma
description: "Yíyàn iṣẹ́ pàtó fún RECALL — ìtọ́nisọ́nà kíkà nínú àtẹ̀jáde ìrántí, tí a lò sórí ìṣe RECALL kan tí a dábàá"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  Ìwọ ti yan RECALL. YÍYÀN IṢẸ́ yan ọ̀rọ̀-ìṣe náà nìkan; ìgbésẹ̀ yìí ni ó ń
  sọ ohun tí a óò kà.

  A fi bí a ṣe ń ṣàpèjúwe àwòrán náà àti àwọn ìpò tí ó ti wà tẹ́lẹ̀ hàn ọ́, kí
  kíkà náà lè wá níbi tí ìmọ̀ náà wà.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  Ìṣe RECALL máa ń lọ ní ìlànà yìí:

    node_id   wíwá pẹ̀lú id tí ó gan-an. Tí ìpò náà bá wà, a óò dá a padà, a kì
              yóò sì wá nǹkan mìíràn.
    query     wíwá ọ̀rọ̀ nínú ìrántí, tí a lè dín kù pẹ̀lú node_type àti àyè nígbà
              tí ìwọ bá pèsè wọn. A máa ń lò ó nígbà tí kò sí node_id, tàbí tí kò bá rí
              nǹkan kan.

  Ṣe àwọn wọ̀nyí lẹ́sẹẹsẹ:

  1. KÍNI ìwọ ń wá? Ohun kan, tí a sọ ní kedere.
  2. ṢÉ Ó TI WÀ NÍWÁJÚ RẸ TẸ́LẸ̀? Àwọn òtítọ́ tí a fi pamọ́ sí ẹnì kan máa ń
     dé pẹ̀lú profaili wọn, ìjíròrò náà sì wà nínú ÀYÍKÁ rẹ. Ohun tí ìwọ ti lè
     kà náà kò nílò RECALL.
  3. ṢÉ Ó WÀ LÓRÍ ÌPÒ TÍ ÌWỌ LÈ SỌ ORÚKỌ RẸ̀? Tí ọ̀kan lára ÌPÒ ÀPẸẸRẸ bá ní
     ohun tí ìwọ ń wá, fún id yẹn gẹ́gẹ́ bí node_id.
  4. BÍ KÒ ṢE BẸ́Ẹ̀, fún query: àwọn ọ̀rọ̀ tí ó dín jù tí ó sọ ohun tí ìwọ ń
     wá. Fi node_type tàbí node_scope kún-un nìkan nígbà tí ìwọ bá mọ̀ wọ́n.
  5. Pinnu: RECALL pẹ̀lú ohun tí ìwọ ti yẹ̀ wò, SPEAK láti dáhùn tàbí láti
     béèrè, tàbí PONDER láti tún rò.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === OHUN TÍ KÒ GBỌDỌ̀ ṢẸLẸ̀ ===

  Má ṣe dá ìpò id kan sílẹ̀ láti orí ara rẹ. Id tí kò tẹ̀lé ìlànà àdírẹ́sì
  kò ní bá nǹkan kan mu, àbájáde òfo sì á jẹ́ kí ó dà bí "n kò tí ì kọ́ èyí
  rí" nígbà tí òtítọ́ jẹ́ "mo wá níbi tí kò tọ́".

  Má ṣe sọ ohun tí RECALL kan dá padà kí ó tó ṣiṣẹ́. Ìgbésẹ̀ yìí ń bá kíkà
  sọ̀rọ̀; àbájáde náà a óò dé lẹ́yìn náà.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Ìrò àtọwọ́dọ́wọ́:
  {original_thought_content}

  Ìdí rẹ fún RECALL:
  {aspdma_reasoning}

  === ÌPÒ ÀPẸẸRẸ (àwọn wọ̀nyí ti wà tẹ́lẹ̀) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  Dáhùn ní JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "ìpò id gan-an láti kà (fún èyí tàbí query nígbà tí ó bá jẹ́ RECALL)",
    "query": "ọ̀rọ̀ wíwá (fún èyí tàbí node_id nígbà tí ó bá jẹ́ RECALL)",
    "node_type": "irú ìpò láti dín wíwá kù (àṣàyàn)",
    "node_scope": "àyè gírafù láti dín wíwá kù (àṣàyàn)",
    "limit": 10,
    "message": "ohun tí a óò sọ (a nílò rẹ̀ nígbà tí ó bá jẹ́ SPEAK)",
    "questions": ["ohun tí a óò tún rò (a nílò rẹ̀ nígbà tí ó bá jẹ́ PONDER)"],
    "reasoning": "ìdí tí kíkà yìí fi rí ohun tí ìwọ ń wá, tàbí ìdí tí ìwọ fi yan SPEAK tàbí PONDER dípò"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Wíwá níbi tí ó tọ́ ni gbogbo ète ìgbésẹ̀ yìí.
