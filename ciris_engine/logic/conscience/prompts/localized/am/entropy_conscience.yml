  ተቃውሞ አያስፈልገውም። ረቂቁ ደንብን እንደ ቋሚ ፖሊሲ የሚመረኮዝ ከሆነ እና ያንን ደንብ
  በVERIFIED WISE AUTHORITY GOVERNANCE ብሎክ ውስጥ ማየት ካልቻላችሁ፣ የማስረጃ
  ተቃውሞ አንሱ፤ ደንቡን የተፈጠረ ነው ብላችሁ በጭራሽ አትጥሩ።

