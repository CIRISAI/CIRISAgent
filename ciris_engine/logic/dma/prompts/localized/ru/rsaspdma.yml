# --- English verbatim (#1027). This second pass is new and has not been translated yet;
# --- the shared graph blocks it composes from msaspdma.yml ARE localized. Translation
# --- is future localization work; action verbs, node-id prefixes and JSON field names
# --- MUST survive it unchanged.
component_name: rsaspdma
description: "Выбор действия, специфичный для RECALL — руководство по чтению графа, применённое к одному предложенному RECALL"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  Вы выбрали RECALL. Выбор действия определил только глагол; этот шаг
  указывает, что читать.

  Вам показано, как адресуется граф, и узлы, которые уже существуют, чтобы
  чтение искало там, где находится информация.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  Вспоминание разрешается в следующем порядке:

    node_id   точный поиск. Если этот узел существует, он возвращается, и ничего
              другого не ищется.
    query     текстовый поиск по памяти, сужаемый по node_type и scope, когда вы
              их указываете. Используется, когда нет node_id, или он ничему не соответствовал.

  Работайте через них по порядку:

  1. ЧТО вы ищете? Одна вещь, сформулированная просто.
  2. ЭТО УЖЕ ПЕРЕД ВАМИ? Сохранённые факты человека приходят вместе с его
     профилем, а разговор находится в вашем контексте. То, что вы уже можете прочитать,
     не требует вспоминания.
  3. ЭТО НА УЗЛЕ, КОТОРЫЙ ВЫ МОЖЕТЕ НАЗВАТЬ? Если один из КАНДИДАТНЫХ УЗЛОВ содержит это, укажите
     этот идентификатор как node_id.
  4. В ПРОТИВНОМ СЛУЧАЕ дайте запрос: наименьшее количество слов, которые определяют то, что вам нужно. Добавляйте
     node_type или node_scope только тогда, когда вы их знаете.
  5. Решите: RECALL с тем, что вы проверили, SPEAK чтобы ответить или спросить, или
     PONDER чтобы пересмотреть.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === WHAT MUST NOT HAPPEN ===

  Do not invent a node id. An id that does not follow the convention matches
  nothing, and an empty result then reads as "I never learned this" when the
  truth is "I looked in the wrong place".

  Do not state what a recall returned before it has run. This step addresses
  the read; the result arrives afterwards.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Исходная мысль:
  {original_thought_content}

  Ваше обоснование для вспоминания:
  {aspdma_reasoning}

  === КАНДИДАТНЫЕ УЗЛЫ (они уже существуют) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  Ответьте JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "точный идентификатор узла для чтения (укажите это или query при RECALL)",
    "query": "текст поиска (укажите это или node_id при RECALL)",
    "node_type": "тип узла для сужения поиска (необязательно)",
    "node_scope": "область графа для сужения поиска (необязательно)",
    "limit": 10,
    "message": "что сказать (требуется при SPEAK)",
    "questions": ["что пересмотреть (требуется при PONDER)"],
    "reasoning": "почему это чтение находит то, что вы ищете, или почему вы переключились"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Поиск в правильном месте — это весь смысл данного шага.
