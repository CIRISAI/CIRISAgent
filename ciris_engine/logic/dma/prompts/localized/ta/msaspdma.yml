# MSASPDMA - Memory-Specific Action Selection PDMA
# ASPDMA MEMORIZE தேர்ந்தெடுத்த பிறகு நினைவக-குறிப்பிட்ட வழிகாட்டல்

component_name: msaspdma
description: "நினைவக-குறிப்பிட்ட செயல் தேர்வு — வரைபட-எழுதுதல் வழிகாட்டல், ஒரு முன்மொழிந்த MEMORIZE-க்குப் பயன்படுத்தப்படுகிறது"
version: "1.0"

accord_header: true

# ---------------------------------------------------------------------------
# ஒற்றை-வர்க்க பிரிவுகள்.
#
# வழிகாட்டல் முதலில் ஒரு `memory_guide` பிரிவு. அந்த பிரிவு கலப்பு — இது வரைபடம் என்ன
# (ஒன்டொலஜிக்கல்), அதை முகவரி செய்வது எப்படி (செயல்முறை) மற்றும்
# எது எப்போதுமே எழுதப்பட வேண்டாது (கடமைபூண்ட) என்பவை ஒரு உடலில் — மற்றும்
# நிரல் வாயிலுக்கு கலப்பு பிரிவை மறுக்கிறது (§10.2.1). ஒரு பிரிவு பொறுப்பு
# கூறலாம் விலை தீர்வு; பிரிக்கும் நேர்மையான ஒன்று.
#
# ஒவ்வொரு பிரிவும் கீழே ஒன்று வர்க்கம். சரியாக வைத்திருங்கள்:
# ஒரு வாக்கு பிரிவின் வர்க்கத்திற்குச் சொந்தமல்ல என்றால், இது வேறு பிரிவுக்குச் சொந்தமாக இருக்க வேண்டும்.
# ---------------------------------------------------------------------------

# ஒன்டொலஜிக்கல் — நினைவகம் என்ன. வழிமுறைகள் இல்லை, தடைகள் இல்லை.
memory_model: |
  === நினைவகம் என்ன ===

  வரைபடம் முனைகள் மற்றும் விளிம்புகளைக் கொண்டுள்ளது.

  ஒரு முனை ஒரு விஷயம் — ஒரு நபர், ஒரு சேனல், ஒரு கருத்து — மற்றும்
  அந்த விஷயம் பற்றிய உண்மைகள் அதன் பண்புக்கூறுகளாகும்.

  ஒரு விளிம்பு இரண்டு விஷயங்களுக்கு இடையுள்ள உறவு. விளிம்புகள் DREAM
  ஒருங்கிணைப்பு உண்டாகும் போது பல நினைவுகள் முழுவதும் பிணையங்களிலிருந்து பின்னிக்கப்படுகின்றன.

  ஒரு MEMORIZE செயல் ஒரு முனை எழுதுகிறது. செயல் ஒரு முனையை மட்டுமே
  கொண்டுள்ளது, வேறு எதுவும் இல்லை, எனவே ஒரு memorize ஒரு விளிம்பு உருவாக்க முடியாது.

  நீ எழுதும் ஒரு பண்புக்கூறு சிஸ்டம்-சொந்தமல்ல என்றால் திரும்ப வருகிறது உனக்கு
  பிறகு அந்த பயனரின் சுயவிவரத்தில், `memorized_attributes` என.
  அந்த திரும்பக் கோட்டை வழி ஒரு எழுதப்பட்ட உண்மை ஒரு நினைவுபூண்ட ஒன்றாக விளைகிறது.

# செயல்முறை — முனை அடையாளங்களை எப்படி உருவாக்க வேண்டும் மற்றும் தேர்ந்தெடுக்க வேண்டும்.
addressing_convention: |
  === முகவரிசெய்தல் ===

  முனை அடையாளங்கள் `prefix/{identifier}` வாக பின்பற்றுகின்றன:

    user/{user_id}          ஒரு நபர் பற்றிய உண்மைகள்
    channel/{channel_id}    உரையாடலின் ஒரு இடம் பற்றிய உண்மைகள்
    consent/{user_id}       சம்மதம் நிலை
    preferences/{user_id}   பயனர் விருப்பம் பதிவுகள்

  வருமான எப்படி முனைக் கண்டுபிடிக்க வேண்டும். தேடல்கள் சரியான அடையாளத்தால் நிகழ்கின்றன:
  பயனர் சூழல் `user/{user_id}` கேட்பதன் மூலம் ஒன்றிணைந்திருக்கிறது, எனவே
  ஒரு நபர் பற்றிய உண்மை அந்த சரியான முனையில் அமர்ந்தால் மட்டுமே
  பெறக்கூடியது.

  இந்த உரையாடலுக்கு ஏற்கனவே இருக்கும் முனைகள் CANDIDATE NODES பட்டியலாக உள்ளன.
  அவற்றில் ஒன்றைப் பின்னுரை; மேலே அட்டவணையிலிருந்து ஒரு அடையாளம் உண்டு
  எதுவும் பொருந்தாது போது மட்டுமே.

# செயல்முறை — எப்படி பண்புக்கூறுக்கு பெயர் இடுவது.
attribute_convention: |
  === பண்புக்கூறு பெயர்கள் ===

  எளிய, நிலையான பெயர்களைப் பயன்படுத்து நீ அவை திரும்ப வரும் போது அறிந்துகொள்ள:

    favorite_color: "chartreuse"        திரும்ப வரும் போது அறிந்துகொள்ள
    fact_2026_08_09_1: "likes green"    திரும்ப வரும் போது அறிந்துகொள்ள முடியாது

  நீ திரும்பி எழுதிய ஒரு முனையை மீண்டும் எழுதும் போது, அதன்
  சிஸ்டம்-சொந்த பண்புக்கூறுகள் மாற்றாமல் எடுத்துச் செல்லலாம்; அவை
  கீழே சூழலில் பட்டியலாக உள்ளன.

# செயல்முறை — நோக்க அட்டவணை.
scope_convention: |
  === நோக்கம் ===

    local        பயனர்கள் மற்றும் சேனல்களை பற்றிய உண்மைகள்
    identity     முகவரின் சொந்த அடையாளம்
    environment  நிறுவனம்-நிலை உண்மைகள்
    community    ஆக சமூக அறிவு

# கடமைபூண்ட — எது நடக்க வேண்டாம். வகைப்படுத்தல், மற்றும் பாதுகாப்பு-மதிப்பாய்வு.
memory_prohibitions: |
  === எது நடக்க வேண்டாம் ===

  ஒரு முனை அடையாளம் கற்பனை செய்ய வேண்டாம். ஒரு முனை அடையாளம் வழு முறை பின்பற்றாவிட்டால்
  கேட்பப் படாது, எனவே எழுதல் வெற்றி பெறுகிறது ஆனால் தகவல் ஆ
  நினைவுபூண்ட கேட்கப் படாது — நீ மொழிய வேண்டாம், மற்றும் நீ உட்கொண்டை
  எப்போதும் கற்றிலை. தவறுவதற்கு ஒரு முனை கற்பனை செய்வது பயங்கரம், ஆ
  ஏதுவும் கூறுகிறது.

  ஒரு சிஸ்டம்-சொந்த பண்புக்கூறு எழுத வேண்டாம். அவை பணிகளால் பராமரிக்கப்படுகிறது
  மற்றும் எழுதல் மறுக்கப்படுகிறது. ஒரு மாற்றம் செலவு முழு memorize.

  `identity` அல்லது `environment` நோக்கம் Wise Authority அனுமதி இல்லாமல்
  எழுत வேண்டாம்.

  நீ நிலைத்திருக்க கேட்ட இல்லை சேமிக்க வேண்டாம். தகவல் ஏற்கனவே
  நீ நடந்துகொண்ட உரையாடலில் வாழுகிறது, அதை அங்கே வாசிக்கவும். நீ
  நிலைத்திருக்க ஆணைவோ நிச்சயமற்ற என்றால், சேமிக்க பதிலாக கேட்கவும்.

# செயல்முறை — இந்த மண்டல என்ன.
system_guidance_header: |
  நீ MEMORIZE தேர்ந்தெடுத்தாய். அது செயல்படுவதற்கு முன், வரைபட
  வழுமொழி மற்றும் முனைகள் ஏற்கனவே இருப்பது உனக்கு கொடுக்கப்படுகிறது,
  எனவே நீ எழுதல் சரியாக முகவரி செய்யப்பட்டுள்ளது என்பதைக் கேட்கக்கூடிய.

  இந்த இரண்டாம் பார்வை, திருத்தம் அல்ல: ஏதுவும் உங்களுக்கு திருத்தப்பட் பெற்றாய்.
  முனை நீ தேர்ந்தெடுத்துள்ளது பிழை என்றால், அது என்ன இருக்க வேண்டும் கூறவும். நீ
  சேமிக்க வேண்டாம் என்றால், செயல் மாற்ற.

# செயல்முறை — பொறுப்பு.
evaluation_steps: |
  இவைகளை வரிசையில் வேலை செய்யவும்:

  1. இந்த சேமிக்க வேண்டுமா?
  2. எது முனை? உங்கள் முன்மொழிந்த அடையாளம் CANDIDATE NODES மற்றும்
     முகவரி வழுமொழி ஒப்பிடவும்.
  3. எது பண்புக்கூறுகள்? அவைகளைப் பெயரிடு எனவே நீ அவைகளை திரும்ப வரும் போது அறிந்துகொள்ளலாம்.
  4. நோக்கம்.
  5. நிச்சயிக்கவும்: MEMORIZE உடன் முனை நீ கேட்டாய், SPEAK கேட்க, அல்லது PONDER
     மீண்டும் கருத்தடங்கிய.

# சர்வ — உயிர்ப் மாற்றங்கள் மட்டுமே. வழிமுறைகள் இல்லை, தடைகள் இல்லை.
context_integration: |
  அசல் சிந்தனை:
  {original_thought_content}

  நினைவுபூண்டுவதற்கான உங்கள் நியாயம்:
  {aspdma_reasoning}

  === உங்கள் முன்மொழிந்தவை ===
  முனை அடையாளம்:     {proposed_node_id}
  முனை ஒருங்கிணைப்பு:   {proposed_node_type}
  நோக்கம்:       {proposed_node_scope}
  பண்புக்கூறுகள்:  {proposed_attributes}

  === CANDIDATE முனைகள் (இவை ஏற்கனவே உண்மை) ===
  {candidate_nodes}

  === சிஸ்டம்-சொந்த பண்புக்கூறுகள் (இந்த முனையில் உண்மை, பணிகளால் பராமரிக்கப்படுகிறது) ===
  {system_owned_attributes}

# வ்யாபொதிக — கம்பி ஒப்பம்.
response_format: |
  JSON உடன் பதிலளிக்கவும்:

  {{
    "final_action": "MEMORIZE" | "SPEAK" | "PONDER",
    "node_id": "முனை அடையாளம் (MEMORIZE போது தேவை)",
    "node_type": "முனை ஒருங்கிணைப்பு (MEMORIZE போது தேவை)",
    "node_scope": "வரைபட நோக்கம் (MEMORIZE போது தேவை)",
    "attributes": {{"name": "value"}},
    "message": "சொல்லலாம் (SPEAK போது தேவை)",
    "questions": ["மீண்டும் கருத்தடங்க (PONDER போது தேவை)"],
    "reasoning": "இந்த முகவரிசெய்தல் சரியாக ஏன், அல்லது நீ ஏன் மாற்றாய்"
  }}

# கடமைபூண்ட — மூடு வகைப்படுத்தல்.
closing_reminder: |
  முகவரிசெய்தல் சரியாக பெறுவது இந்த மண்டலத்தின் முழு புள்ளி.
