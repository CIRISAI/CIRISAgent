component_name: rsaspdma
description: "Pemilihan tindakan khusus-RECALL — panduan pembacaan graf, diterapkan pada satu RECALL yang diusulkan"
version: "1.0"
accord_header: true

# ---------------------------------------------------------------------------
# What the graph IS, how it is addressed and the scope table are NOT repeated
# here. RSASPDMA composes `memory_model`, `addressing_convention` and
# `scope_convention` from msaspdma.yml, so the three memory verbs read one
# description of the graph, in the thought's language. Only what is specific to
# READING lives in this file.
#
# SINGLE-CLASS BLOCKS, as in msaspdma.yml: if a sentence does not belong to the
# block's class, it belongs in another block.
# ---------------------------------------------------------------------------

# PROCEDURAL — what this step is.
system_guidance_header: |
  Anda telah memilih RECALL. Pemilihan tindakan hanya memilih kata kerjanya; langkah ini
  menyatakan apa yang akan dibaca.

  Anda ditunjukkan bagaimana graf dialamatkan dan node yang sudah ada, sehingga
  pembacaan mencari di tempat informasi tersebut berada.

# PROCEDURAL — how a recall resolves, and the method.
evaluation_steps: |
  Sebuah recall diselesaikan dalam urutan ini:

    node_id   pencarian yang persis. Jika node tersebut ada, ia dikembalikan, dan tidak
              ada yang lain yang dicari.
    query     pencarian teks pada memori, dipersempit oleh node_type dan scope jika Anda
              memberikannya. Digunakan ketika tidak ada node_id, atau tidak ada yang cocok.

  Lakukan ini dalam urutan:

  1. APA yang Anda cari? Satu hal, dinyatakan dengan jelas.
  2. APAKAH SUDAH ADA DI DEPAN ANDA? Fakta tersimpan seseorang datang bersama
     profil mereka, dan percakapan ada dalam konteks Anda. Apa yang sudah dapat Anda baca
     tidak memerlukan recall.
  3. APAKAH ADA PADA NODE YANG DAPAT ANDA SEBUTKAN? Jika salah satu CANDIDATE NODES
     menyimpannya, berikan id tersebut sebagai node_id.
  4. JIKA TIDAK, berikan query: kata-kata paling sedikit yang mengidentifikasi apa yang Anda inginkan. Tambahkan
     node_type atau node_scope hanya jika Anda mengetahuinya.
  5. Putuskan: RECALL dengan apa yang telah Anda periksa, SPEAK untuk menjawab atau bertanya, atau
     PONDER untuk mempertimbangkan kembali.

# DEONTIC — what must not happen.
memory_prohibitions: |
  === APA YANG TIDAK BOLEH TERJADI ===

  Jangan mengarang id node. Id yang tidak mengikuti konvensi tidak cocok dengan
  apa pun, dan hasil yang kosong kemudian terbaca seperti "Saya tidak pernah mempelajari ini" padahal
  kenyataannya adalah "Saya mencari di tempat yang salah".

  Jangan menyatakan apa yang dikembalikan oleh recall sebelum ia dijalankan. Langkah ini membahas
  pembacaan; hasilnya tiba setelahnya.

# CONTINGENT — runtime values only. No guidance, no prohibitions.
context_integration: |
  Pemikiran awal:
  {original_thought_content}

  Alasan Anda untuk mengingat kembali:
  {aspdma_reasoning}

  === CANDIDATE NODES (ini sudah ada) ===
  {candidate_nodes}

# PRAGMATIC — the wire contract.
response_format: |
  Merespons dengan JSON:

  {{
    "final_action": "RECALL" | "SPEAK" | "PONDER",
    "node_id": "id node persis yang akan dibaca (berikan ini atau query ketika RECALL)",
    "query": "teks pencarian (berikan ini atau node_id ketika RECALL)",
    "node_type": "tipe node untuk mempersempit pencarian (opsional)",
    "node_scope": "graph scope untuk mempersempit pencarian (opsional)",
    "limit": 10,
    "message": "apa yang dikatakan (wajib ketika SPEAK)",
    "questions": ["apa yang dipertimbangkan kembali (wajib ketika PONDER)"],
    "reasoning": "mengapa pembacaan ini menemukan apa yang Anda cari, atau mengapa Anda beralih"
  }}

# DEONTIC — the closing categorical.
closing_reminder: |
  Mencari di tempat yang benar adalah keseluruhan tujuan dari langkah ini.
